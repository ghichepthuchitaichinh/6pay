<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khám phá Việt Nam</title>
<!--
  CÁCH CHÈN VÀO index.html CỦA BẠN:
  1) Copy khối <style> bên dưới (các class đều có tiền tố "vv-" nên khó đụng hàng).
  2) Copy thẻ <div id="vnv-root"></div> vào chỗ bạn muốn hiển thị game.
  3) Copy khối <script> (nằm trong IIFE, không làm ô nhiễm biến toàn cục).
  Phần "CHỈ DÀNH CHO TRANG THỬ" có thể bỏ khi chèn.
-->
<style>
/* ===== CHỈ DÀNH CHO TRANG THỬ ===== */
body{margin:0;padding:20px 10px;background:#0e2a2a}
/* ===== GAME ===== */
#vnv-root{--bg:#eaf6f3;--paper:#ffffff;--ink:#12302e;--muted:#5b7a76;--main:#0f766e;--gold:#e0a21b;--line:#cfe5e0;--ok:#2e7d32;--bad:#c62828;
  font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:18px;max-width:900px;margin:0 auto;overflow:hidden;position:relative;line-height:1.5}
#vnv-root *{box-sizing:border-box}
#vnv-root button{font:inherit;color:inherit;cursor:pointer}
.vv-top{display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(90deg,#0b4f4a,#0f766e);color:#fff;flex-wrap:wrap}
.vv-top h1{font-size:18px;margin:0;flex:1;cursor:pointer;min-width:180px}
.vv-chip{background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;font-size:13px;white-space:nowrap}
.vv-main{padding:18px;min-height:420px}
.vv-h2{font-size:22px;margin:0 0 6px}
.vv-sub{color:var(--muted);margin:0 0 14px}
.vv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.vv-mode{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;transition:.15s}
.vv-mode:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(10,80,70,.18);border-color:var(--main)}
.vv-mode .big{font-size:34px;display:block}
.vv-mode b{display:block;font-size:17px;margin:4px 0 2px}
.vv-mode small{color:var(--muted)}
.vv-btn{background:var(--main);color:#fff!important;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.vv-btn:hover{filter:brightness(1.12)}
.vv-btn.alt{background:#fff;color:var(--ink)!important;border:1px solid var(--line)}
.vv-btn.sm{padding:6px 12px;font-size:13px}
.vv-btn[disabled]{opacity:.45;cursor:not-allowed}
.vv-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.vv-mapwrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.vv-map{flex:0 0 auto;width:100%;max-width:330px;margin:0 auto;background:linear-gradient(#cfeaf5,#e6f5fb);border-radius:14px;border:1px solid var(--line)}
.vv-side{flex:1;min-width:220px}
.vv-node{cursor:pointer}
.vv-node:hover circle.c{stroke:#000;stroke-width:2}
.vv-q{font-size:19px;font-weight:600;margin:10px 0 14px}
.vv-opt{display:block;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px}
.vv-opt:hover:not([disabled]){border-color:var(--main)}
.vv-opt.ok{background:#e6f4e7;border-color:var(--ok)}
.vv-opt.bad{background:#fde7e7;border-color:var(--bad)}
.vv-opt[disabled]{cursor:default}
.vv-note{background:#e3f6f1;border-radius:10px;padding:10px 14px;margin:10px 0}
.vv-story{background:var(--paper);border-left:5px solid var(--main);border-radius:10px;padding:14px 16px;margin:10px 0}
.vv-prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.vv-prog i{display:block;height:100%;background:var(--main);transition:width .2s}
.vv-big{font-size:56px;text-align:center}
.vv-center{text-align:center}
.vv-stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vv-stamp{background:var(--paper);border:3px double var(--main);border-radius:14px;padding:12px;text-align:center}
.vv-stamp .big{font-size:36px}
.vv-stamp small{display:block;color:var(--muted)}
.vv-stamp.off{border-style:dashed;border-color:var(--line);opacity:.55}
.vv-pic{font-size:110px;text-align:center;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:filter .2s}
.vv-hint{background:var(--paper);border:1px dashed var(--gold);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.vv-hint.off{opacity:.45}
.vv-food{font-size:64px;text-align:center}
.vv-regs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vv-reg{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:14px 6px;font-weight:700}
.vv-reg:hover:not([disabled]){border-color:var(--main)}
.vv-reg.ok{background:#e6f4e7;border-color:var(--ok)}
.vv-reg.bad{background:#fde7e7;border-color:var(--bad)}
.vv-act{display:flex;align-items:center;gap:10px;width:100%;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;text-align:left}
.vv-act:hover:not([disabled]){border-color:var(--main)}
.vv-act.sel{background:#e3f6f1;border-color:var(--main)}
.vv-act[disabled]:not(.sel){opacity:.4}
.vv-act .ic{font-size:24px}
.vv-act .tx{flex:1}.vv-act .tx small{display:block;color:var(--muted)}
.vv-act .jy{color:var(--gold);font-weight:700;white-space:nowrap}
.vv-meter{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.vv-meter span{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600}
.vv-meter .over{color:var(--bad)}
.vv-toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#12302e;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;z-index:5}
@media(max-width:560px){.vv-main{padding:12px}.vv-q{font-size:17px}.vv-pic{font-size:80px}}
</style>
</head>

/* ===================== KHUNG GIAO DIỆN ===================== */
root.innerHTML='<div class="vv-top"><h1 data-a="home">🧭 Khám phá Việt Nam</h1><span class="vv-chip" id="vv-pts"></span><span class="vv-chip" id="vv-badge"></span></div><div class="vv-main" id="vv-main"></div>';
const main=document.getElementById('vv-main');
let timer=null;
const stopTimer=()=>{if(timer){clearInterval(timer);timer=null}};
const draw=h=>{main.innerHTML=h};
function top(){
  document.getElementById('vv-pts').textContent='⭐ '+S.pts+' điểm';
  const n=Object.keys(S.stamps).length;
  document.getElementById('vv-badge').textContent=n>=STOPS.length?'🏅 Người lữ hành':'🛂 '+n+'/'+STOPS.length+' con dấu';
}
function toast(t){const d=document.createElement('div');d.className='vv-toast';d.textContent=t;root.appendChild(d);setTimeout(()=>d.remove(),1800)}
function addPts(n){S.pts+=n;persist();top()}

const A={};
root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f)f(t.dataset,t)});

/* ===================== TRANG CHỦ ===================== */
function home(){
  stopTimer();top();
  draw(`<h2 class="vv-h2">Sẵn sàng cho chuyến đi xuyên Việt chưa?</h2>
  <p class="vv-sub">Thu thập đủ ${STOPS.length} con dấu hộ chiếu để nhận danh hiệu <b>Người lữ hành</b>.</p>
  <div class="vv-grid">
   <button class="vv-mode" data-a="trip"><span class="big">🗺️</span><b>Hành trình xuyên Việt</b><small>Bản đồ hình chữ S, ${STOPS.length} điểm dừng, mỗi nơi có thử thách và một con dấu.</small></button>
   <button class="vv-mode" data-a="food"><span class="big">🍜</span><b>Đặc sản về đúng quê</b><small>Món ăn này thuộc miền nào? Kỷ lục: ${S.best.food}</small></button>
   <button class="vv-mode" data-a="guess"><span class="big">🔍</span><b>Đoán địa danh qua ảnh mờ</b><small>Hình rõ dần theo thời gian, đoán càng sớm càng nhiều điểm. Kỷ lục: ${S.best.guess}</small></button>
   <button class="vv-mode" data-a="budget"><span class="big">💰</span><b>Chuyến đi có ngân sách</b><small>Chọn hoạt động trong giới hạn tiền và số ngày để vui nhất. Kỷ lục: ${S.best.trip}</small></button>
   <button class="vv-mode" data-a="pass"><span class="big">🛂</span><b>Hộ chiếu của tôi</b><small>Xem các con dấu bạn đã sưu tầm.</small></button>
  </div>
  <div class="vv-row"><button class="vv-btn alt sm" data-a="reset">🗑️ Xóa tiến trình</button></div>`);
}
A.home=home;
A.reset=()=>{if(confirm('Xóa toàn bộ điểm và tiến trình?')){S=DEF();persist();home()}};

/* ===================== HÀNH TRÌNH XUYÊN VIỆT ===================== */
A.trip=()=>{
  stopTimer();
  let svg=`<svg class="vv-map" viewBox="0 0 340 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bản đồ minh họa Việt Nam">
  <path d="M130 20 L175 20 L200 60 L225 95 L205 125 L170 175 L180 230 L170 275 L200 320 L215 370 L245 420 L235 470 L195 520 L165 575 L130 620 L95 640 L80 610 L100 570 L130 540 L150 500 L170 450 L150 400 L135 340 L120 280 L110 230 L95 180 L80 130 L70 80 L100 50 Z" fill="#cfe8c8" stroke="#7fb27a" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="${STOPS.map(s=>s.x+','+s.y).join(' ')}" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 5" opacity=".6"/>
  <text x="290" y="300" font-size="11" fill="#3b7a99" text-anchor="middle">Biển Đông</text>
  <text x="40" y="330" font-size="11" fill="#3b7a99" text-anchor="middle">Lào</text>`;
  STOPS.forEach((s,i)=>{
    const dn=S.stamps[s.id]!=null,lx=s.a==='r'?s.x+14:s.a==='l'?s.x-14:s.x,ly=s.a==='b'?s.y+26:s.y+4,an=s.a==='r'?'start':s.a==='l'?'end':'middle';
    svg+=`<g class="vv-node" data-a="stop" data-i="${i}"><circle class="c" cx="${s.x}" cy="${s.y}" r="11" fill="${dn?'#2e7d32':'#e0a21b'}" stroke="#fff" stroke-width="2"/>
    <text x="${s.x}" y="${s.y+4}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">${dn?'✓':i+1}</text>
    <text x="${lx}" y="${ly}" font-size="12" font-weight="600" fill="#12302e" text-anchor="${an}">${esc(s.s)}</text></g>`;
  });
  svg+='</svg>';
  const n=Object.keys(S.stamps).length;
  draw(`<h2 class="vv-h2">🗺️ Hành trình xuyên Việt</h2><p class="vv-sub">Bấm vào một điểm trên bản đồ (hoặc trong danh sách) để bắt đầu thử thách.</p>
  <div class="vv-mapwrap">${svg}<div class="vv-side">
   <div class="vv-note">Đã thu thập: <b>${n}/${STOPS.length}</b> con dấu.<br><small>Bản đồ chỉ mang tính minh họa.</small></div>`+
  STOPS.map((s,i)=>`<button class="vv-act ${S.stamps[s.id]!=null?'sel':''}" data-a="stop" data-i="${i}"><span class="ic">${s.ic}</span><span class="tx"><b>${i+1}. ${esc(s.n)}</b></span><span class="jy">${S.stamps[s.id]!=null?'✅ '+'★'.repeat(S.stamps[s.id]):''}</span></button>`).join('')+
  `<div class="vv-row"><button class="vv-btn alt sm" data-a="home">← Về trang chủ</button></div></div></div>`);
};

let Q=null;
A.stop=d=>{const s=STOPS[+d.i];
  draw(`<div class="vv-center"><div class="vv-big">${s.ic}</div></div><h2 class="vv-h2 vv-center">${esc(s.n)}</h2>
  <div class="vv-story">${esc(s.intro)}</div>
  <div class="vv-row"><button class="vv-btn" data-a="startq" data-i="${d.i}">Bắt đầu thử thách ▶</button><button class="vv-btn alt" data-a="trip">← Bản đồ</button></div>`)};
A.startq=d=>{Q={s:+d.i,n:0,right:0,opts:[],picked:null};qScreen()};
function qScreen(){
  const st=STOPS[Q.s],q=st.qs[Q.n];
  if(!Q.opts.length)Q.opts=shuffle(q.slice(1,5));
  const p=Q.picked;
  draw(`<div class="vv-prog"><i style="width:${(Q.n+(p!==null?1:0))/st.qs.length*100}%"></i></div>
  <small class="vv-sub">${esc(st.n)} · Câu ${Q.n+1}/${st.qs.length}</small>
  <div class="vv-q">${esc(q[0])}</div>`+
  Q.opts.map((o,i)=>{let c='';if(p!==null){if(o===q[1])c='ok';else if(i===p)c='bad'}
    return `<button class="vv-opt ${c}" data-a="ans" data-i="${i}" ${p!==null?'disabled':''}>${esc(o)}</button>`}).join('')+
  (p!==null?`<div class="vv-note">${Q.opts[p]===q[1]?'✅ Chính xác! ':'❌ Chưa đúng. Đáp án: <b>'+esc(q[1])+'</b>. '}${esc(q[5])}</div>
  <button class="vv-btn" data-a="qnext">${Q.n+1<st.qs.length?'Câu tiếp theo ▶':'Xem kết quả ▶'}</button>`:''));
}
A.ans=d=>{if(Q.picked!==null)return;Q.picked=+d.i;const q=STOPS[Q.s].qs[Q.n];if(Q.opts[Q.picked]===q[1]){Q.right++;addPts(10)}qScreen()};
A.qnext=()=>{Q.n++;Q.opts=[];Q.picked=null;if(Q.n>=STOPS[Q.s].qs.length)return qEnd();qScreen()};
function qEnd(){
  const st=STOPS[Q.s],pass=Q.right>=2,first=pass&&S.stamps[st.id]==null;
  if(pass){S.stamps[st.id]=Math.max(S.stamps[st.id]||0,Q.right);if(first)S.pts+=20;persist();top()}
  draw(`<div class="vv-center"><div class="vv-big">${pass?'🛂':'💪'}</div>
  <h2 class="vv-h2">${pass?'Đã đóng dấu '+esc(st.s)+'!':'Gần được rồi, thử lại nhé!'}</h2>
  <div style="color:#e0a21b;font-size:30px;letter-spacing:3px">${'★'.repeat(Q.right)}${'☆'.repeat(3-Q.right)}</div>
  <p>Bạn trả lời đúng <b>${Q.right}/${st.qs.length}</b> câu. ${first?'🎁 Con dấu mới! +20 điểm.':''}</p></div>`+
  (pass?`<div class="vv-note">🧳 <b>Mẹo du lịch:</b> ${esc(st.tip)}</div>`:'')+
  `<div class="vv-row" style="justify-content:center">
   <button class="vv-btn alt" data-a="startq" data-i="${Q.s}">↻ Chơi lại điểm này</button>
   ${pass&&Q.s+1<STOPS.length?`<button class="vv-btn" data-a="stop" data-i="${Q.s+1}">Điểm kế tiếp ▶</button>`:''}
   <button class="vv-btn alt" data-a="trip">🗺️ Bản đồ</button></div>`);
}

/* ===================== HỘ CHIẾU ===================== */
A.pass=()=>{stopTimer();
  draw(`<h2 class="vv-h2">🛂 Hộ chiếu của tôi</h2><p class="vv-sub">Mỗi con dấu là một điểm đến bạn đã chinh phục.</p><div class="vv-stamps">`+
  STOPS.map(s=>S.stamps[s.id]!=null
   ?`<div class="vv-stamp"><div class="big">${s.ic}</div><b>${esc(s.s)}</b><small>${'★'.repeat(S.stamps[s.id])}${'☆'.repeat(3-S.stamps[s.id])}</small></div>`
   :`<div class="vv-stamp off"><div class="big">❓</div><b>${esc(s.s)}</b><small>Chưa đến</small></div>`).join('')+
  `</div><div class="vv-row"><button class="vv-btn alt" data-a="home">← Về trang chủ</button></div>`)};

/* ===================== ĐẶC SẢN VỀ ĐÚNG QUÊ ===================== */
let F=null;
A.food=()=>{stopTimer();F={items:shuffle(FOODS).slice(0,8),i:0,pts:0,ok:0,streak:0,picked:null};foodScreen()};
function foodScreen(){
  if(F.i>=F.items.length)return foodEnd();
  const f=F.items[F.i],p=F.picked,regs=['Bắc','Trung','Nam'];
  draw(`<div class="vv-prog"><i style="width:${F.i/F.items.length*100}%"></i></div>
  <small class="vv-sub">Đặc sản về đúng quê · Món ${F.i+1}/${F.items.length} · Điểm: ${F.pts}${F.streak>=3?' 🔥':''}</small>
  <div class="vv-food">${f[1]}</div><div class="vv-q vv-center">${esc(f[0])} là đặc sản của miền nào?</div>
  <div class="vv-regs">`+regs.map(r=>{let c='';if(p!==null){if(r===f[2])c='ok';else if(r===p)c='bad'}
    return `<button class="vv-reg ${c}" data-a="fans" data-r="${r}" ${p!==null?'disabled':''}>Miền ${r}</button>`}).join('')+`</div>`+
  (p!==null?`<div class="vv-note">${p===f[2]?'✅ Chính xác! ':'❌ Món này thuộc miền '+f[2]+'. '}${esc(f[3])}</div><button class="vv-btn" data-a="fnext">${F.i+1<F.items.length?'Món tiếp theo ▶':'Xem kết quả ▶'}</button>`:''));
}
A.fans=d=>{if(F.picked!==null)return;F.picked=d.r;const f=F.items[F.i];if(d.r===f[2]){F.ok++;F.streak++;F.pts+=10+(F.streak>=3?5:0)}else F.streak=0;foodScreen()};
A.fnext=()=>{F.i++;F.picked=null;foodScreen()};
function foodEnd(){
  addPts(F.pts);const nb=F.pts>S.best.food;if(nb){S.best.food=F.pts;persist()}
  draw(`<div class="vv-center"><div class="vv-big">🍜</div><h2 class="vv-h2">Hoàn thành!</h2><p>Đúng <b>${F.ok}/${F.items.length}</b> món · <b>${F.pts}</b> điểm ${nb?'🎉 Kỷ lục mới!':'(kỷ lục: '+S.best.food+')'}</p></div>
  <div class="vv-row" style="justify-content:center"><button class="vv-btn" data-a="food">Chơi lại</button><button class="vv-btn alt" data-a="home">Trang chủ</button></div>`);
}

/* ===================== ĐOÁN ĐỊA DANH QUA ẢNH MỜ ===================== */
let G=null;
A.guess=()=>{stopTimer();G={rounds:shuffle(PLACES).slice(0,6),r:0,pts:0,picked:null,opts:[],t0:0,hints:1,gain:0};guessRound()};
function guessRound(){
  if(G.r>=G.rounds.length)return guessEnd();
  const c=G.rounds[G.r];
  G.opts=shuffle([c[0],...shuffle(PLACES.filter(x=>x!==c).map(x=>x[0])).slice(0,3)]);
  G.picked=null;G.hints=1;G.t0=Date.now();
  guessDraw();
  stopTimer();
  timer=setInterval(()=>{
    if(G.picked!==null)return;
    const e=(Date.now()-G.t0)/1000,pic=document.getElementById('vv-pic');
    if(pic)pic.style.filter='blur('+Math.max(0,22-e*1.6).toFixed(1)+'px)';
    const h=1+(e>=5?1:0)+(e>=10?1:0);
    if(h!==G.hints){G.hints=h;guessDraw()}
  },150);
}
function guessDraw(){
  const c=G.rounds[G.r],p=G.picked,e=(Date.now()-G.t0)/1000;
  const blur=p!==null?0:Math.max(0,22-e*1.6);
  draw(`<div class="vv-prog"><i style="width:${G.r/G.rounds.length*100}%"></i></div>
  <small class="vv-sub">Đoán địa danh · Vòng ${G.r+1}/${G.rounds.length} · Điểm: ${G.pts}</small>
  <div class="vv-pic" id="vv-pic" style="filter:blur(${blur.toFixed(1)}px)">${c[1]}</div>`+
  [2,3].map((k,i)=>`<div class="vv-hint ${i<G.hints?'':'off'}">💡 Gợi ý ${i+1}: ${i<G.hints?esc(c[k]):'(sẽ hiện sau '+(i+1)*5+' giây)'}</div>`).join('')+
  `<div class="vv-q">Đây là đâu? <small class="vv-sub">(Đoán càng sớm, điểm càng cao)</small></div>`+
  G.opts.map((o,i)=>{let cl='';if(p!==null){if(o===c[0])cl='ok';else if(i===p)cl='bad'}
    return `<button class="vv-opt ${cl}" data-a="gans" data-i="${i}" ${p!==null?'disabled':''}>${esc(o)}</button>`}).join('')+
  (p!==null?`<div class="vv-note">${G.opts[p]===c[0]?'✅ Chính xác! +'+G.gain+' điểm.':'❌ Đáp án đúng: <b>'+esc(c[0])+'</b>.'}</div><button class="vv-btn" data-a="gnext">${G.r+1<G.rounds.length?'Vòng tiếp ▶':'Xem kết quả ▶'}</button>`:''));
}
A.gans=d=>{
  if(G.picked!==null)return;
  const c=G.rounds[G.r],e=(Date.now()-G.t0)/1000;stopTimer();
  G.picked=+d.i;
  if(G.opts[G.picked]===c[0]){G.gain=Math.max(10,Math.round(60-e*3));G.pts+=G.gain}
  guessDraw();
};
A.gnext=()=>{G.r++;guessRound()};
function guessEnd(){
  stopTimer();addPts(G.pts);const nb=G.pts>S.best.guess;if(nb){S.best.guess=G.pts;persist()}
  draw(`<div class="vv-center"><div class="vv-big">🔍</div><h2 class="vv-h2">Hoàn thành!</h2><p>Bạn được <b>${G.pts}</b> điểm (tối đa 360). ${nb?'🎉 Kỷ lục mới!':'Kỷ lục: '+S.best.guess}</p></div>
  <div class="vv-row" style="justify-content:center"><button class="vv-btn" data-a="guess">Chơi lại</button><button class="vv-btn alt" data-a="home">Trang chủ</button></div>`);
}

/* ===================== CHUYẾN ĐI CÓ NGÂN SÁCH ===================== */
let B=null;
function bestPlan(t){
  const n=t.it.length;let bj=0,bm=0;
  for(let m=0;m<(1<<n);m++){let c=0,d=0,j=0;
    for(let k=0;k<n;k++)if(m>>k&1){d+=t.it[k][2];c+=t.it[k][3];j+=t.it[k][4]}
    if(c<=t.b&&d<=t.d&&j>bj){bj=j;bm=m}}
  return{j:bj,m:bm};
}
const tot=(t,sel)=>sel.reduce((a,k)=>({c:a.c+t.it[k][3],d:a.d+t.it[k][2],j:a.j+t.it[k][4]}),{c:0,d:0,j:0});
A.budget=()=>{stopTimer();B={t:TRIPS[Math.random()*TRIPS.length|0],sel:[],done:false};budgetDraw()};
function budgetDraw(){
  const t=B.t,T=tot(t,B.sel);
  draw(`<h2 class="vv-h2">💰 Chuyến đi có ngân sách: ${esc(t.n)}</h2>
  <p class="vv-sub">Chọn các hoạt động để đạt tổng <b>điểm hài lòng</b> cao nhất mà không vượt quá ngân sách và số ngày.</p>
  <div class="vv-meter"><span class="${T.c>t.b?'over':''}">💵 ${vnd(T.c)} / ${vnd(t.b)}</span><span class="${T.d>t.d?'over':''}">📅 ${T.d} / ${t.d} ngày</span><span>😊 ${T.j} điểm</span></div>`+
  t.it.map((it,k)=>{const on=B.sel.includes(k),fits=T.c+it[3]<=t.b&&T.d+it[2]<=t.d;
    return `<button class="vv-act ${on?'sel':''}" data-a="btog" data-k="${k}" ${!on&&!fits?'disabled':''}><span class="ic">${it[1]}</span><span class="tx"><b>${esc(it[0])}</b><small>${vnd(it[3])} · ${it[2]} ngày</small></span><span class="jy">+${it[4]} 😊</span></button>`}).join('')+
  `<div class="vv-row"><button class="vv-btn" data-a="bdone" ${B.sel.length?'':'disabled'}>Chốt lịch trình ✅</button><button class="vv-btn alt" data-a="budget">Đổi chuyến khác</button><button class="vv-btn alt" data-a="home">Trang chủ</button></div>`);
}
A.btog=d=>{
  const k=+d.k,i=B.sel.indexOf(k);
  if(i>=0)B.sel.splice(i,1);else{const T=tot(B.t,B.sel),it=B.t.it[k];if(T.c+it[3]>B.t.b||T.d+it[2]>B.t.d){toast('Vượt ngân sách hoặc số ngày!');return}B.sel.push(k)}
  budgetDraw();
};
A.bdone=()=>{
  const t=B.t,T=tot(t,B.sel),bp=bestPlan(t),ratio=T.j/bp.j,stars=ratio>=.95?3:ratio>=.8?2:1,pts=Math.round(ratio*50);
  addPts(pts);const nb=pts>S.best.trip;if(nb){S.best.trip=pts;persist()}
  const opt=t.it.map((it,k)=>bp.m>>k&1?it:null).filter(Boolean);
  draw(`<div class="vv-center"><div class="vv-big">${stars===3?'🏆':stars===2?'👏':'🙂'}</div><h2 class="vv-h2">Lịch trình của bạn: ${T.j}/${bp.j} điểm hài lòng</h2>
  <div style="color:#e0a21b;font-size:30px;letter-spacing:3px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
  <p>+${pts} điểm ${nb?'🎉 Kỷ lục mới!':'(kỷ lục: '+S.best.trip+')'}</p></div>
  <div class="vv-note"><b>Lịch trình tối ưu</b> (${bp.j} điểm):<br>${opt.map(o=>o[1]+' '+esc(o[0])).join('<br>')}</div>
  <div class="vv-row" style="justify-content:center"><button class="vv-btn" data-a="budget">Chuyến mới</button><button class="vv-btn alt" data-a="home">Trang chủ</button></div>`);
};

home();
})();
</script>
