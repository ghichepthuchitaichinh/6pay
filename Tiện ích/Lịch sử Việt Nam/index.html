<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khám phá lịch sử Việt Nam</title>
<!--
  CÁCH CHÈN VÀO index.html CỦA BẠN:
  1) Copy khối <style> bên dưới (các class đều có tiền tố "vh-" nên khó đụng hàng).
  2) Copy thẻ <div id="vnh-root"></div> vào chỗ bạn muốn hiển thị game.
  3) Copy khối <script> (nằm trong IIFE, không làm ô nhiễm biến toàn cục).
  Phần "CHỈ DÀNH CHO TRANG THỬ" có thể bỏ khi chèn.
-->
<style>
/* ===== CHỈ DÀNH CHO TRANG THỬ ===== */
body{margin:0;padding:20px 10px;background:#2b1b10}
/* ===== GAME ===== */
#vnh-root{--bg:#f7edd8;--paper:#fffaf0;--ink:#3a2817;--muted:#7a6650;--red:#b3261e;--gold:#c9922e;--line:#e6d6b0;--ok:#2e7d32;--bad:#c62828;
  font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:18px;max-width:900px;margin:0 auto;overflow:hidden;position:relative;line-height:1.5}
#vnh-root *{box-sizing:border-box}
#vnh-root button{font:inherit;color:inherit;cursor:pointer}
.vh-top{display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(90deg,#7a1d16,#b3261e);color:#fff;flex-wrap:wrap}
.vh-top h1{font-size:18px;margin:0;flex:1;cursor:pointer;min-width:180px}
.vh-chip{background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;font-size:13px;white-space:nowrap}
.vh-main{padding:18px;min-height:420px}
.vh-h2{font-size:22px;margin:0 0 6px}
.vh-sub{color:var(--muted);margin:0 0 16px}
.vh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.vh-mode{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;transition:.15s}
.vh-mode:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(90,50,10,.15);border-color:var(--gold)}
.vh-mode .big{font-size:34px;display:block}
.vh-mode b{display:block;font-size:17px;margin:4px 0 2px}
.vh-mode small{color:var(--muted)}
.vh-btn{background:var(--red);color:#fff!important;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.vh-btn:hover{filter:brightness(1.1)}
.vh-btn.alt{background:#fff;color:var(--ink)!important;border:1px solid var(--line)}
.vh-btn.sm{padding:6px 12px;font-size:13px}
.vh-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.vh-era{display:flex;align-items:center;gap:12px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;text-align:left}
.vh-era:hover{border-color:var(--gold)}
.vh-era.lock{opacity:.5}
.vh-ico{font-size:28px;width:40px;text-align:center}
.vh-et{flex:1}.vh-et small{display:block;color:var(--muted)}
.vh-st{color:var(--gold);letter-spacing:2px;font-size:18px}
.vh-story{background:var(--paper);border-left:5px solid var(--gold);border-radius:10px;padding:14px 16px;margin:10px 0}
.vh-q{font-size:19px;font-weight:600;margin:10px 0 14px}
.vh-opt{display:block;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px}
.vh-opt:hover:not([disabled]){border-color:var(--gold)}
.vh-opt.ok{background:#e6f4e7;border-color:var(--ok)}
.vh-opt.bad{background:#fde7e7;border-color:var(--bad)}
.vh-opt[disabled]{cursor:default}
.vh-note{background:#fff3d6;border-radius:10px;padding:10px 14px;margin:10px 0}
.vh-prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.vh-prog i{display:block;height:100%;background:var(--red);transition:width .2s}
.vh-hint{background:var(--paper);border:1px dashed var(--gold);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.vh-hint.off{opacity:.45}
.vh-collect{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.vh-cardx{background:var(--paper);border:2px solid var(--gold);border-radius:14px;padding:12px;text-align:center}
.vh-cardx .big{font-size:40px}
.vh-cardx small{color:var(--muted);display:block}
.vh-cardx.off{border-style:dashed;border-color:var(--line);opacity:.55}
.vh-ord{display:flex;align-items:center;gap:10px;width:100%;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;text-align:left}
.vh-ord:hover:not(.done){border-color:var(--gold)}
.vh-ord.done{background:#e6f4e7;border-color:var(--ok);cursor:default}
.vh-ord .num{min-width:30px;height:30px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}
.vh-ord.done .num{background:var(--ok);color:#fff}
.vh-ord .yr{margin-left:auto;color:var(--ok);font-weight:700}
@keyframes vhshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.vh-shake{animation:vhshake .3s;border-color:var(--bad)!important}
.vh-toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#3a2817;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;z-index:5}
.vh-timer{font-size:28px;font-weight:700;color:var(--red)}
.vh-big{font-size:56px;text-align:center}
.vh-center{text-align:center}
@media(max-width:560px){.vh-main{padding:12px}.vh-q{font-size:17px}}
</style>
</head>
<body>

<div id="vnh-root"></div>

<script>
(function(){
'use strict';
const KEY='vnh_history_v1';
const root=document.getElementById('vnh-root');
const DEF=()=>({done:{},pts:0,best:{arena:0,order:0,who:0},unlockAll:false});
let S=DEF();
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=Object.assign(DEF(),x)}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===================== DỮ LIỆU ===================== */
/* Câu hỏi: [câu hỏi, ĐÁP ÁN ĐÚNG, sai1, sai2, sai3, giải thích] — thứ tự đáp án sẽ được xáo khi chơi */
const ERAS=[
{id:'hb',ic:'🥁',n:'Hồng Bàng – Văn Lang – Âu Lạc',y:'Đến năm 179 TCN',
 story:'Theo truyền thuyết, Lạc Long Quân và Âu Cơ sinh ra một bọc trăm trứng, nở thành trăm người con. Người con trưởng lên ngôi, xưng Hùng Vương, lập nước Văn Lang, đóng đô ở Phong Châu. Sau đó, An Dương Vương hợp nhất hai bộ tộc Âu Việt và Lạc Việt, lập nước Âu Lạc và xây thành Cổ Loa.',
 qs:[

 ['Kinh đô của nước Âu Lạc thời An Dương Vương là?','Cổ Loa','Hoa Lư','Thăng Long','Phú Xuân','Thành Cổ Loa có kiến trúc xoắn ốc độc đáo, nay thuộc Hà Nội.'],
 ['Theo truyền thuyết, Âu Cơ sinh ra bao nhiêu người con?','100 người con','50 người con','81 người con','9 người con','Sau đó 50 con theo mẹ lên núi, 50 con theo cha xuống biển.']],
 card:{ic:'🥁',t:'Trống đồng Đông Sơn',d:'Biểu tượng của nền văn minh sông Hồng.'}},
{id:'bt',ic:'⚔️',n:'Một nghìn năm Bắc thuộc',y:'179 TCN – 938',

 ['Trận đánh nào năm 938 chấm dứt thời Bắc thuộc?','Trận Bạch Đằng','Trận Chi Lăng','Trận Đống Đa','Trận Rạch Gầm – Xoài Mút','Ngô Quyền dùng cọc ngầm trên sông Bạch Đằng để đánh bại quân Nam Hán.'],

 card:{ic:'🐘',t:'Hai Bà Trưng',d:'Hai nữ anh hùng đầu tiên dựng cờ khởi nghĩa.'}},
{id:'dl',ic:'🏯',n:'Ngô – Đinh – Tiền Lê',y:'939 – 1009',

 ['Văn Miếu (xây năm 1070) được dựng dưới triều đại nào?','Nhà Lý','Nhà Trần','Nhà Nguyễn','Nhà Hồ','Văn Miếu – Quốc Tử Giám được coi là trường đại học đầu tiên của nước ta.'],

{id:'tr',ic:'🛡️',n:'Nhà Trần – Ba lần đánh Mông–Nguyên',y:'1225 – 1400',
 story:'Quân Mông – Nguyên từng chinh phục nhiều vùng đất rộng lớn, nhưng ba lần xâm lược Đại Việt (1258, 1285, 1287–1288) đều thất bại. Hội nghị Diên Hồng thể hiện ý chí quyết chiến. Trần Hưng Đạo soạn “Hịch tướng sĩ” và chỉ huy chiến thắng Bạch Đằng năm 1288.',

 ['Hội nghị nào họp các bô lão để hỏi “đánh hay hòa”?','Hội nghị Diên Hồng','Hội thề Lũng Nhai','Hội nghị Genève','Hội nghị Fontainebleau','Các bô lão đồng thanh hô “Đánh!”.'],
 ['Năm 1288, Trần Hưng Đạo dùng kế gì để thắng thủy quân Nguyên trên sông Bạch Đằng?','Cắm cọc ngầm, lợi dụng thủy triều','Dùng voi chiến phá thành','Đào hào đắp lũy chặn bộ binh','Hỏa công đốt kho lương trên bờ','Khi nước triều lên, thuyền địch tiến vào bãi cọc; khi nước rút, thuyền mắc cọc và bị tiêu diệt.']],

 qs:[

function top(){

const isOpen=i=>S.unlockAll||i===0||S.done[ERAS[i-1].id]!=null;
function journey(){
  stopTimer();
  draw(`<h2 class="vh-h2">⏳ Hành trình thời gian</h2><p class="vh-sub">Đúng ít nhất 2/3 câu để qua màn và mở khóa thẻ di sản.</p>`+
  ERAS.map((e,i)=>{const o=isOpen(i),st=S.done[e.id]||0;
    return `<button class="vh-era ${o?'':'lock'}" data-a="${o?'era':'locked'}" data-i="${i}"><span class="vh-ico">${o?e.ic:'🔒'}</span><span class="vh-et"><b>Màn ${i+1}: ${e.n}</b><small>${e.y}</small></span><span class="vh-st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span></button>`}).join('')+
  `<div class="vh-row"><button class="vh-btn alt sm" data-a="home">← Về trang chủ</button>${S.unlockAll?'':'<button class="vh-btn alt sm" data-a="unlock">🔓 Mở hết các màn (bản thử)</button>'}</div>`);
}

let Q=null;
A.era=d=>{const e=ERAS[+d.i];
  draw(`<div class="vh-center"><div class="vh-big">${e.ic}</div></div><h2 class="vh-h2 vh-center">${e.n}</h2><p class="vh-sub vh-center">${e.y}</p>
  <div class="vh-story">${esc(e.story)}</div>
  <div class="vh-row"><button class="vh-btn" data-a="startq" data-i="${d.i}">Bắt đầu thử thách ▶</button><button class="vh-btn alt" data-a="journey">← Danh sách màn</button></div>`)};
A.startq=d=>{Q={e:+d.i,n:0,right:0,opts:[],picked:null};qScreen()};
function qScreen(){
  const era=ERAS[Q.e],q=era.qs[Q.n];
  if(!Q.opts.length)Q.opts=shuffle(q.slice(1,5));
  const p=Q.picked;
  draw(`<div class="vh-prog"><i style="width:${(Q.n+(p!==null?1:0))/era.qs.length*100}%"></i></div>
  <small class="vh-sub">${era.n} · Câu ${Q.n+1}/${era.qs.length}</small>
  <div class="vh-q">${esc(q[0])}</div>`+
  Q.opts.map((o,i)=>{let c='';if(p!==null){if(o===q[1])c='ok';else if(i===p)c='bad'}
    return `<button class="vh-opt ${c}" data-a="ans" data-i="${i}" ${p!==null?'disabled':''}>${esc(o)}</button>`}).join('')+
  (p!==null?`<div class="vh-note">${Q.opts[p]===q[1]?'✅ Chính xác! ':'❌ Chưa đúng. Đáp án: <b>'+esc(q[1])+'</b>. '}${esc(q[5])}</div>
  <button class="vh-btn" data-a="qnext">${Q.n+1<era.qs.length?'Câu tiếp theo ▶':'Xem kết quả ▶'}</button>`:''));
}
A.ans=d=>{if(Q.picked!==null)return;Q.picked=+d.i;const q=ERAS[Q.e].qs[Q.n];if(Q.opts[Q.picked]===q[1]){Q.right++;addPts(10)}qScreen()};
A.qnext=()=>{Q.n++;Q.opts=[];Q.picked=null;if(Q.n>=ERAS[Q.e].qs.length)return qEnd();qScreen()};
function qEnd(){
  const era=ERAS[Q.e],pass=Q.right>=2,first=pass&&S.done[era.id]==null;
  if(pass){S.done[era.id]=Math.max(S.done[era.id]||0,Q.right);if(first)S.pts+=20;persist();top()}
  draw(`<div class="vh-center"><div class="vh-big">${pass?'🎉':'💪'}</div>
  <h2 class="vh-h2">${pass?'Vượt ải thành công!':'Gần được rồi, thử lại nhé!'}</h2>
  <div class="vh-st" style="font-size:30px">${'★'.repeat(Q.right)}${'☆'.repeat(3-Q.right)}</div>
  <p>Bạn trả lời đúng <b>${Q.right}/${era.qs.length}</b> câu.</p></div>`+
  (pass?`<div class="vh-cardx" style="max-width:260px;margin:10px auto"><div class="big">${era.card.ic}</div><b>${era.card.t}</b><small>${era.card.d}</small>${first?'<small style="color:#2e7d32">🎁 Thẻ mới! +20 điểm</small>':''}</div>`:'')+
  `<div class="vh-row" style="justify-content:center">
   <button class="vh-btn alt" data-a="startq" data-i="${Q.e}">↻ Chơi lại màn này</button>
   ${pass&&Q.e+1<ERAS.length?`<button class="vh-btn" data-a="era" data-i="${Q.e+1}">Màn kế tiếp ▶</button>`:''}
   <button class="vh-btn alt" data-a="journey">Danh sách màn</button></div>`);
}

/* ===================== AI LÀ AI ===================== */
let W=null;
A.who=()=>{stopTimer();W={rounds:shuffle(WHO).slice(0,5),r:0,pts:0,shown:1,picked:null,opts:[]};whoScreen()};
function whoScreen(){
  if(W.r>=W.rounds.length)return whoEnd();
  const c=W.rounds[W.r];
  if(!W.opts.length)W.opts=shuffle([c[0],...shuffle(WHO.filter(x=>x!==c).map(x=>x[0])).slice(0,3)]);
  const p=W.picked;
  draw(`<div class="vh-prog"><i style="width:${W.r/W.rounds.length*100}%"></i></div>
  <small class="vh-sub">Ai là ai? · Vòng ${W.r+1}/${W.rounds.length} · Điểm: ${W.pts}</small>
  <div class="vh-big">${p!==null?c[1]:'🕵️'}</div>`+
  [2,3,4].map((k,i)=>`<div class="vh-hint ${i<W.shown?'':'off'}">💡 Gợi ý ${i+1}: ${i<W.shown?esc(c[k]):'???'}</div>`).join('')+
  (p===null&&W.shown<3?`<button class="vh-btn alt sm" data-a="whint">Xem thêm gợi ý (−10 điểm)</button>`:'')+
  `<div class="vh-q">Nhân vật này là ai? <small class="vh-sub">(Đúng ngay: ${40-W.shown*10} điểm)</small></div>`+
  W.opts.map((o,i)=>{let cl='';if(p!==null){if(o===c[0])cl='ok';else if(i===p)cl='bad'}
    return `<button class="vh-opt ${cl}" data-a="wans" data-i="${i}" ${p!==null?'disabled':''}>${esc(o)}</button>`}).join('')+
  (p!==null?`<div class="vh-note">${W.opts[p]===c[0]?'✅ Chính xác! +'+(40-W.shown*10)+' điểm.':'❌ Đáp án đúng: <b>'+esc(c[0])+'</b>.'}</div><button class="vh-btn" data-a="wnext">Tiếp ▶</button>`:''));
}
A.whint=()=>{if(W.shown<3){W.shown++;whoScreen()}};
A.wans=d=>{if(W.picked!==null)return;W.picked=+d.i;const c=W.rounds[W.r];if(W.opts[W.picked]===c[0]){const g=40-W.shown*10;W.pts+=g;addPts(g)}whoScreen()};
A.wnext=()=>{W.r++;W.shown=1;W.picked=null;W.opts=[];whoScreen()};
function whoEnd(){
  const nb=W.pts>S.best.who;if(nb){S.best.who=W.pts;persist()}
  draw(`<div class="vh-center"><div class="vh-big">🕵️</div><h2 class="vh-h2">Kết thúc!</h2><p>Bạn được <b>${W.pts}</b> điểm (tối đa 150). ${nb?'🎉 Kỷ lục mới!':'Kỷ lục: '+S.best.who}</p></div>
  <div class="vh-row" style="justify-content:center"><button class="vh-btn" data-a="who">Chơi lại</button><button class="vh-btn alt" data-a="home">Trang chủ</button></div>`);
}

/* ===================== SẮP XẾP SỰ KIỆN ===================== */
let O=null;
A.order=()=>{stopTimer();O={sets:shuffle(ORD).slice(0,5),i:0,pts:0};orderSet()};
function orderSet(){
  if(O.i>=O.sets.length)return orderEnd();
  const set=O.sets[O.i].map(x=>({n:x[0],y:x[1]}));
  O.sorted=set.slice().sort((a,b)=>a.y-b.y);
  O.items=shuffle(set);O.next=0;O.mist=0;O.placed={};
  orderDraw();
}
function orderDraw(){
  const fin=O.next>=O.items.length;
  draw(`<div class="vh-prog"><i style="width:${O.i/O.sets.length*100}%"></i></div>
  <small class="vh-sub">Sắp xếp sự kiện · Bộ ${O.i+1}/${O.sets.length} · Điểm: ${O.pts}</small>
  <div class="vh-q">Bấm lần lượt các sự kiện theo thứ tự từ <u>sớm nhất → muộn nhất</u>.</div>`+
  O.items.map((it,k)=>{const r=O.placed[k];
    return `<button class="vh-ord ${r!==undefined?'done':''}" data-a="opick" data-k="${k}"><span class="num">${r!==undefined?r+1:'?'}</span><span>${esc(it.n)}</span>${r!==undefined?`<span class="yr">${it.y}</span>`:''}</button>`}).join('')+
  `<div class="vh-sub">Số lần sai: <b id="vh-mist">${O.mist}</b></div>`+
  (fin?`<div class="vh-note">🎉 Đúng thứ tự! +${Math.max(5,25-5*O.mist)} điểm.</div><button class="vh-btn" data-a="onext">${O.i+1<O.sets.length?'Bộ tiếp theo ▶':'Xem kết quả ▶'}</button>`:''));
}
A.opick=(d,t)=>{
  const k=+d.k;if(O.placed[k]!==undefined)return;
  if(O.sorted.indexOf(O.items[k])===O.next){O.placed[k]=O.next;O.next++;
    if(O.next>=O.items.length){const g=Math.max(5,25-5*O.mist);O.pts+=g;addPts(g)}
    orderDraw();
  }else{O.mist++;const m=document.getElementById('vh-mist');if(m)m.textContent=O.mist;t.classList.add('vh-shake');setTimeout(()=>t.classList.remove('vh-shake'),350)}
};
A.onext=()=>{O.i++;orderSet()};
function orderEnd(){
  const nb=O.pts>S.best.order;if(nb){S.best.order=O.pts;persist()}
  draw(`<div class="vh-center"><div class="vh-big">🧩</div><h2 class="vh-h2">Hoàn thành!</h2><p>Bạn được <b>${O.pts}</b> điểm (tối đa 125). ${nb?'🎉 Kỷ lục mới!':'Kỷ lục: '+S.best.order}</p></div>
  <div class="vh-row" style="justify-content:center"><button class="vh-btn" data-a="order">Chơi lại</button><button class="vh-btn alt" data-a="home">Trang chủ</button></div>`);
}

/* ===================== ĐẤU TRƯỜNG 60 GIÂY ===================== */
let AR=null;
A.arena=()=>{stopTimer();
  const all=[];ERAS.forEach(e=>e.qs.forEach(q=>all.push(q)));
  AR={queue:shuffle(all),k:0,score:0,streak:0,ok:0,bad:0,t0:Date.now(),over:false,lock:false,picked:null,opts:[]};
  AR.opts=shuffle(AR.queue[0].slice(1,5));
  arenaDraw();
  timer=setInterval(()=>{
    const left=Math.max(0,60-(Date.now()-AR.t0)/1000);
    const el=document.getElementById('vh-time');if(el)el.textContent=Math.ceil(left)+'s';
    const bar=document.getElementById('vh-bar');if(bar)bar.style.width=(left/60*100)+'%';
    if(left<=0)arenaEnd();
  },200);
};
function arenaDraw(){
  const q=AR.queue[AR.k%AR.queue.length],p=AR.picked;
  draw(`<div class="vh-row" style="justify-content:space-between;margin:0 0 8px"><span class="vh-timer" id="vh-time">60s</span><span>Điểm: <b>${AR.score}</b> · Chuỗi đúng: <b>${AR.streak}</b>${AR.streak>=3?' 🔥':''}</span></div>
  <div class="vh-prog"><i id="vh-bar" style="width:100%"></i></div>
  <div class="vh-q">${esc(q[0])}</div>`+
  AR.opts.map((o,i)=>{let c='';if(p!==null){if(o===q[1])c='ok';else if(i===p)c='bad'}
    return `<button class="vh-opt ${c}" data-a="aans" data-i="${i}" ${p!==null?'disabled':''}>${esc(o)}</button>`}).join(''));
}
A.aans=d=>{
  if(AR.over||AR.lock)return;AR.lock=true;AR.picked=+d.i;
  const q=AR.queue[AR.k%AR.queue.length];
  if(AR.opts[AR.picked]===q[1]){AR.ok++;AR.streak++;AR.score+=10+(AR.streak>=3?5:0)}else{AR.bad++;AR.streak=0}
  arenaDraw();
  setTimeout(()=>{if(AR.over)return;AR.k++;AR.picked=null;AR.lock=false;AR.opts=shuffle(AR.queue[AR.k%AR.queue.length].slice(1,5));arenaDraw()},650);
};
function arenaEnd(){
  if(AR.over)return;AR.over=true;stopTimer();
  addPts(AR.score);
  const nb=AR.score>S.best.arena;if(nb){S.best.arena=AR.score;persist()}
  draw(`<div class="vh-center"><div class="vh-big">⚡</div><h2 class="vh-h2">Hết giờ!</h2>
  <p>Đúng <b>${AR.ok}</b> câu · Sai <b>${AR.bad}</b> câu</p><p style="font-size:24px">Điểm: <b>${AR.score}</b> ${nb?'🎉 Kỷ lục mới!':'(kỷ lục: '+S.best.arena+')'}</p></div>
  <div class="vh-row" style="justify-content:center"><button class="vh-btn" data-a="arena">Chơi lại</button><button class="vh-btn alt" data-a="home">Trang chủ</button></div>`);
}

home();
})();
</script>
