<style>
/* ================= 6PAY — Giao diện sáng, màu nhẹ, co giãn theo màn hình ================= */
:root{
  color-scheme:light;
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#F8FAFC; --text:#1F2937; --text-soft:#6B7280; --border:#E5E9F0;
  --accent:#3B6FC4; --accent-strong:#2C5FA8; --accent-soft:#EAF1FC; --accent-text:#FFFFFF;
  --pos:#2F9E62; --neg:#D9534F;
  --income-bg:#E9F7EF; --income-text:#24804F; --income-border:#CFEBDB;
  --expense-bg:#FDEEEE; --expense-text:#C0443F; --expense-border:#F6D3D1;
  --newtx-bg:#EAF1FC; --newtx-text:#2C5FA8;
  --warm-bg:#FFF6E5; --warm-border:#F5E3BC; --warm-text:#8A5A00;
  --violet-bg:#F2EEFC; --violet-border:#E1D8F7; --violet-text:#5B3FA8;
  --gray-bg:#F1F3F7; --gray-border:#E3E7EE;
  --r-lg:16px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(31,41,55,.04),0 3px 10px rgba(31,41,55,.05);
  /* cỡ chữ co giãn: nhỏ nhất 12px */
  --fs-xs:clamp(12px,3.2vw,13px);
  --fs-sm:clamp(13px,3.5vw,14px);
  --fs-md:clamp(14.5px,3.9vw,16px);
  --fs-lg:clamp(16px,4.4vw,18px);
  --fs-xl:clamp(19px,5.2vw,23px);
  --tap:clamp(44px,6.4vh,52px);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0); padding-bottom:0;
}
html{scroll-padding-top:env(safe-area-inset-top,0);-webkit-text-size-adjust:100%;text-size-adjust:100%;}
*{box-sizing:inherit;}
html,body{height:100%;overflow:hidden;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:var(--fs-md);line-height:1.45;-webkit-tap-highlight-color:transparent;}
body.home-white{background:#FFFFFF;}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
input,select,textarea{font:inherit;}
a{color:var(--accent);}

/* ---------- Khung app ---------- */
.wrap{max-width:480px;margin:0 auto;height:100vh;height:calc(var(--app-h,100dvh) - env(safe-area-inset-top,0px));padding:10px clamp(12px,3.6vw,18px) max(8px,calc(env(safe-area-inset-bottom,0px) - 12px));display:flex;flex-direction:column;overflow:hidden;}
@media (min-width:700px){.wrap{max-width:600px;padding-top:16px;}}
@media (min-width:1000px){.wrap{max-width:660px;}}
#app{flex:1;min-height:0;display:flex;flex-direction:column;}
.screen-flex{display:flex;flex-direction:column;flex:1;min-height:0;}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:4px;}
.fixed-top{flex:none;}
.fixed-bottom{flex:none;padding-top:8px;}
.fixed-bottom .btn.primary{margin-top:6px;}
.fixed-bottom .btn.primary:first-child{margin-top:4px;}
.screen-flex>.btn,.fixed-bottom .btn{flex:none;}

/* ---------- Thanh tiêu đề ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:4px 2px 14px;}
.topbar.sub{padding:2px 2px 10px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.brand-title{font-size:var(--fs-xl);font-weight:800;letter-spacing:.01em;}
.brand-title.small{font-size:var(--fs-lg);font-weight:700;line-height:1.3;}
.brand-sub{font-size:var(--fs-sm);color:var(--text-soft);margin-top:1px;}
.icon-btn{width:44px;height:44px;flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:20px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.icon-btn:active{background:var(--gray-bg);}
.center-title{flex:none;text-align:center;font-size:clamp(18px,2.9vh,23px);font-weight:800;padding:6px 4px 6px;}
.center-sub{flex:none;text-align:center;font-size:var(--fs-sm);color:var(--text-soft);padding:0 8px 10px;line-height:1.45;}
.sec-title{font-size:var(--fs-sm);font-weight:800;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em;margin:16px 2px 8px;}

/* ---------- Trang chủ ---------- */
.home-wrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;--bg:#FFFFFF;}
.home-header{flex:none;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 2px clamp(8px,1.6vh,16px);}
.home-topbar{align-self:stretch;display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.tb-gap{flex:1;}
.home-topbar .icon-btn{width:42px;height:42px;font-size:19px;}
.home-topbar .icon-btn.named{width:auto;max-width:55%;padding:0 12px;border-radius:21px;gap:6px;font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:40px;}
.home-icon-badge{width:clamp(56px,10vh,96px);height:clamp(56px,10vh,96px);font-size:clamp(38px,7vh,68px);display:flex;align-items:center;justify-content:center;margin:0 0 2px;line-height:1;}
.home-brand{font-size:clamp(38px,6.6vh,58px);font-weight:800;line-height:1.05;letter-spacing:.04em;}
.home-header .brand-sub{font-size:clamp(13px,1.9vh,15.5px);font-weight:700;margin-top:4px;}
.star-line{margin-top:clamp(4px,.9vh,8px);font-size:clamp(13px,1.9vh,15px);font-weight:700;color:#B7791F;}
.streak{white-space:nowrap;}
.streak .sn{font-weight:800;color:#E8590C;}
.streak.off .fl{filter:grayscale(1);opacity:.35;}
.streak.off .sn{color:var(--text-soft);opacity:.6;}

.card{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px 16px;margin:0 0 clamp(6px,1vh,10px);cursor:pointer;transition:transform .08s,box-shadow .15s;box-shadow:var(--shadow);}
.card:active{transform:scale(.985);}
.card-label{font-size:clamp(14.5px,2.1vh,17px);font-weight:600;color:var(--text-soft);line-height:1.25;}
.card-label small{font-size:var(--fs-xs);font-weight:500;opacity:.75;}
.card-amount{font-size:clamp(18px,2.9vh,22px);font-weight:700;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums;}
.home-wrap .card{flex:0 0 auto;min-height:clamp(50px,7vh,62px);}
.home-wrap>.card,.home-wrap>.card-pair{flex:1 1 auto;}
.home-wrap>.card.balance{max-height:104px;}
.home-wrap>.card.hist{max-height:76px;}
.home-wrap>.card-pair{max-height:100px;}
.home-wrap>.card-pair:last-of-type{max-height:80px;}
.card-pair .card{height:100%;}
.card-pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1vh,10px);margin-bottom:clamp(6px,1vh,10px);}
.card-pair .card{margin:0;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:clamp(62px,8.6vh,78px);padding:10px 14px;}
.card-pair .card-amount{font-size:clamp(16.5px,2.6vh,20px);max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.card-pair .card.quiz,.card-pair .card.partner{flex-direction:row;align-items:center;justify-content:space-between;min-height:clamp(50px,7vh,60px);}
.card.balance{background:linear-gradient(135deg,#EEF4FD 0%,#E3ECFA 100%);border-color:#D6E3F7;min-height:clamp(64px,9.4vh,86px);}
.card.balance .card-label{color:#2C5FA8;}
.card.balance .card-amount{font-size:clamp(22px,3.6vh,28px);color:#1E3F72;}
.card.balance .card-amount.pos{color:#1E3F72;}
.card.balance .card-amount.neg{color:var(--neg);}
.card.income{background:var(--income-bg);border-color:var(--income-border);}
.card.income .card-label,.card.income .card-amount{color:var(--income-text);}
.card.expense{background:var(--expense-bg);border-color:var(--expense-border);}
.card.expense .card-label,.card.expense .card-amount{color:var(--expense-text);}
.card.hist{background:var(--gray-bg);border-color:var(--gray-border);}
.card.hist .card-label{color:#374151;}
.card.hist .card-amount{color:#374151;font-size:clamp(16px,2.5vh,19px);}
.card.hist .card-amount.pos{color:var(--pos);}
.card.hist .card-amount.neg{color:var(--neg);}
.card.quiz{background:var(--violet-bg);border-color:var(--violet-border);}
.card.quiz .card-label,.card.quiz .card-amount{color:var(--violet-text);}
.card.partner{background:var(--warm-bg);border-color:var(--warm-border);}
.card.partner .card-label,.card.partner .card-amount{color:var(--warm-text);}
.card.quiz .card-amount,.card.partner .card-amount{font-size:24px;line-height:1;}
.backup-banner{display:block;width:100%;text-align:left;border:1px solid var(--warm-border);background:var(--warm-bg);color:var(--warm-text);border-radius:var(--r-md);padding:9px 14px;margin:0 0 clamp(6px,1vh,10px);font-size:var(--fs-sm);line-height:1.4;cursor:pointer;}
.backup-banner b{white-space:nowrap;}
.home-quote{flex:none;text-align:center;font-size:min(14px,3.4vw);font-weight:600;font-style:italic;line-height:1.5;color:#6B7280;padding:6px 4px 2px;margin-top:auto;overflow:hidden;}
.home-quote span{display:block;white-space:nowrap;}
.home-ver{flex:none;text-align:center;text-wrap:balance;font-size:12px;line-height:1.45;color:#8A94A6;padding:6px 8px 0;}
@media (max-height:640px){.home-icon-badge{display:none;}}
/* Giữ màn hình cố định: không kéo trôi ngang/dọc, không phóng to ngoài ý muốn */
html,body{overscroll-behavior:none;width:100%;}
body{touch-action:manipulation;}
.wrap{overflow-x:hidden;max-width:min(480px,100%);}
/* Thẻ không bao giờ rộng hơn màn hình, số tiền lớn tự thu nhỏ chữ (xem fitAmounts) */
.card,.card-label{min-width:0;}
.card-pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
.card.balance .card-label{flex:none;}
.card.hist .card-label{flex:1 1 0;}
.card.hist .card-amount{flex:0 1 auto;}
.card.balance .card-amount,.card.hist .card-amount{min-width:0;overflow:hidden;}
.card-pair .card-amount{text-overflow:clip;}
/* Màn hình thấp (trình duyệt có thanh địa chỉ, máy nhỏ): thu gọn để vừa 1 màn hình */
@media (max-height:600px){
 .home-brand{font-size:clamp(30px,6.4vh,40px);}
 .home-header{padding-bottom:6px;}
 .home-wrap .card{min-height:44px;}
 .card.balance{min-height:50px;}
 .card-pair .card{min-height:50px;padding:7px 12px;}
 .card-pair .card.quiz,.card-pair .card.partner{min-height:44px;}
 .home-quote{padding-top:3px;}
 .home-ver{font-size:11px;padding-top:2px;}
}
@media (max-height:520px){
 .home-header .brand-sub{display:none;}
 .home-quote{display:none;}
 .star-line{margin-top:2px;}
 .home-wrap .card,.card-pair{margin-bottom:6px;}
}

/* ---------- Danh sách ô lớn (Thu, Chi, Số dư) ---------- */
.fill-rows{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:8px;margin-bottom:8px;--fl:clamp(14.5px,2.1vh,17px);--fi:clamp(22px,3.2vh,28px);--fa:clamp(14.5px,2.2vh,18px);--fs:clamp(12px,1.55vh,13px);}
.fill-rows.big{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.fill-rows.two{flex-grow:2;}
.fill-rows.natural{flex:0 0 auto;overflow:visible;gap:10px;}
.fill-row{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:0 14px;cursor:pointer;font-size:var(--fl);font-weight:600;overflow:hidden;box-shadow:var(--shadow);}
.fill-row:active{transform:scale(.99);}
.fill-rows.big .fill-row{min-height:auto;overflow:visible;padding-top:8px;padding-bottom:8px;}
.fill-rows.natural .fill-row{flex:0 0 auto;min-height:var(--tap);padding-top:12px;padding-bottom:12px;}
.fill-row .ic{font-size:var(--fi);margin-right:10px;line-height:1;flex:none;}
.fill-row .lb{display:flex;align-items:center;min-width:0;flex:1;}
.fill-row .tx{display:flex;flex-direction:column;min-width:0;}
.fill-row .d{font-size:var(--fs);font-weight:400;color:var(--text-soft);line-height:1.35;margin-top:2px;}
.fill-row .stack{flex:none;}
.fill-row .am{font-size:var(--fa);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;}
.fill-row .sm{font-size:var(--fs);font-weight:600;}
.fill-row.xrow{flex-direction:column;align-items:stretch;justify-content:center;gap:5px;}
.fill-row.xrow .top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.fill-row.xrow .d{display:block;margin-top:0;font-style:italic;line-height:1.45;text-align:left;text-wrap:pretty;}
.fill-rows.jarblocks{gap:clamp(6px,1vh,10px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
.jar-block{flex:1 0 auto;min-height:0;display:flex;flex-direction:column;gap:4px;}
.jar-block .fill-row{flex:1 0 auto;min-height:clamp(46px,6.4vh,58px);}
.jar-guide{flex:none;width:100%;border:0;min-height:clamp(28px,3.8vh,34px);display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--newtx-text);border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:700;cursor:pointer;}
.jar-guide:active{transform:scale(.99);}

/* ---------- Hạn mức ---------- */
.lim-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px 8px;margin-bottom:8px;}
.jar-block .lim-bar{margin:0;padding:4px 10px 6px;}
.lim-txt{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-xs);color:var(--text-soft);margin-bottom:4px;font-weight:600;}
.lim-track{height:6px;border-radius:3px;background:var(--gray-bg);overflow:hidden;}
.lim-track i{display:block;height:100%;border-radius:3px;background:var(--pos);transition:width .3s;}
.lim-bar.warn .lim-track i{background:#E8A33D;}
.lim-bar.over .lim-track i{background:var(--neg);}
.lim-bar.over .lim-txt span:last-child{color:var(--neg);}
.lim-row label small{font-size:var(--fs-xs);opacity:.85;}

/* ---------- Danh sách giao dịch ---------- */
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;margin-bottom:8px;font-size:var(--fs-md);}
.list-item.slim{padding:8px 0;margin:0;border:0;border-top:1px solid var(--border);border-radius:0;background:none;}
.list-item.slim:first-child{border-top:0;}
.list-item.clickable{cursor:pointer;box-shadow:var(--shadow);}
.list-item.clickable:active{transform:scale(.99);}
.list-item .note{font-size:var(--fs-sm);color:var(--text-soft);margin-top:2px;overflow-wrap:anywhere;}
.list-item .date{font-size:var(--fs-xs);color:var(--text-soft);margin-top:2px;}
.util-item{padding:clamp(13px,2.1vh,18px) 16px;margin-bottom:clamp(8px,1.3vh,12px);font-size:var(--fs-md);font-weight:600;border-radius:var(--r-lg);}
.tx-info{flex:1;min-width:0;}
.tx-name{font-weight:600;}
.tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;}
.tx-actions{display:flex;gap:6px;}
.tr-amt{color:var(--accent-strong);font-weight:700;white-space:nowrap;}
.hist-sum{display:flex;gap:8px;margin-bottom:12px;}
.hist-sum div{flex:1;border-radius:var(--r-md);padding:10px 12px;font-size:var(--fs-xs);}
.hist-sum b{display:block;font-size:var(--fs-lg);margin-top:2px;font-variant-numeric:tabular-nums;}
.hist-sum .i{background:var(--income-bg);color:var(--income-text);}
.hist-sum .o{background:var(--expense-bg);color:var(--expense-text);}
.hist-time{font-size:var(--fs-xs);color:var(--text-soft);margin-top:2px;}
.stack{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:var(--fs-sm);}
.amt-lg{font-size:var(--fs-lg);font-weight:800;}
.pos{color:var(--pos);font-weight:600;}
.neg{color:var(--neg);font-weight:600;}
.err{color:var(--neg)!important;}
.err-msg{color:var(--neg);font-size:var(--fs-sm);margin:4px 0 12px;}
.empty{text-align:center;color:var(--text-soft);font-size:var(--fs-sm);padding:32px 8px;}
.search-box{margin-bottom:8px;}
.search-box input{width:100%;font-size:16px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--text);}
.search-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

/* ---------- Biểu mẫu ---------- */
.form-row{margin-bottom:14px;}
.form-row.tight{margin-bottom:8px;}
.form-row label{display:block;font-size:var(--fs-xs);font-weight:600;color:var(--text-soft);margin-bottom:4px;}
.form-row input,.form-row select,.form-row textarea{width:100%;font-size:16px;padding:9px 12px;min-height:44px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.form-row input[type=date]{-webkit-appearance:none;appearance:none;}
.form-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:8px;}
.form-2 input[type=date]{padding-left:8px;padding-right:6px;font-size:15px;}
.edit-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--warm-bg);color:var(--warm-text);border:1px solid var(--warm-border);border-radius:var(--r-sm);padding:6px 10px;margin-bottom:8px;font-size:var(--fs-sm);font-weight:700;}
.amt-hint{font-size:var(--fs-xs);color:var(--accent);margin-top:3px;min-height:0;}
.amt-hint:empty{display:none;}
.filter-row{display:flex;gap:8px;margin-bottom:8px;}
.filter-row select,.filter-row input{flex:1;min-width:0;font-size:15px;padding:8px 10px;min-height:40px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);}
.filter-total{font-size:var(--fs-sm);color:var(--text-soft);margin-bottom:12px;}
.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

/* ---------- Nút ---------- */
.btn{font:inherit;font-size:var(--fs-md);font-weight:700;border:none;border-radius:var(--r-md);padding:0 12px;min-height:var(--tap);cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;}
.btn:active{transform:scale(.99);}
.btn.primary{background:var(--accent);color:var(--accent-text);margin-top:4px;box-shadow:0 2px 8px rgba(59,111,196,.22);}
.btn.primary:active{background:var(--accent-strong);}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
.btn.back{background:var(--surface);color:var(--text-soft);border:1px solid var(--border);margin-top:6px;}
.btn.home{background:var(--surface);color:var(--accent);border:1px solid #C9D9F2;margin-top:6px;}
.btn.market{background:var(--newtx-bg);color:var(--newtx-text);box-shadow:none;}
.btn.cancel{background:var(--surface);color:var(--text-soft);border:1px solid var(--border);}
.btn.cancel.wide{color:var(--accent-strong);border-color:#C9D9F2;background:var(--accent-soft);}
.mini-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text-soft);font-size:var(--fs-sm);border-radius:8px;padding:5px 10px;min-height:32px;cursor:pointer;}
.mini-btn:active{background:var(--border);}
.mini-btn:disabled{opacity:.4;cursor:default;}

/* ---------- Cài đặt, tỷ lệ ---------- */
.set-group{font-size:var(--fs-xs);font-weight:800;color:var(--text-soft);text-transform:uppercase;letter-spacing:.05em;margin:14px 4px 6px;}
.set-group:first-child{margin-top:2px;}
.set-go{color:var(--accent);font-weight:600;font-size:var(--fs-sm);white-space:nowrap;}
.pct-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:var(--fs-md);min-height:var(--tap);}
.pct-row.enjoy{background:var(--newtx-bg);color:var(--newtx-text);font-weight:600;border-color:#D6E3F7;}
.mode-row{cursor:pointer;}
.mode-row:active{background:var(--surface-2);}
.pct-input{display:flex;align-items:center;gap:4px;flex:none;}
.pct-input input{width:clamp(52px,15vw,64px);font-size:16px;text-align:right;border:1px solid var(--border);border-radius:8px;padding:7px 8px;background:var(--surface-2);color:var(--text);}
.rt-total{font-size:var(--fs-sm);color:var(--text-soft);margin-bottom:8px;text-align:center;}
.rt-total b{color:var(--text);}
.rt-presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px;}
.rt-preset{border:1px solid #D6E3F7;background:var(--accent-soft);color:var(--accent-strong);border-radius:12px;padding:8px 4px;cursor:pointer;text-align:center;line-height:1.25;}
.rt-preset b{display:block;font-size:var(--fs-xs);}
.rt-preset small{display:block;font-size:12px;letter-spacing:-.2px;opacity:.8;margin-top:2px;overflow-wrap:anywhere;}
.rt-preset:active{background:#DCE8FA;}
.pct-row.rt-row{padding:clamp(8px,1.3vh,12px) 14px;margin-bottom:clamp(6px,1vh,8px);}
.rt-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.rt-n{font-size:var(--fs-sm);line-height:1.3;}
.rt-am{font-size:clamp(15px,2.3vh,18px);font-weight:800;line-height:1.2;white-space:nowrap;}
.amt-opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font-size:var(--fs-md);padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text);margin-bottom:8px;cursor:pointer;}
.amt-opt small{display:block;color:var(--text-soft);font-weight:400;font-size:var(--fs-xs);margin-top:2px;}
.amt-opt.sel{border-color:var(--accent);color:var(--accent);font-weight:700;background:var(--accent-soft);}
.guide-desc{font-size:var(--fs-sm);color:var(--text-soft);margin:4px 0 14px;line-height:1.55;}
.guide-cta{color:var(--accent);font-weight:700;font-size:var(--fs-sm);white-space:nowrap;}

/* ---------- Chuyển ví ---------- */
.tr-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;box-shadow:var(--shadow);}
.tr-arrow{text-align:center;color:var(--accent);font-size:18px;line-height:1;margin:-2px 0 4px;}

/* ---------- Báo cáo tháng ---------- */
.rp-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.rp-nav input{flex:1;min-width:0;font-size:16px;font-weight:700;text-align:center;padding:8px;min-height:42px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);}
.rp-nav .mini-btn{min-width:44px;min-height:42px;font-size:16px;}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rp-box{border-radius:var(--r-md);padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:var(--fs-xs);border:1px solid transparent;}
.rp-box b{font-size:var(--fs-lg);font-variant-numeric:tabular-nums;}
.rp-box.in{background:var(--income-bg);color:var(--income-text);border-color:var(--income-border);}
.rp-box.out{background:var(--expense-bg);color:var(--expense-text);border-color:var(--expense-border);}
.rp-box.net{grid-column:1/-1;background:var(--surface);border-color:var(--border);color:var(--text-soft);}
.rp-box.net b{font-size:var(--fs-xl);}
.rp-cmp{font-size:12px;font-weight:600;color:var(--text-soft);}
.rp-cmp.pos{color:var(--pos);}
.rp-cmp.neg{color:var(--neg);}
.rp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px 14px;box-shadow:var(--shadow);}
.rp-bar{padding:6px 0;}
.rp-bl{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-sm);margin-bottom:4px;}
.rp-bl span:last-child{font-weight:700;white-space:nowrap;}
.rp-track{height:8px;border-radius:4px;background:var(--gray-bg);overflow:hidden;}
.rp-track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#7FA6E3,#3B6FC4);}
.rp-lim{font-size:12px;color:var(--text-soft);margin-top:3px;}
.rp-chart{display:flex;align-items:stretch;gap:6px;height:clamp(130px,22vh,190px);}
.rp-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:4px 0 0;border-radius:8px;cursor:pointer;}
.rp-col.on{background:var(--accent-soft);}
.rp-bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;}
.rp-bars i{display:block;width:min(14px,36%);min-height:2px;border-radius:4px 4px 0 0;}
.bi{background:#6CC596;}
.bo{background:#EE9A97;}
.rp-ml{font-size:12px;color:var(--text-soft);font-weight:600;}
.rp-col.on .rp-ml{color:var(--accent-strong);}
.rp-legend{display:flex;justify-content:center;gap:16px;font-size:var(--fs-xs);color:var(--text-soft);margin-top:6px;}
.rp-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}

/* ---------- Hộp thoại ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
.modal-overlay.open{display:flex;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(17,24,39,.18);max-height:90vh;overflow-y:auto;}
.modal-box p{font-size:var(--fs-md);color:var(--text);margin:0 0 18px;line-height:1.55;}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{margin-top:0;}
.modal-actions .btn.confirm{background:var(--accent);color:var(--accent-text);}
#confirmModal.info .btn.cancel{display:none;}
.game-loading .modal-box{max-width:240px;padding:22px 18px;}
.spin{width:34px;height:34px;margin:0 auto 10px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Khóa app ---------- */
.lock-screen{overflow-y:auto;}
.lock-inner{margin:auto 0;width:100%;max-width:360px;align-self:center;padding:8px 0;}
.lock-logo{text-align:center;font-size:clamp(34px,6vh,44px);font-weight:800;letter-spacing:.04em;}
.lock-name{text-align:center;font-size:var(--fs-lg);font-weight:700;margin:4px 0 12px;}
.lock-dots{text-align:center;font-size:26px;font-weight:800;letter-spacing:6px;padding:10px 12px;min-height:52px;line-height:1.4;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);}
.lock-ph{font-size:var(--fs-sm);font-weight:400;letter-spacing:0;opacity:.5;}
.lock-err{text-align:center;min-height:20px;margin:6px 0 0;}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;}
.lock-key{font-size:22px;font-weight:700;height:clamp(48px,7.2vh,60px);border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);cursor:pointer;box-shadow:var(--shadow);}
.lock-key:active{background:var(--gray-bg);}
.lock-key:disabled,.lock-ok:disabled{opacity:.4;cursor:not-allowed;}
.lock-forgot{text-align:center;margin-top:12px;}

/* ---------- Đố vui ---------- */
.qz-meta{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-sm);font-weight:700;margin-bottom:8px;}
.qz-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-bottom:14px;}
.qz-bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear;}
.qz-q{font-size:var(--fs-lg);font-weight:700;line-height:1.45;margin-bottom:14px;text-wrap:balance;}
.qz-opt{display:block;width:100%;text-align:left;font-size:var(--fs-md);line-height:1.4;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer;}
.qz-opt:active{transform:scale(.99);}
.qz-opt:disabled{cursor:default;transform:none;}
.qz-opt.ok{background:var(--income-bg);border-color:var(--pos);color:var(--income-text);font-weight:700;}
.qz-opt.bad{background:var(--expense-bg);border-color:var(--neg);color:var(--expense-text);}
.qz-exp{font-size:var(--fs-sm);line-height:1.55;background:var(--newtx-bg);color:var(--newtx-text);border-radius:12px;padding:10px 14px;margin-top:4px;}
.qz-big{font-size:46px;font-weight:800;text-align:center;margin:10px 0 0;}

/* ---------- Đồng hành, mua sắm ---------- */
.partner-head{flex:none;text-align:center;background:var(--warm-bg);border:1px solid var(--warm-border);border-radius:var(--r-lg);padding:10px 14px;margin-bottom:10px;}
.ph-title{font-size:clamp(18px,2.9vh,23px);font-weight:800;color:var(--warm-text);}
.ph-contact{font-size:var(--fs-sm);font-weight:600;color:var(--warm-text);margin-top:3px;}
.ph-contact a{color:var(--warm-text);text-decoration:underline;}
.fill-ads{flex:1 1 0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:8px 14px 4px;margin-bottom:6px;}
.ad-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.ad-item{display:block;padding:13px 0;border-top:1px solid var(--border);color:var(--text);text-decoration:none;font-size:var(--fs-sm);line-height:1.5;text-align:center;}
.ad-item:first-child{border-top:none;}
.ad-item.ph{color:var(--text-soft);}
.ad-item b{color:var(--accent);}
.lk-ic{width:18px;height:18px;flex:none;}
.link-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;font-size:var(--fs-md);font-weight:600;color:var(--text);text-decoration:none;min-height:var(--tap);}
.link-row .lk-ic{width:24px;height:24px;}
.link-row.off{color:var(--text-soft);font-weight:500;}
.link-row .go{margin-left:auto;color:var(--accent);font-size:20px;line-height:1;}
.link-pair{display:flex;gap:8px;}
.link-pair .link-row{flex:1 1 0;min-width:0;justify-content:flex-start;padding:12px 10px;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;}
.link-row.shop{background:var(--warm-bg);border-color:var(--warm-border);color:var(--warm-text);cursor:pointer;}
.link-row.shop .go{color:var(--warm-text);}
.shop-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.shop-tab{display:flex;align-items:center;justify-content:center;gap:4px;padding:12px 2px;font-size:clamp(13px,3.6vw,15px);font-weight:700;white-space:nowrap;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer;}
.shop-tab span:first-child{font-size:1.2em;line-height:1;}
.shop-tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.shop-list .empty{padding:20px 0;}
.guide-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;margin-bottom:8px;font-size:var(--fs-md);text-decoration:none;color:var(--text);}
.guide-item.plain{color:var(--text-soft);}
.guide-row{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;overflow:hidden;}
.gr-info{flex:1;min-width:0;padding:9px 14px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;}
.gr-info:active{background:var(--surface-2);}
.gr-name{font-size:var(--fs-md);line-height:1.35;color:var(--text);}
.gr-note{font-size:var(--fs-sm);font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gr-buy{flex:none;display:flex;align-items:center;justify-content:center;padding:0 10px;border-left:1px solid var(--border);color:var(--accent);font-weight:700;font-size:var(--fs-xs);text-decoration:none;white-space:nowrap;}
.gr-buy:active{background:var(--surface-2);}
#prodInfoBox{position:relative;text-align:left;max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 14px;}
.pi-title{font-size:var(--fs-lg);font-weight:800;line-height:1.35;padding-right:34px;margin-bottom:2px;}
.pi-name{font-size:var(--fs-sm);color:var(--text-soft);margin-bottom:6px;}
.pi-h{font-size:var(--fs-md);font-weight:800;margin:12px 0 4px;}
#prodInfoBox ul{margin:0;padding-left:20px;font-size:var(--fs-sm);line-height:1.55;}
#prodInfoBox li{margin-bottom:3px;}
.pi-video{display:block;text-align:center;margin-top:14px;padding:12px;border-radius:var(--r-md);background:#E03131;color:#fff;font-weight:800;font-size:var(--fs-md);text-decoration:none;}
.pi-foot{text-align:center;font-size:12px;color:var(--text-soft);margin-top:10px;line-height:1.45;}
.vd-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;}
.vd-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.buy-name{font-size:var(--fs-lg);font-weight:800;line-height:1.4;margin:0 0 6px;}
.buy-note{font-size:var(--fs-sm);line-height:1.55;color:var(--text-soft);margin:0 0 14px;}
.buy-go{display:block;text-align:center;padding:13px;border-radius:var(--r-md);background:var(--accent);color:var(--accent-text);font-weight:800;font-size:var(--fs-md);text-decoration:none;}

/* ---------- Hướng dẫn chi tiêu từng ví ---------- */
#jarGuideBox{position:relative;text-align:left;max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 14px;}
.jg-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:10px;font-size:16px;cursor:pointer;}
.jg-title{font-size:var(--fs-lg);font-weight:800;line-height:1.35;padding-right:36px;margin-bottom:6px;}
.jg-pct{font-size:var(--fs-sm);color:var(--text-soft);margin-bottom:10px;}
.jg-h{font-size:var(--fs-md);font-weight:800;margin:10px 0 4px;}
.jg-h.ok{color:var(--pos);}
.jg-h.no{color:var(--neg);}
#jarGuideBox ul,.jg-inline ul{margin:0;padding-left:20px;font-size:var(--fs-sm);line-height:1.6;}
#jarGuideBox li,.jg-inline li{margin-bottom:3px;}
.jg-inline{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;margin-top:4px;}
.jg-inline .jg-title{padding-right:0;}
.jg-foot{text-align:center;font-size:12px;color:var(--text-soft);margin-top:12px;}

/* ---------- Cài app ---------- */
.ins-tabs{display:flex;gap:8px;margin-bottom:12px;}
.ins-tab{flex:1;font-size:var(--fs-sm);font-weight:700;padding:9px;min-height:40px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text-soft);cursor:pointer;}
.ins-tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.ins-steps{text-align:left;font-size:var(--fs-sm);line-height:1.6;margin:0 0 12px;padding-left:22px;}
.ins-steps li{margin-bottom:6px;}
.ins-warn{text-align:left;font-size:var(--fs-sm);line-height:1.55;background:var(--warm-bg);color:var(--warm-text);border-radius:12px;padding:10px 12px;margin-bottom:12px;}
.ins-warn.soft{background:var(--accent-soft);color:var(--newtx-text);}

/* ---------- Khoản nợ, mục tiêu, hóa đơn ---------- */
.debt-sum{display:flex;gap:8px;margin-bottom:12px;}
.debt-sum div{flex:1;border-radius:var(--r-md);padding:10px 12px;font-size:var(--fs-xs);}
.debt-sum b{display:block;font-size:var(--fs-lg);margin-top:2px;}
.debt-sum .o{background:var(--expense-bg);color:var(--expense-text);}
.debt-sum .l{background:var(--income-bg);color:var(--income-text);}
.debt-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:12px;}
.debt-late{color:var(--neg);font-weight:700;}
.gl-bar{height:8px;border-radius:4px;background:var(--gray-bg);overflow:hidden;margin:6px 0 4px;}
.gl-bar i{display:block;height:100%;background:var(--pos);}
.fc-wrap{max-height:340px;overflow:auto;-webkit-overflow-scrolling:touch;}
.fc-t{width:100%;border-collapse:collapse;font-size:12px;}
.fc-t th,.fc-t td{padding:6px 4px;text-align:right;border-top:1px solid var(--border);}
.fc-t th{position:sticky;top:0;background:var(--surface);color:var(--text-soft);font-size:12px;}
.fc-t td:first-child,.fc-t th:first-child{text-align:center;}

/* ---------- Kế hoạch, lịch chọn ngày ---------- */
.plan{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px;}
.plan th{font-size:12px;color:var(--text-soft);text-align:center;padding:4px 2px;}
.plan th:nth-child(1),.plan th:nth-child(2){width:17%;}
.plan th:nth-child(4){width:13%;}
.plan td{padding:2px;border:1px solid var(--border);background:var(--surface);}
.plan input{width:100%;min-width:0;box-sizing:border-box;font-size:13px;padding:7px 1px;border:none;background:transparent;color:var(--text);}
.plan input[type=time]{text-align:center;padding:7px 0;}
.plan input[type=time]::-webkit-calendar-picker-indicator{display:none;}
.plan td:nth-child(3) input{font-size:14px;padding:7px 4px;}
.res-btn{width:100%;height:34px;border:none;background:transparent;font-size:20px;font-weight:800;cursor:pointer;line-height:1;}
.res-btn.v{color:var(--pos);}
.res-btn.x{color:var(--neg);}
.res-btn.n{color:var(--text-soft);opacity:.45;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:var(--fs-md);}
.cal-head .mini-btn{font-size:18px;padding:2px 14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-w{font-size:12px;color:var(--text-soft);padding:2px 0;}
.cal-d{padding:8px 0;border-radius:10px;font-size:14px;font-weight:600;color:var(--text-soft);cursor:pointer;}
.cal-d.done{color:var(--pos);background:var(--income-bg);font-weight:800;}
.cal-d.fail{color:var(--neg);background:var(--expense-bg);font-weight:800;}
.cal-d.today{outline:2px solid var(--accent);outline-offset:-2px;}
.cal-sum{font-size:var(--fs-xs);margin:10px 0 12px;}

/* ---------- Sổ ghi chú ---------- */
.nt-grid{column-count:2;column-gap:10px;}
@media (min-width:600px){.nt-grid{column-count:3;}}
.nt-card{position:relative;break-inside:avoid;margin-bottom:10px;padding:12px 12px 8px;border-radius:var(--r-md);border:1px solid var(--border);cursor:pointer;overflow-wrap:anywhere;}
.nt-card:active{transform:scale(.99);}
.nt-t{font-weight:800;font-size:var(--fs-md);margin-bottom:4px;padding-right:18px;}
.nt-b{font-size:var(--fs-sm);line-height:1.5;white-space:pre-wrap;}
.nt-d{font-size:12px;opacity:.6;margin-top:6px;}
.nt-pin{position:absolute;top:6px;right:8px;font-size:12px;}
.nc0{background:var(--surface);color:var(--text);}
.nc1{background:#FFF6E0;color:#3B2F10;}
.nc2{background:#E9F7EF;color:#173323;}
.nc3{background:#EAF1FC;color:#1B2A40;}
.nc4{background:#FDEBF1;color:#4A1F2C;}
.nc5{background:#F2EEFC;color:#2E2057;}
.nt-edit{border-radius:var(--r-md);border:1px solid var(--border);padding:10px 12px;}
.nt-in-t,.nt-in-b{display:block;width:100%;color:inherit;background:transparent;border:none;outline:none;resize:none;}
.nt-in-t{font-size:18px;font-weight:800;padding:6px 0;border-bottom:1px solid rgba(128,128,128,.25);}
.nt-in-b{font-size:16px;line-height:1.55;min-height:34vh;padding:8px 0;}
.nt-in-t::placeholder,.nt-in-b::placeholder{color:inherit;opacity:.45;}
.nt-tools{display:flex;align-items:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap;}
.nt-dots{display:flex;gap:6px;flex:1;}
.nt-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0;}
.nt-dot.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}

/* ---------- Bấm giờ, máy tính, đổi đơn vị ---------- */
.sw-time{text-align:center;font-size:clamp(44px,12vw,62px);font-weight:800;font-variant-numeric:tabular-nums;margin:18px 0 16px;}
.sw-btns{display:flex;gap:12px;margin-bottom:16px;}
.sw-b{flex:1;font-size:var(--fs-md);font-weight:700;padding:14px 8px;min-height:var(--tap);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;}
.sw-b:disabled{opacity:.4;cursor:not-allowed;}
.sw-b.main{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.sw-b.main.stop{background:var(--neg);border-color:var(--neg);}
.cd-in{display:flex;gap:10px;justify-content:center;margin:18px 0 10px;}
.cd-in div{text-align:center;}
.cd-in input{width:clamp(66px,20vw,80px);font-size:clamp(28px,8vw,34px);font-weight:800;text-align:center;padding:8px 4px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--text);}
.cd-in label{display:block;font-size:12px;color:var(--text-soft);margin-top:3px;}
.cd-presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;}
.calc-disp{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px 14px;margin-bottom:12px;text-align:right;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;}
.calc-expr{font-size:var(--fs-md);color:var(--text-soft);min-height:20px;word-break:break-all;}
.calc-res{font-size:clamp(32px,9vw,42px);font-weight:800;line-height:1.2;word-break:break-all;}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
.calc-k{font-size:22px;font-weight:700;height:clamp(50px,8vh,62px);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;}
.calc-k:active{background:var(--border);}
.calc-k.fn{background:var(--surface-2);color:var(--text-soft);}
.calc-k.op{background:var(--newtx-bg);color:var(--newtx-text);}
.calc-k.eq{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.calc-k.zero{grid-column:span 2;}
.cv-sel{font-size:var(--fs-sm);padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);}
.cv-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;margin-top:10px;}
.cv-box label{display:block;font-size:12px;color:var(--text-soft);margin-bottom:4px;}
.cv-line{display:flex;gap:8px;align-items:center;}
.cv-line input{flex:1;min-width:0;font-size:22px;font-weight:700;padding:6px 8px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);}
.cv-line select{flex:none;max-width:46%;}
.cv-out{flex:1;min-width:0;font-size:22px;font-weight:800;color:var(--accent);padding:6px 8px;word-break:break-all;}

/* ---------- Lịch vạn niên ---------- */
.lc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;}
.lc-d{padding:5px 0 4px;border-radius:10px;cursor:pointer;border:1px solid transparent;}
.lc-d b{display:block;font-size:15px;line-height:1.25;}
.lc-d small{display:block;font-size:11px;color:var(--text-soft);line-height:1.2;}
.lc-d.sun b{color:var(--neg);}
.lc-d.rm small,.lc-d.hol small{color:var(--neg);font-weight:700;}
.lc-d.hol b{text-decoration:underline;text-decoration-color:var(--neg);}
.lc-d.today{border-color:var(--accent);}
.lc-d.sel{background:var(--accent);}
.lc-d.sel b,.lc-d.sel small{color:var(--accent-text);}
.lc-hero{touch-action:pan-y;-webkit-user-select:none;user-select:none;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 10px;margin:10px 0;box-shadow:var(--shadow);}
.lc-wd{font-size:var(--fs-sm);font-weight:700;color:var(--text-soft);}
.lc-big{font-size:44px;font-weight:800;line-height:1.1;}
.lc-big small{font-size:18px;font-weight:600;color:var(--text-soft);}
.lc-lun{font-size:var(--fs-sm);margin-top:4px;}
.lc-quote{margin:8px 6px 2px;font-size:var(--fs-sm);font-style:italic;line-height:1.55;color:var(--text-soft);}
.lc-hol{margin-top:6px;font-size:var(--fs-sm);font-weight:700;color:var(--neg);}
.lc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;margin-bottom:10px;}
.lc-h{font-size:var(--fs-sm);font-weight:800;margin-bottom:6px;}
.lc-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--border);font-size:var(--fs-sm);line-height:1.45;}
.lc-row:first-of-type{border-top:none;}
.lc-l{color:var(--text-soft);flex:none;}
.lc-v{text-align:right;font-weight:600;}
.lc-hrs{font-size:var(--fs-sm);line-height:1.6;margin-bottom:6px;}
.lc-hrs span{font-weight:800;}
.lc-hrs small{color:var(--text-soft);font-size:12px;}
.lc-do{font-size:var(--fs-sm);line-height:1.55;margin-bottom:6px;}
.lc-q{padding:7px 0;border-top:1px solid var(--border);font-size:var(--fs-sm);line-height:1.55;}
.lc-q:first-of-type{border-top:none;}
.lc-q div{font-style:italic;color:var(--text-soft);}

/* ---------- Màn hình chào ---------- */
.boot-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(5vw,28px);padding:0 10vw;text-align:center;background:#FFFFFF;transition:opacity .3s ease;}
.boot-splash.hide{opacity:0;pointer-events:none;}
html.fast-start .boot-splash{display:none!important;}
.boot-emoji{font-size:min(20vw,120px);line-height:1;animation:bootZoom .8s cubic-bezier(.2,1.15,.4,1) forwards;}
.boot-brand{font-size:min(11vw,64px);line-height:1;font-weight:800;letter-spacing:.02em;opacity:0;animation:bootIn .5s ease forwards;animation-delay:.3s;}
.boot-tagline{font-size:min(4.6vw,22px);font-weight:700;color:#24427A;max-width:360px;line-height:1.6;opacity:0;animation:bootIn .6s ease forwards;animation-delay:.6s;}
@keyframes bootZoom{0%{transform:scale(.55);opacity:0;}55%{opacity:1;}100%{transform:scale(1);opacity:1;}}
@keyframes bootIn{0%{opacity:0;transform:translateY(12px);}100%{opacity:1;transform:translateY(0);}}

/* ---------- Màn hình thấp ---------- */
@media (max-height:700px){
 .list-item{padding:8px 12px;margin-bottom:6px;}
 .form-row input,.form-row select{min-height:40px;padding:7px 12px;}
 .topbar.sub{padding-bottom:6px;margin-bottom:8px;}
 .util-item{padding:13px 14px;margin-bottom:8px;}
 :root{--tap:44px;}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important;}}

/* ---------- Khóa nội dung ---------- */
.unlock-ov{z-index:100005;}
.unlock-box{max-width:380px;}
.ul-ic{font-size:44px;line-height:1;margin-bottom:6px;}
.ul-t{font-size:var(--fs-lg);font-weight:800;margin-bottom:6px;}
.unlock-box .ul-p{font-size:var(--fs-sm);margin:0 0 12px;}
.ul-send{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.ul-send .btn{text-decoration:none;margin:0;}
.ul-sms{font-size:var(--fs-xs);color:var(--text-soft);margin-bottom:12px;}
.ul-in{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;text-align:center;letter-spacing:1px;}
.ul-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.ul-err{min-height:18px;margin:6px 0 10px;font-size:var(--fs-xs);}
.ul-banner{display:block;width:100%;text-align:left;border:1px solid var(--warm-border);background:var(--warm-bg);color:var(--warm-text);border-radius:var(--r-md);padding:10px 14px;margin:0 0 12px;font-size:var(--fs-sm);line-height:1.45;cursor:pointer;}
#confirmModal{z-index:100006;}
.ul-admin{display:block;margin:12px auto 0;border:0;background:none;color:var(--text-soft);font-size:12px;text-decoration:underline;cursor:pointer;}
.ul-gen{display:none;margin-top:10px;text-align:left;}.ul-gen.on{display:block;}
.ul-gen .btn{margin:8px 0 0;}
.ul-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px;margin-top:10px;word-break:break-all;}
/* ---------- Khung chung cho các game mở toàn màn hình ---------- */
.gm-ov{position:fixed;inset:0;z-index:99998;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gm-ov.show{display:flex}
#vnhOv{background:#2b1b10}#vnvOv{background:#0e2a2a}
.gm-bar{flex:none;display:flex;justify-content:space-between;padding:8px 12px}
.gm-x{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;padding:8px 14px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.gm-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 20px}

/* ================= CẢI THIỆN TRẢI NGHIỆM (bản 2026.10.29) ================= */
/* ---------- Nút ＋ Ghi chi nổi ở trang chủ ---------- */
.qa-fab{position:fixed;z-index:60;right:max(14px,calc(50% - 226px));bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 4px);display:flex;align-items:center;gap:6px;height:52px;padding:0 20px 0 16px;border:0;border-radius:26px;background:var(--expense-text);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(192,68,63,.38),0 2px 4px rgba(0,0,0,.12);}
.qa-fab b{font-size:26px;line-height:1;font-weight:700;margin-top:-2px;}
.qa-fab:active{transform:scale(.96);}
body:not(.home-white) .qa-fab{display:none;}
/* chừa chỗ cho nút nổi để không che chữ cuối trang chủ */
.home-ver{padding-bottom:66px;}
/* ---------- Bảng ghi chi nhanh (trượt từ dưới lên) ---------- */
.sheet-ov{position:fixed;inset:0;z-index:120;background:rgba(17,24,39,.42);display:none;align-items:flex-end;justify-content:center;}
.sheet-ov.open{display:flex;animation:fadeIn .15s ease;}
.sheet{width:100%;max-width:520px;max-height:calc(var(--app-h,100dvh) - 12px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(17,24,39,.18);animation:sheetUp .22s cubic-bezier(.2,.9,.3,1);}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6;}to{transform:none;opacity:1;}}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--border);margin:2px auto 8px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.sheet-title{font-size:var(--fs-lg);font-weight:800;}
.sheet-x{width:36px;height:36px;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;font-size:16px;cursor:pointer;color:var(--text);}
.qa-amt{width:100%;font-size:30px;font-weight:800;text-align:center;padding:8px 12px;min-height:58px;border:2px solid var(--expense-border);border-radius:14px;background:var(--expense-bg);color:var(--expense-text);font-variant-numeric:tabular-nums;}
.qa-amt:focus{outline:none;border-color:var(--expense-text);}
.qa-amt::placeholder{color:var(--expense-text);opacity:.4;font-size:19px;font-weight:600;}
.rp-card .rp-bar+.rp-bar{border-top:1px dashed var(--border);margin-top:4px;padding-top:8px;}
.qa-hint{text-align:center;font-size:var(--fs-sm);font-weight:700;color:var(--expense-text);min-height:20px;margin:3px 0 2px;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;}
.chip-row.scroll-x{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
.chip-row.scroll-x::-webkit-scrollbar{display:none;}
.chip{flex:none;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:var(--fs-sm);font-weight:600;border-radius:18px;padding:6px 12px;min-height:34px;cursor:pointer;white-space:nowrap;}
.chip:active{background:var(--border);}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.chip-row.amts{flex-wrap:nowrap;}
.chip-row.amts .chip{flex:1;padding:6px 4px;}
.chip.amt{font-weight:800;color:var(--expense-text);background:var(--expense-bg);border-color:var(--expense-border);}
.chip.sug{background:var(--accent-soft);border-color:#D6E3F7;color:var(--newtx-text);}
.chip.sug small{opacity:.7;font-weight:500;margin-left:2px;}
.qa-lbl{font-size:var(--fs-xs);font-weight:700;color:var(--text-soft);margin:4px 2px 4px;}
.qa-note{width:100%;font-size:16px;padding:9px 12px;min-height:44px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);}
.qa-note:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.sug-box{min-height:0;}
.sug-box .chip-row{margin:6px 0 4px;}
.jar-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px;}
.jp{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 6px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit;min-width:0;}
.jp .i{font-size:22px;line-height:1.1;}
.jp .n{font-size:12.5px;font-weight:700;line-height:1.25;text-align:center;}
.jp .b{font-size:11.5px;font-weight:600;color:var(--pos);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.jp .b.neg{color:var(--neg);}
.jp.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent);}
.qa-date{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.qa-date input{flex:1;min-width:130px;font-size:15px;padding:6px 8px;min-height:34px;border:1px solid var(--border);border-radius:18px;background:var(--surface);color:var(--text);}
.qa-save{margin-top:2px;}
.qa-tip{background:var(--warm-bg);border:1px solid var(--warm-border);color:var(--warm-text);border-radius:12px;padding:8px 12px;font-size:var(--fs-sm);line-height:1.45;margin-bottom:8px;}
/* ---------- Thông báo nhỏ có nút Hoàn tác ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-20px);opacity:0;pointer-events:none;z-index:200;display:flex;align-items:center;gap:12px;width:max-content;max-width:min(440px,calc(100vw - 24px));background:#1F2937;color:#fff;border-radius:14px;padding:10px 10px 10px 16px;font-size:var(--fs-sm);line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .2s,transform .2s;}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}

function cleanInfo(x){
  if(!x||typeof x!=='object')return null;
  const o={};let any=false;
  ['shop','product','price','policy'].forEach(k=>{
    let v=x[k]; if(typeof v==='string')v=[v];
    if(Array.isArray(v)){

  function cleanGuides(d){

// ===== Khóa app bằng mật khẩu (chỉ khóa trên máy này, không đồng bộ) =====
// Mật khẩu không lưu dạng chữ mà lưu dạng băm SHA-256 kèm chuỗi ngẫu nhiên (salt).
const ACCOUNT_KEY='6pay-account-v1';
const LOCKFAIL_KEY='6pay-lockfail-v1';
const LOCK_MAX_TRY=5, LOCK_WAIT_MS=30000;
let loggedIn=false;
function getAccount(){try{const s=localStorage.getItem(ACCOUNT_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function saveAccount(a){try{localStorage.setItem(ACCOUNT_KEY,JSON.stringify(a));}catch(e){}}
// Tài khoản có thể chỉ có Tên + SĐT (đăng ký thành viên, không mật khẩu) hoặc có thêm khóa app bằng mật khẩu
function hasLock(a){return !!(a&&(a.h||typeof a.pass==='string'));}
function signedIn(){const a=getAccount();return !!a&&(loggedIn||!hasLock(a));}
function randSalt(){
 const a=new Uint8Array(12);
 try{crypto.getRandomValues(a);}catch(e){for(let i=0;i<a.length;i++)a[i]=Math.random()*256|0;}
 return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPass(pass,salt){
 const s=salt+':'+pass;
 try{
  if(window.crypto&&crypto.subtle){
   const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
   return Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('');
  }
 }catch(e){}
 let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
 return 'f'+(h>>>0).toString(16);
}
async function makeAccount(name,phone,pass){const salt=randSalt();return {name:name,phone:phone,salt:salt,len:pass.length,h:await hashPass(pass,salt)};}
// Tạo lại tài khoản với mật khẩu mới nhưng giữ thông tin thành viên (mã ID, trạng thái gửi đăng ký)
async function remakeAccount(acc,pass){const n=await makeAccount(acc.name,acc.phone,pass);['memberId','memberSync','rs','rh'].forEach(k=>{if(acc[k])n[k]=acc[k];});return n;}
// Kiểm tra mật khẩu. Tài khoản cũ (lưu mật khẩu dạng chữ) được tự chuyển sang dạng băm.
async function checkPass(acc,pass){
 if(!acc||!pass)return false;
 if(acc.h)return (await hashPass(pass,acc.salt||''))===acc.h;
 if(typeof acc.pass==='string'&&acc.pass===pass){saveAccount(await remakeAccount(acc,pass));return true;}
 return false;
}
(async function(){
 const a=getAccount();
 if(a&&typeof a.pass==='string'&&!a.h)saveAccount(await remakeAccount(a,a.pass));

})();

function normPhone(p){
 p=String(p||'').replace(/[\s.\-()]/g,'');
 if(/^\+84\d{9}$/.test(p))p='0'+p.slice(3);
 else if(/^84\d{9}$/.test(p))p='0'+p.slice(2);
 return p;
}
function validPhone(p){return /^0\d{9}$/.test(normPhone(p));}

   if(r&&r.error&&/đã được đăng ký/i.test(r.error)){delete a.memberSync;saveAccount(a);return 'exists';}
   delete a.memberSync;saveAccount(a);

// ===== Mã khôi phục: dùng khi quên mật khẩu, không mất dữ liệu =====
// Mã chỉ hiện 1 lần lúc tạo. App chỉ lưu bản băm của mã, không lưu mã gốc.
const RC_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
let pendingRecovery=''; // mã vừa tạo, chỉ giữ trong bộ nhớ để hiện cho người dùng chép
function rcNorm(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function rcMake(){
 const a=new Uint32Array(8);
 try{crypto.getRandomValues(a);}catch(e){for(let i=0;i<8;i++)a[i]=Math.random()*4294967296>>>0;}
 const c=Array.from(a,v=>RC_CHARS[v%RC_CHARS.length]).join('');
 return c.slice(0,4)+'-'+c.slice(4);
}
async function rcSet(acc){
 const code=rcMake();
 acc.rs=randSalt(); acc.rh=await hashPass(rcNorm(code),acc.rs);
 pendingRecovery=code;
 return acc;
}
async function rcCheck(acc,code){
 if(!acc||!acc.rh||!code)return false;
 return (await hashPass(rcNorm(code),acc.rs||''))===acc.rh;
}
async function newRecovery(){
 const acc=getAccount(); if(!acc)return;
 const go=async()=>{saveAccount(await rcSet(getAccount()));render();window.scrollTo(0,0);};
 if(acc.rh)openConfirm('Tạo mã khôi phục mới? Mã cũ sẽ không dùng được nữa.',go);
 else go();
}

 // Gõ đủ số ký tự của mật khẩu thì tự kiểm tra (vẫn tính vào số lần nhập sai)

 if(!hasLock(acc)){locked=false;render();return;}
 if(lockWait()>0)return;

 if(tryPass&&await checkPass(acc,tryPass)){
  lockIn='';lockSave({n:0,until:0});locked=false;loggedIn=true;render();setTimeout(maybeShowInstall,500);return;
 }
 let msg='Vui lòng nhập mật khẩu.';
 if(tryPass){
  const s=lockState();s.n=(s.n||0)+1;
  if(s.n>=LOCK_MAX_TRY){s.n=0;s.until=Date.now()+LOCK_WAIT_MS;msg='';}
  else msg='Mật khẩu sai. Bạn còn '+(LOCK_MAX_TRY-s.n)+' lần thử.';
  lockSave(s);
 }
 lockIn='';lockShow();
 const er=document.getElementById('lock-err');if(er)er.textContent=msg;

 if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),300);}

}

function fmt(n){return Math.round(n).toLocaleString('vi-VN');}
function parseAmount(v){const d=(v||'').replace(/[^\d]/g,'');return d?parseInt(d,10):0;}
// Số tiền thực từ ô nhập: nếu chế độ x1.000đ thì nhân 1.000 (trừ khi đang sửa khoản không chẵn nghìn và chưa đổi)
function getAmt(el){
 if(el.dataset.exact)return parseInt(el.dataset.exact,10);
 const a=parseAmount(el.value);
 return amtMode==='x1000'?a*1000:a;
}
function needExact(a){return amtMode==='x1000'&&a%1000!==0;}
function editVal(a){return needExact(a)?fmt(a):(amtMode==='x1000'?fmt(a/1000):fmt(a));}
function hintText(v,exact){
 if(amtMode!=='x1000'||exact)return '';
 const d=parseAmount(v);return d?'= '+fmt(d*1000)+' ₫':'';
}
function formatAmountInput(el){
 delete el.dataset.exact;
 const digits=el.value.replace(/[^\d]/g,'');
 el.value=digits?Number(digits).toLocaleString('vi-VN'):'';
 const h=el.parentNode.querySelector('.amt-hint');
 if(h)h.textContent=hintText(el.value,'');
}
function amtInput(id,val,exact,extra){
 return `<input type="text" inputmode="numeric" id="${id}" placeholder="${amtMode==='x1000'?'0 (tự nhân 1.000đ)':'0'}" value="${val}" ${exact?'data-exact="'+exact+'"':''} oninput="formatAmountInput(this);${extra||''}"><div class="amt-hint">${hintText(val,exact)}</div>`;
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

function totalIncome(){return tx.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);}
function totalExpense(){return tx.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);}
function balance(){return totalIncome()-totalExpense();}
function pctEnjoy(){return 100-(pct.essential+pct.education+pct.saving+pct.invest+pct.share);}
function jarPct(k){return k==='enjoy'?pctEnjoy():pct[k];}
function jarAllocated(k){return totalIncome()*jarPct(k)/100;}
function jarSpent(k){return tx.filter(t=>t.type==='out'&&t.jar===k).reduce((s,t)=>s+t.amount,0);}
// Chuyển tiền giữa các ví (type 'tr'): không tính vào tổng thu, tổng chi
function jarTrIn(k){return tx.filter(t=>t.type==='tr'&&t.to===k).reduce((s,t)=>s+t.amount,0);}
function jarTrOut(k){return tx.filter(t=>t.type==='tr'&&t.from===k).reduce((s,t)=>s+t.amount,0);}
function jarRemain(k){return jarAllocated(k)-jarSpent(k)+jarTrIn(k)-jarTrOut(k);}
function deleteTx(id){
 const t=tx.find(x=>x.id===id);
 if(t&&t.st)subStar();
 tx=tx.filter(x=>x.id!==id);persist();render();
}
function jarOf(k){return JARS.find(j=>j.k===k)||{i:'',l:k};}
function monthKey(ts){return dayKey(new Date(ts)).slice(0,7);}

const BACKUP_PREFIX=['6pay','wg_','dg_','vnh_','vnv_','zh_','math_'];
const LASTBACKUP_KEY='6pay-lastbackup';
const BACKUP_SKIP=['6pay-account-v1','6pay-session-v1','6pay-guides-cache-v1','6pay-clicks-v1','6pay-lockfail-v1','6pay-lastbackup'];
const OLD_BACKUP_KEYS=['6pay-state-v1','6pay-stars-v1','6pay-streak-v1','6pay-plan-v1','6pay-plandone-v1','6pay-quiz-v1','6pay-debts-v1','6pay-read-v1','6pay-fs-v1','6pay-notes-v1','6pay-goals-v1','6pay-bills-v1','6pay-pomo-v1','vnh_history_v1','vnv_travel_v1'];
function allLsKeys(){const a=[];try{for(let i=0;i<localStorage.length;i++)a.push(localStorage.key(i));}catch(e){}return a;}
function isAppKey(k){return !!k&&BACKUP_PREFIX.some(p=>k.indexOf(p)===0);}
function appKeys(){return allLsKeys().filter(isAppKey);}
function backupKeys(){const skip=BACKUP_SKIP.concat([typeof GUIDES_CACHE_KEY!=='undefined'?GUIDES_CACHE_KEY:'',typeof CLICK_LOG_KEY!=='undefined'?CLICK_LOG_KEY:'']);return appKeys().filter(k=>skip.indexOf(k)<0);}
function downloadFile(file,name){

function lastBackupDays(){let t=0;try{t=parseInt(localStorage.getItem(LASTBACKUP_KEY),10)||0;}catch(e){}return t?Math.floor((Date.now()-t)/86400000):-1;}

function backupImport(inp){
 const f=inp.files&&inp.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=function(){
  let o=null;
  try{o=JSON.parse(r.result);}catch(e){}
  inp.value='';
  if(!o||o.app!=='6pay'||!o.data||typeof o.data!=='object'){
   notify('File không hợp lệ. Hãy chọn đúng file sao lưu 6PAY (đuôi .json).');
   return;
  }
  openConfirm('Khôi phục sẽ THAY THẾ toàn bộ dữ liệu hiện có trên máy bằng dữ liệu trong file. Bạn có chắc không?',function(){
   // File mới (fmt:2) thay toàn bộ dữ liệu sao lưu được; file cũ chỉ thay các mục mà bản cũ có sao lưu
   const keys=o.fmt>=2?backupKeys():OLD_BACKUP_KEYS;
   keys.forEach(k=>{try{if(typeof o.data[k]!=='string')localStorage.removeItem(k);}catch(e){}});
   Object.keys(o.data).forEach(k=>{
    if(!isAppKey(k)||BACKUP_SKIP.indexOf(k)>=0||typeof o.data[k]!=='string')return;
    try{localStorage.setItem(k,o.data[k]);}catch(e){}
   });
   try{localStorage.setItem(LASTBACKUP_KEY,String(Date.now()));localStorage.removeItem('6pay-session-v1');}catch(e){}
   location.reload();
  });
 };
 r.readAsText(f);
}

function confirmExpense(jar){
 const el=document.getElementById('out-amount'); const amt=getAmt(el);
 if(!amt||amt<=0){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),300);return;}
 const note=(document.getElementById('out-note').value||'').trim();
 const ds=(document.getElementById('out-date')||{}).value||'';
 let moved='',chkJar=jar;
 if(expDraft.editId){
  const t=tx.find(x=>x.id===expDraft.editId);
  if(t){
   const nj=(document.getElementById('out-jar')||{}).value||t.jar;
   if(nj!==t.jar){moved=jarOf(nj).i+' '+jarOf(nj).l;}
   t.amount=amt;t.note=note;t.jar=nj;t.ts=tsFromDate(ds,t.ts);chkJar=nj;
   if(expDraft.tag)t.tag=expDraft.tag;else delete t.tag;
  }
 }
 else{const nt={id:uid(),type:'out',jar,amount:amt,note,ts:tsFromDate(ds),st:1};const tg=expDraft.tag||tagGuess(note);if(tg)nt.tag=tg;tx.push(nt);addStar();try{localStorage.setItem(LASTJAR_KEY,jar);}catch(e){}}
 expDraft={amount:'',exact:'',note:'',editId:'',date:'',jar:'',tag:'',tagManual:false};
 persist(); render();
 if(moved)notify('Đã chuyển khoản chi sang ví '+moved+'.');
 else limitCheck(chkJar);
}

let qz={phase:'intro',list:[],i:0,score:0,ok:0,streak:0,picked:null,left:15,timer:0,opts:[],newBest:false};
function qzStore(){try{return JSON.parse(localStorage.getItem(QZ_KEY))||{best:0,plays:0};}catch(e){return {best:0,plays:0};}}
function qzShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function openQuiz(){qz.phase='intro';push('quiz');}
function qzStart(){qz.list=qzShuffle(QZ_BANK).slice(0,10);qz.i=0;qz.score=0;qz.ok=0;qz.streak=0;qzAsk();}
function qzAsk(){
 const r=qz.list[qz.i];
 qz.opts=qzShuffle([{t:r[1],c:1},{t:r[2]},{t:r[3]},{t:r[4]}]);
 qz.picked=null;qz.left=15;qz.phase='play';
 clearInterval(qz.timer);qz.timer=setInterval(qzTick,1000);
 render();
}
function qzTick(){
 qz.left--;
 const b=document.getElementById('qz-bar'),s=document.getElementById('qz-sec');
 if(b)b.style.width=(qz.left/15*100)+'%';
 if(s)s.textContent=qz.left+'s';
 if(qz.left<=0)qzPick(-1);
}
function qzPick(k){
 if(qz.picked!==null)return;
 clearInterval(qz.timer);qz.timer=0;qz.picked=k;
 if(k>=0&&qz.opts[k].c){qz.streak++;qz.ok++;qz.score+=100+qz.left*4+Math.min(qz.streak-1,4)*20;sfx('ok');}else{qz.streak=0;sfx('bad');}
 if(qz.i+1>=qz.list.length&&qz.ok>=Math.ceil(qz.list.length*0.8))setTimeout(()=>sfx('win'),700);
 render();
}
function qzNext(){
 if(qz.i<qz.list.length-1&&qz.i+1>=lockFree(qz.list.length)&&!lockIsOpen()){
  lockAsk(()=>{qz.i++;qzAsk();},()=>{qz.list=qz.list.slice(0,qz.i+1);qzNext();});return;
 }
 if(qz.i<qz.list.length-1){qz.i++;qzAsk();return;}
 const st=qzStore();st.plays++;qz.newBest=qz.score>st.best;if(qz.newBest)st.best=qz.score;
 try{localStorage.setItem(QZ_KEY,JSON.stringify(st));}catch(e){}
 qz.phase='done';render();
}

const STREAK_KEY='6pay-streak-v1'; // không còn dùng, giữ để khôi phục file sao lưu cũ không lỗi
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// Chuỗi ngày ghi chép: số ngày liên tiếp có ít nhất 1 khoản thu hoặc chi (tính đến hôm nay hoặc hôm qua)
function streakGet(){
 const days=new Set(tx.filter(t=>t.type==='in'||t.type==='out').map(t=>dayKey(new Date(t.ts))));
 const d=new Date(); const today=dayKey(d);
 if(!days.has(today))d.setDate(d.getDate()-1);
 let n=0; while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1);}
 return {count:n,on:days.has(today)};
}
function streakHtml(){const s=streakGet();return `<span class="streak ${s.on?'on':'off'}" title="Số ngày liên tiếp có ghi chép thu chi"><span class="fl">🔥</span> <span class="sn">${s.count} ngày</span></span>`;}

const SOUND_KEY='6pay-sound-v1';
function soundOn(){try{return localStorage.getItem(SOUND_KEY)!=='0';}catch(e){return true;}}
let _ac=null,_noise=null;
function _acx(){
 try{
  if(!_ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;_ac=new AC();}
  if(_ac.state==='suspended')_ac.resume();
  return _ac;
 }catch(e){return null;}
}
function _tone(ac,f,t,d,type,vol,to){
 const o=ac.createOscillator(),g=ac.createGain();
 o.type=type||'triangle';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.05);
}
function _clap(ac,t,vol){
 if(!_noise){_noise=ac.createBuffer(1,ac.sampleRate*0.2,ac.sampleRate);const d=_noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);}
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
 s.buffer=_noise;f.type='bandpass';f.frequency.value=1400+Math.random()*600;f.Q.value=0.8;g.gain.value=vol||0.35;
 s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);
}
function sfx(k){
 if(!soundOn())return;
 const ac=_acx();if(!ac)return;
 try{
  const t=ac.currentTime+0.02;
  if(k==='ok'){
   [523.25,659.25,783.99,1046.5].forEach((f,i)=>_tone(ac,f,t+i*0.075,0.32,'triangle',0.2));
   [1568,2093,2637].forEach((f,i)=>_tone(ac,f,t+0.3+i*0.05,0.22,'sine',0.06));
  }else if(k==='bad'){
   _tone(ac,330,t,0.16,'square',0.09,300);_tone(ac,220,t+0.17,0.34,'square',0.09,170);
  }else if(k==='win'){
   [392,523.25,659.25,783.99].forEach((f,i)=>_tone(ac,f,t+i*0.12,0.18,'square',0.08));
   _tone(ac,1046.5,t+0.5,0.7,'triangle',0.22);_tone(ac,1318.5,t+0.5,0.7,'triangle',0.12);_tone(ac,1568,t+0.5,0.7,'triangle',0.1);
   for(let i=0;i<12;i++)_clap(ac,t+0.55+i*0.07+Math.random()*0.04,0.25);
   [2093,2637,3136,2637,3136].forEach((f,i)=>_tone(ac,f,t+0.6+i*0.09,0.15,'sine',0.05));
  }
 }catch(e){}
}

// Tải 1 file game: thử lần lượt từng đường dẫn, file nào tải được và chạy được thì dùng
function loadScriptOnce(src){
 return new Promise((ok,ko)=>{
  const s=document.createElement('script');
  s.src=src;s.async=true;
  s.onload=()=>ok(src);
  s.onerror=()=>{s.remove();ko(new Error(src));};
  document.head.appendChild(s);
 });
}
const _gameLoad={};
function loadGame(k){
 if(_gameLoad[k])return _gameLoad[k];
 return _gameLoad[k]=(async()=>{
  const tried=[];
  for(const src of gamePaths(k)){
   try{await loadScriptOnce(src);if(gameReady(k))return src;tried.push(src+' (tải được nhưng không chạy)');}
   catch(e){tried.push(src);}
  }
  delete _gameLoad[k];
  const err=new Error('notfound');err.tried=tried;throw err;
 })();
}
let gameBusy=false;
async function playGame(k){
 if(gameBusy)return;
 if(gameReady(k)){try{gameStart(k);}catch(e){gameErr(e);}return;}
 gameBusy=true;
 const ld=document.getElementById('gameLoading'); if(ld)ld.classList.add('open');
 try{await loadGame(k);}
 catch(e){
  gameBusy=false;if(ld)ld.classList.remove('open');
  if(location.protocol!=='file:'&&!navigator.onLine)notify('Bạn đang không có mạng. Hãy bật mạng rồi mở trò chơi lại. Sau lần mở đầu tiên có mạng, trò chơi sẽ chơi được cả khi không có mạng.');

  return;
 }
 gameBusy=false;if(ld)ld.classList.remove('open');
 try{gameStart(k);}catch(e){gameErr(e);}
}
function gameErr(e){try{console.error(e);}catch(x){}notify('Trò chơi gặp lỗi khi khởi động: '+(e&&e.message||e)+'. Hãy tải lại app rồi thử lại.');}

// Xuất CSV (mở được bằng Excel, Google Sheets). Có BOM để Excel hiện đúng tiếng Việt.
function csvCell(v){v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCsv(){
 if(!tx.length){notify('Chưa có giao dịch nào để xuất.');return;}
 const head=['Ngày','Giờ','Loại','Ví / Nguồn thu','Số tiền (VND)','Ghi chú','Nhãn'];
 const rows=tx.slice().sort((a,b)=>a.ts-b.ts).map(t=>{
  const d=new Date(t.ts);
  const type=t.type==='in'?'Thu':(t.type==='out'?'Chi':'Chuyển ví');
  const where=t.type==='in'?((INCOME_TYPES.find(k=>k.k===t.sub)||{}).l||t.sub):(t.type==='out'?jarOf(t.jar).l:jarOf(t.from).l+' → '+jarOf(t.to).l);
  const amt=t.type==='out'?-t.amount:t.amount;
  return [dateFmt(t.ts),d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}),type,where,amt,t.note||'',(tagOf(t.tag)||{}).l||''];
 });
 const csv='\ufeff'+[head].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n');
 const name='6pay-thu-chi-'+dayKey()+'.csv';
 const file=new File([csv],name,{type:'text/csv'});
 if(detectOS()==='ios'&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Thu chi 6PAY'}).catch(()=>{});return;}
 downloadFile(file,name);
}
// ===== Lịch âm (thuật toán Hồ Ngọc Đức, múi giờ +7) =====
function jdFromDate(dd,mm,yy){var a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;var jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;if(jd<2299161)jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;return jd;}
function lcNewMoon(k){var T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;var Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;Jd1=Jd1+0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);var M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;var Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;var F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;var C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C1=C1-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr);C1=C1-0.0004*Math.sin(dr*3*Mpr);C1=C1+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));C1=C1-0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));C1=C1-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr));C1=C1+0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));var dt;if(T<-11){dt=0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3;}else{dt=-0.000278+0.000265*T+0.000262*T2;}return Jd1+C1-dt;}
function lcSunLong(jdn){var T=(jdn-2451545.0)/36525,T2=T*T,dr=Math.PI/180;var M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;var L0=280.46645+36000.76983*T+0.0003032*T2;var DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);DL=DL+(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);var L=(L0+DL)*dr;L=L-Math.PI*2*Math.floor(L/(Math.PI*2));return L;}
function lcSunSector(dayNumber,tz){return Math.floor(lcSunLong(dayNumber-0.5-tz/24)/Math.PI*6);}
function lcNewMoonDay(k,tz){return Math.floor(lcNewMoon(k)+0.5+tz/24);}
function lcMonth11(yy,tz){var off=jdFromDate(31,12,yy)-2415021,k=Math.floor(off/29.530588853),nm=lcNewMoonDay(k,tz);if(lcSunSector(nm,tz)>=9)nm=lcNewMoonDay(k-1,tz);return nm;}
function lcLeapOffset(a11,tz){var k=Math.floor((a11-2415021.076998695)/29.530588853+0.5),last=0,i=1,arc=lcSunSector(lcNewMoonDay(k+i,tz),tz);do{last=arc;i++;arc=lcSunSector(lcNewMoonDay(k+i,tz),tz);}while(arc!=last&&i<14);return i-1;}
function convertSolar2Lunar(dd,mm,yy,tz){var dayNumber=jdFromDate(dd,mm,yy),k=Math.floor((dayNumber-2415021.076998695)/29.530588853),monthStart=lcNewMoonDay(k+1,tz);if(monthStart>dayNumber)monthStart=lcNewMoonDay(k,tz);var a11=lcMonth11(yy,tz),b11=a11,lunarYear;if(a11>=monthStart){lunarYear=yy;a11=lcMonth11(yy-1,tz);}else{lunarYear=yy+1;b11=lcMonth11(yy+1,tz);}var lunarDay=dayNumber-monthStart+1,diff=Math.floor((monthStart-a11)/29),lunarLeap=0,lunarMonth=diff+11;if(b11-a11>365){var lm=lcLeapOffset(a11,tz);if(diff>=lm){lunarMonth=diff+10;if(diff==lm)lunarLeap=1;}}if(lunarMonth>12)lunarMonth-=12;if(lunarMonth>=11&&diff<4)lunarYear-=1;return [lunarDay,lunarMonth,lunarYear,lunarLeap];}

function noteSearch(v){noteQuery=v;const e=document.getElementById('note-list');if(e)e.innerHTML=noteListHtml();}

function scrNotes(){
 return screenWrap('📝 Sổ ghi chú',`

  `<button class="btn primary" onclick="newNote()">＋ Ghi chú mới</button>`);

function newNote(){noteDraft={id:'',title:'',body:'',color:0,pin:false};push('noteEdit');}
function openNote(id){
 const n=notes.find(x=>x.id===id);if(!n)return;
 noteDraft={id:n.id,title:n.title,body:n.body,color:n.color||0,pin:!!n.pin};
 push('noteEdit');
}
// Tự lưu mỗi khi gõ; ghi chú trống hoàn toàn thì không tạo
function noteTouch(){
 const d=noteDraft, empty=!(d.title||'').trim()&&!(d.body||'').trim();
 let n=d.id?notes.find(x=>x.id===d.id):null;
 if(!n){
  if(empty)return;
  n={id:uid(),title:'',body:'',color:0,pin:false,upd:Date.now()};
  notes.push(n);d.id=n.id;
 }
 n.title=d.title;n.body=d.body;n.color=d.color;n.pin=d.pin;n.upd=Date.now();
 notesSave();
}
function noteSetColor(c){noteDraft.color=c;noteTouch();render();}
function noteTogglePin(){noteDraft.pin=!noteDraft.pin;noteTouch();render();}
function noteDelete(){
 openConfirm('Bạn có chắc muốn xóa ghi chú này không?',function(){
  notes=notes.filter(x=>x.id!==noteDraft.id);notesSave();
  noteDraft={id:'',title:'',body:'',color:0,pin:false};back();
 });
}
function scrNoteEdit(){

  <div class="guide-desc">Ghi chú được tự động lưu khi bạn gõ.</div>`,

}

let calc={e:'',done:false,err:false};
function calcEval(s){
 const t=s.match(/\d+\.?\d*|\.\d+|[+\-×÷%]/g)||[]; let i=0;
 function num(){
  let neg=1; while(t[i]==='-'){neg=-neg;i++;}
  if(i>=t.length||/^[+\-×÷%]$/.test(t[i]))throw 1;
  let v=parseFloat(t[i++])*neg;
  while(t[i]==='%'){v/=100;i++;}
  return v;
 }
 function term(){let v=num();while(t[i]==='×'||t[i]==='÷'){const o=t[i++],r=num();if(o==='×')v*=r;else{if(r===0)throw 2;v/=r;}}return v;}
 function expr(){let v=term();while(t[i]==='+'||t[i]==='-'){const o=t[i++],r=term();v=o==='+'?v+r:v-r;}return v;}
 const v=expr(); if(i<t.length)throw 1; return v;
}
function calcNumStr(v){return String(parseFloat(v.toPrecision(12)));}
function calcDisp(e){
 return e.replace(/\d+\.?\d*|\.\d+/g,tok=>{
  const p=tok.split('.'); let r=(p[0]||'0').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  if(tok.indexOf('.')>-1)r+=','+(p[1]||''); return r;
 }).replace(/([\d,%])([+\-×÷])/g,'$1 $2 ').replace(/-/g,'−');
}
function calcPreview(){
 if(calc.err)return 'Lỗi';
 let e=calc.e.replace(/[+\-×÷]+$/,'');
 if(!e)return '0';
 try{const v=calcEval(e);if(!isFinite(v))return 'Lỗi';const s=calcNumStr(v);return s.indexOf('e')>-1?s:calcDisp(s);}catch(x){return '';}
}
function calcRefresh(){
 const a=document.getElementById('calc-expr'),b=document.getElementById('calc-res');
 if(!a||!b)return;
 a.textContent=calc.done?'':calcDisp(calc.e);
 const r=calcPreview(); b.textContent=r||'';
 b.style.fontSize=(r.length>14?22:(r.length>10?30:40))+'px';
 b.className='calc-res'+(calc.err?' neg':'');
}
function calcKey(k){
 if(calc.err){calc.e='';calc.err=false;calc.done=false;}
 let e=calc.e;
 if(k==='C'){calc.e='';calc.done=false;}
 else if(k==='⌫'){calc.e=calc.done?'':e.slice(0,-1);calc.done=false;}
 else if(k==='='){
  const s=e.replace(/[+\-×÷]+$/,'');
  if(!s){calcRefresh();return;}
  try{
   const v=calcEval(s);
   if(!isFinite(v))throw 2;
   const r=calcNumStr(v);
   calc.e=r.indexOf('e')>-1?'':r; calc.done=true;
  }catch(x){calc.err=true;}
 }
 else if(/\d/.test(k)){
  if(calc.done){e='';calc.done=false;}
  if(e.slice(-1)==='%')return;
  const tok=(e.match(/\d*\.?\d*$/)||[''])[0];
  if(tok==='0'&&k!=='.')e=e.slice(0,-1);
  if(e.length<40)calc.e=e+k;
 }
 else if(k==='.'){
  if(calc.done){e='';calc.done=false;}
  if(e.slice(-1)==='%')return;
  const tok=(e.match(/\d*\.?\d*$/)||[''])[0];
  if(tok.indexOf('.')>-1)return;
  calc.e=e+(tok===''?'0.':'.');
 }
 else if(k==='%'){
  if(/[\d%]$/.test(e)){calc.e=e+'%';calc.done=false;}
 }
 else{ // + - × ÷
  calc.done=false;
  if(e===''){if(k==='-')calc.e='-';}
  else{
   if(/[×÷]$/.test(e)&&k==='-')calc.e=e+k;
   else{
    while(/[+\-×÷]$/.test(e)&&!(e.length===1))e=e.slice(0,-1);

}
function fcRate(v){return parseFloat(String(v||'').replace(',','.'))||0;}
function fcLoan(P,r,n,method){
 const rows=[]; let bal=P,tI=0,tot=0; const rm=r/100/12;
 const pay=method==='annuity'?(rm===0?P/n:P*rm/(1-Math.pow(1+rm,-n))):0;
 for(let k=1;k<=n;k++){
  const i=bal*rm; let pr=method==='annuity'?pay-i:P/n;
  if(k===n)pr=bal;
  const t=pr+i; bal=Math.max(0,bal-pr); tI+=i; tot+=t;
  rows.push([k,pr,i,t,bal]);
 }
 return {rows,tI,tot,first:rows[0][3],last:rows[rows.length-1][3]};
}
function fcSave(P,C,r,n,kind){
 const rm=r/100/12; let bal=P,prin=P,sint=0;
 for(let k=1;k<=n;k++){
  if(kind==='compound'){bal+=bal*rm;}else{sint+=prin*rm;}
  if(C){bal+=C;prin+=C;}
 }
 const final=kind==='compound'?bal:prin+sint;
 return {final,prin,interest:final-prin};
}

function billNext(b){
 const now=new Date(), cr=new Date(b.ts||Date.now());
 let idx=now.getFullYear()*12+now.getMonth()-1;
 const cidx=cr.getFullYear()*12+cr.getMonth();
 if(idx<cidx)idx=cidx;
 for(let i=0;i<26;i++){
  const x=idx+i, yy=Math.floor(x/12), mm=x%12;
  if(b.freq==='y'&&mm+1!==+b.mon)continue;
  const key=yy+'-'+String(mm+1).padStart(2,'0');
  if(b.paid&&b.paid[key])continue;
  const dim=new Date(yy,mm+1,0).getDate();
  return {key:key,due:new Date(yy,mm,Math.min(+b.day||1,dim))};
 }
 return null;
}

function scrBills(){
