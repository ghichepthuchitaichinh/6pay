 const soon=rows.filter(x=>x.d<=7).reduce((s,x)=>s+x.b.amount,0);
 const late=rows.filter(x=>x.d<0).length;
 const month=bills.reduce((s,b)=>s+(b.freq==='y'?b.amount/12:b.amount),0);
 const yearly=billDraft.freq==='y';
 const items=rows.map(x=>{
  const b=x.b, d=x.d, near=d<=(+b.remind||3);
  const st=d<0?`<div class="date debt-late">Quá hạn ${-d} ngày</div>`:(d===0?'<div class="date debt-late">Hạn trả là hôm nay</div>':`<div class="date"${near?' style="color:#B7791F;font-weight:700;"':''}>Còn ${d} ngày</div>`);
  const jar=JARS.find(j=>j.k===b.jar);
  return `<div class="list-item" style="align-items:flex-start;">
   <div class="tx-info">
    <div style="font-weight:600;">${d<0?'🔴':(near?'🟠':'🔔')} ${esc(b.name)}</div>
    <div class="date">${billFreqText(b)}${jar?' · ví '+jar.l:''}</div>
    <div class="date">Hạn kế tiếp: ${planFmt(dayKey(x.n.due))}</div>
    ${st}
   </div>
   <div class="tx-right">
    <span class="neg">${b.amount?fmt(b.amount)+' ₫':'Chưa nhập'}</span>
    <div class="tx-actions">
     <button class="mini-btn" onclick="openBillPay('${b.id}')">✓ Đã trả</button>
     <button class="mini-btn" onclick="openConfirm('Bỏ qua kỳ này (không ghi chi tiêu)?',function(){billSkip('${b.id}')})">⏭</button>
     <button class="mini-btn" onclick="openConfirm('Bạn có chắc muốn xóa khoản này không?',function(){delBill('${b.id}')})">🗑</button>
    </div>
   </div>
  </div>`;}).join('');
 const jarOpts='<option value="">Không ghi vào chi tiêu</option>'+JARS.map(j=>`<option value="${j.k}" ${billDraft.jar===j.k?'selected':''}>${j.i} ${j.l}</option>`).join('');
 const monOpts=Array.from({length:12},(_,i)=>`<option value="${i+1}" ${String(billDraft.mon)===String(i+1)?'selected':''}>Tháng ${i+1}</option>`).join('');
 return screenWrap('🔔 Nhắc hóa đơn & chi định kỳ',`
  <div class="debt-sum"><div class="o">Cần trả trong 7 ngày<b>${fmt(soon)} ₫</b></div><div class="l" style="background:var(--newtx-bg);color:var(--newtx-text);">Chi cố định/tháng<b>${fmt(month)} ₫</b></div></div>
  ${late?`<div class="ins-warn" style="margin-bottom:12px;">⚠️ Bạn có ${late} khoản đã quá hạn.</div>`:''}
  <div class="debt-form">
   <div class="form-row tight"><label>Tên khoản chi</label><input type="text" placeholder="Ví dụ: Tiền điện, tiền nhà, Netflix" value="${qa(billDraft.name)}" oninput="billDraft.name=this.value" id="bill-name"></div>
   <div class="form-row tight"><label>Số tiền (có thể bỏ trống nếu thay đổi mỗi kỳ)</label>${amtInput('bill-amount',billDraft.amount,billDraft.exact,"billDraft.amount=this.value;billDraft.exact='';")}</div>
   <div class="form-row tight"><label>Chu kỳ</label><select class="cv-sel" style="width:100%;" onchange="billDraft.freq=this.value;render()"><option value="m" ${!yearly?'selected':''}>Hằng tháng</option><option value="y" ${yearly?'selected':''}>Hằng năm</option></select></div>
   ${yearly?`<div class="form-row tight"><label>Tháng đến hạn</label><select class="cv-sel" style="width:100%;" onchange="billDraft.mon=this.value">${monOpts}</select></div>`:''}
   <div class="form-row tight"><label>Ngày đến hạn trong tháng (1 đến 31)</label><input type="text" inputmode="numeric" maxlength="2" placeholder="Ví dụ: 5" value="${qa(billDraft.day)}" oninput="this.value=this.value.replace(/\D/g,'');billDraft.day=this.value" id="bill-day"></div>
   <div class="form-row tight"><label>Nhắc trước (số ngày)</label><input type="text" inputmode="numeric" maxlength="2" value="${qa(billDraft.remind)}" oninput="this.value=this.value.replace(/\D/g,'');billDraft.remind=this.value"></div>
   <div class="form-row tight"><label>Khi bấm “Đã trả”, ghi tự động vào chi tiêu của ví</label><select class="cv-sel" style="width:100%;" onchange="billDraft.jar=this.value">${jarOpts}</select></div>
   <button class="btn primary" onclick="addBill()">✓ Thêm khoản chi</button>
  </div>

function addBill(){
 const name=(billDraft.name||'').trim(), day=parseInt(billDraft.day,10);
 const sh=id=>{const w=document.getElementById(id);if(w){w.classList.add('shake');setTimeout(()=>w.classList.remove('shake'),300);}};
 if(!name){sh('bill-name');return;}
 if(!day||day<1||day>31){sh('bill-day');return;}
 const amt=getAmt(document.getElementById('bill-amount'))||0;
 bills.push({id:uid(),name:name,amount:amt,freq:billDraft.freq,day:day,mon:+billDraft.mon||1,remind:Math.min(30,parseInt(billDraft.remind,10)||3),jar:billDraft.jar,paid:{},ts:Date.now()});
 billSave();
 billDraft={name:'',amount:'',exact:'',freq:billDraft.freq,day:'',mon:billDraft.mon,remind:billDraft.remind,jar:billDraft.jar};
 render();
}
function delBill(id){bills=bills.filter(b=>b.id!==id);billSave();render();}
function billSkip(id){
 const b=bills.find(x=>x.id===id);if(!b)return;const n=billNext(b);if(!n)return;
 b.paid=b.paid||{};b.paid[n.key]='skip';billSave();render();
}
function openBillPay(id){
 const b=bills.find(x=>x.id===id);if(!b)return;const n=billNext(b);if(!n)return;
 billPayId=id;billPayKey=n.key;
 const jar=JARS.find(j=>j.k===b.jar);
 document.getElementById('debtPayBox').innerHTML=`
  <p style="font-weight:800;font-size:17px;margin-bottom:4px;">✓ Xác nhận đã trả</p>
  <div class="guide-desc" style="margin:0 0 10px;">${esc(b.name)} · hạn ${planFmt(dayKey(n.due))}</div>
  <div class="form-row" style="text-align:left;"><label>Số tiền thực trả</label>${amtInput('bp-amount',b.amount?editVal(b.amount):'',b.amount&&needExact(b.amount)?String(b.amount):'','')}</div>
  <div class="guide-desc" style="margin:0 0 10px;">${jar?'Sẽ tự ghi vào chi tiêu của ví '+jar.i+' '+jar.l+'.':'Không ghi vào chi tiêu.'}</div>
  <button class="btn primary" style="margin-top:0;" onclick="confirmBillPay()">✓ Xác nhận</button>
  <button class="btn back" onclick="document.getElementById('debtPayModal').classList.remove('open')">Hủy</button>`;
 document.getElementById('debtPayModal').classList.add('open');
}
function confirmBillPay(){
 const el=document.getElementById('bp-amount'), amt=getAmt(el);
 const b=bills.find(x=>x.id===billPayId);if(!b)return;
 if(b.jar&&(!amt||amt<=0)){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),300);return;}
 b.paid=b.paid||{};
 let tid='1';
 if(b.jar){tid=uid();tx.push({id:tid,type:'out',jar:b.jar,amount:amt,note:b.name,ts:Date.now(),st:1});addStar();persist();}
 b.paid[billPayKey]=tid;
 if(amt>0)b.amount=amt;
 billSave();
 document.getElementById('debtPayModal').classList.remove('open');
 render();
}

// ===== Đếm ngược và Pomodoro (nằm trong màn hình Đồng hồ) =====
const POMO_KEY='6pay-pomo-v1';
let pmSet={w:25,s:5,l:15,n:4,done:{}};
try{const p=JSON.parse(localStorage.getItem(POMO_KEY));if(p&&typeof p==='object')pmSet=Object.assign(pmSet,p);}catch(e){}
function pmSave(){try{localStorage.setItem(POMO_KEY,JSON.stringify(pmSet));}catch(e){}}
let swTab='sw', tmTimer=0;
let cd={run:false,end:0,left:0,total:0}, cdIn={h:'',m:'5',s:''};
function pmDur(m){return (m==='w'?pmSet.w:(m==='s'?pmSet.s:pmSet.l))*60000;}
let pm={mode:'w',run:false,end:0,left:pmDur('w'),total:pmDur('w'),cyc:0};
function tmFmt(ms,hours){
 const t=Math.ceil(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
 return (hours||h?h+':'+swPad(m):swPad(m))+':'+swPad(s);
}
function tmBeep(){
 try{
  const A=window.AudioContext||window.webkitAudioContext, c=new A();
  [0,0.3,0.6].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.value=0.25;o.start(c.currentTime+t);o.stop(c.currentTime+t+0.2);});
 }catch(e){}
 try{if(navigator.vibrate)navigator.vibrate([300,150,300,150,300]);}catch(e){}
}
function tmEnsure(){if((cd.run||pm.run)&&!tmTimer)tmTimer=setInterval(tmTick,250);}
function cdLeft(){return cd.run?Math.max(0,cd.end-Date.now()):cd.left;}
function pmLeft(){return pm.run?Math.max(0,pm.end-Date.now()):pm.left;}
function tmTick(){
 if(cd.run){
  const l=cdLeft(), e=document.getElementById('cd-time'), b=document.getElementById('cd-bar');
  if(e)e.textContent=tmFmt(l,cd.total>=3600000);
  if(b)b.style.width=(cd.total?l/cd.total*100:0)+'%';
  if(l<=0)cdFinish();
 }
 if(pm.run){
  const l=pmLeft(), e=document.getElementById('pm-time'), b=document.getElementById('pm-bar');
  if(e)e.textContent=tmFmt(l);
  if(b)b.style.width=(pm.total?l/pm.total*100:0)+'%';
  if(l<=0)pmFinish();
 }
 if(!cd.run&&!pm.run){clearInterval(tmTimer);tmTimer=0;}
}
function cdFinish(){
 cd={run:false,end:0,left:0,total:0};
 tmBeep(); render();
 notify('⏰ Hết giờ đếm ngược!');
}
function cdStart(){
 if(!cd.total){
  const h=parseInt(cdIn.h,10)||0, m=parseInt(cdIn.m,10)||0, s=parseInt(cdIn.s,10)||0;
  const ms=(h*3600+m*60+s)*1000;
  if(ms<=0){const e=document.getElementById('cd-m');if(e){e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),300);}return;}
  cd.total=ms;cd.left=ms;
 }
 cd.end=Date.now()+cd.left;cd.run=true;tmEnsure();render();
}
function cdPause(){cd.left=cdLeft();cd.run=false;render();}
function cdReset(){cd={run:false,end:0,left:0,total:0};render();}
function cdPreset(min){cdIn={h:'',m:String(min),s:''};render();}
function cdBody(){
 const idle=!cd.total;
 const l=cdLeft();
 const view=idle?`
  <div class="cd-in">
   <div><input type="text" inputmode="numeric" maxlength="2" placeholder="0" value="${qa(cdIn.h)}" oninput="this.value=this.value.replace(/\D/g,'');cdIn.h=this.value"><label>giờ</label></div>
   <div><input type="text" inputmode="numeric" maxlength="2" placeholder="0" id="cd-m" value="${qa(cdIn.m)}" oninput="this.value=this.value.replace(/\D/g,'');cdIn.m=this.value"><label>phút</label></div>
   <div><input type="text" inputmode="numeric" maxlength="2" placeholder="0" value="${qa(cdIn.s)}" oninput="this.value=this.value.replace(/\D/g,'');cdIn.s=this.value"><label>giây</label></div>
  </div>
  <div class="cd-presets">${[1,5,10,15,30,60].map(m=>`<button class="mini-btn" onclick="cdPreset(${m})">${m} phút</button>`).join('')}</div>`
  :`<div class="sw-time" id="cd-time">${tmFmt(l,cd.total>=3600000)}</div><div class="qz-bar"><i id="cd-bar" style="width:${l/cd.total*100}%;transition:none;"></i></div>`;
 const left=`<button class="sw-b" ${idle?'disabled':''} onclick="cdReset()">↺ Đặt lại</button>`;
 const right=`<button class="sw-b main ${cd.run?'stop':''}" onclick="${cd.run?'cdPause()':'cdStart()'}">${cd.run?'⏸ Tạm dừng':(idle?'▶ Bắt đầu':'▶ Tiếp tục')}</button>`;
 return view+`<div class="sw-btns">${left}${right}</div><div class="guide-desc" style="text-align:center;">Hết giờ sẽ có âm báo và rung (nếu máy hỗ trợ). Hãy giữ app mở để chuông kêu.</div>`;
}
function pmStart(){pm.end=Date.now()+pm.left;pm.run=true;tmEnsure();render();}
function pmPause(){pm.left=pmLeft();pm.run=false;render();}
function pmReset(){pm.run=false;pm.left=pmDur(pm.mode);pm.total=pm.left;render();}
function pmGoto(m){pm.mode=m;pm.run=false;pm.left=pmDur(m);pm.total=pm.left;render();}
function pmNextMode(){return pm.mode==='w'?(pm.cyc%pmSet.n===0&&pm.cyc>0?'l':'s'):'w';}
function pmSkip(){pmGoto(pmNextMode());}
function pmFinish(){
 const wasWork=pm.mode==='w';
 pm.run=false;
 if(wasWork){
  const t=dayKey();pmSet.done[t]=(pmSet.done[t]||0)+1;pmSave();addStar();pm.cyc++;
 }
 const nxt=pmNextMode();
 pm.mode=nxt;pm.left=pmDur(nxt);pm.total=pm.left;
 tmBeep();render();
 notify(wasWork?'🍅 Hoàn thành 1 phiên tập trung! Bạn nhận thêm 1 điểm ⭐. Đến giờ nghỉ nào.':'⏰ Hết giờ nghỉ, bắt đầu phiên tập trung tiếp theo nhé.');
}
function pmCfg(k,v){
 const lim={w:[1,180],s:[1,60],l:[1,120],n:[2,10]}[k];
 pmSet[k]=Math.min(lim[1],Math.max(lim[0],parseInt(v,10)||pmSet[k]));
 pmSave();
 if(!pm.run){pm.left=pmDur(pm.mode);pm.total=pm.left;}
 render();
}
function pmBody(){
 const l=pmLeft(), today=pmSet.done[dayKey()]||0;
 const lab={w:'🍅 Tập trung',s:'☕ Nghỉ ngắn',l:'🛌 Nghỉ dài'};
 const tabs=['w','s','l'].map(m=>`<button class="ins-tab ${pm.mode===m?'on':''}" onclick="${pm.run?"openConfirm('Đang chạy. Đổi chế độ sẽ đặt lại đồng hồ, bạn có chắc không?',function(){pmGoto('"+m+"')})":"pmGoto('"+m+"')"}">${lab[m]}</button>`).join('');
 const left=`<button class="sw-b" onclick="pmReset()">↺ Đặt lại</button>`;
 const right=`<button class="sw-b main ${pm.run?'stop':''}" onclick="${pm.run?'pmPause()':'pmStart()'}">${pm.run?'⏸ Tạm dừng':'▶ Bắt đầu'}</button>`;
 const num=(k,t)=>`<div class="pct-row"><span>${t}</span><div class="pct-input"><input type="number" min="1" value="${pmSet[k]}" onchange="pmCfg('${k}',this.value)"></div></div>`;
 return `<div class="ins-tabs">${tabs}</div>
  <div class="sw-time" id="pm-time">${tmFmt(l)}</div>
  <div class="qz-bar"><i id="pm-bar" style="width:${pm.total?l/pm.total*100:0}%;transition:none;"></i></div>
  <div class="sw-btns">${left}${right}<button class="sw-b" onclick="pmSkip()">⏭ Bỏ qua</button></div>
  <div class="list-item"><span>Hôm nay đã hoàn thành</span><b>${'🍅'.repeat(Math.min(today,12))||'0'}${today>12?' ×'+today:''}</b></div>
  <div class="guide-desc" style="margin-bottom:8px;">Mỗi phiên tập trung hoàn thành được cộng 1 điểm ⭐. Sau ${pmSet.n} phiên sẽ đến giờ nghỉ dài.</div>
  <div class="lc-h" style="margin:10px 0 6px;">Cài đặt (phút)</div>
  ${num('w','Thời gian tập trung')}${num('s','Nghỉ ngắn')}${num('l','Nghỉ dài')}${num('n','Số phiên trước khi nghỉ dài')}`;
}
function scrStopwatch(){
 const tab=(k,t)=>`<button class="ins-tab ${swTab===k?'on':''}" onclick="swTab='${k}';render()">${t}</button>`;
 const body=swTab==='cd'?cdBody():(swTab==='pm'?pmBody():swBody());
 return screenWrap('⏱️ Đồng hồ',`<div class="ins-tabs">${tab('sw','Bấm giờ')}${tab('cd','Đếm ngược')}${tab('pm','Pomodoro')}</div>`+body);
}

// ---------- Nhãn chi tiêu (không bắt buộc) ----------
// w: từ khóa (viết không dấu) để app tự đoán nhãn từ nội dung. Thêm nhãn mới bằng cách thêm 1 dòng, giữ "khac" ở cuối.
const TAGS=[
 {k:'an',l:'Ăn uống',i:'🍜',w:['an','an sang','an trua','an toi','com','pho','bun','mi','ca phe','cafe','tra sua','tra da','nuoc uong','do an','banh','che','nhau','lau','buffet','an vat','grabfood','shopeefood']},

 {k:'dilai',l:'Đi lại',i:'⛽',w:['xang','do xang','grab','taxi','xe om','gui xe','ve xe','ve tau','may bay','sua xe','rua xe','xe buyt','bus','phi cau duong','xanh sm']},
 {k:'hoadon',l:'Hóa đơn',i:'💡',w:['tien dien','dien','tien nuoc','internet','wifi','cuoc mang','dien thoai','the cao','nap tien','gas','truyen hinh','phi chung cu','phi dich vu']},
 {k:'nha',l:'Nhà cửa',i:'🏠',w:['tien nha','thue nha','tien phong','sua nha','do dung','noi that']},
 {k:'suckhoe',l:'Sức khỏe',i:'💊',w:['thuoc','kham','kham benh','benh vien','bao hiem','nha khoa','vitamin','gym']},
 {k:'concai',l:'Con cái',i:'👶',w:['hoc phi','sua bot','bim','do choi']},
 {k:'hoctap',l:'Học tập',i:'📚',w:['sach','khoa hoc','hoc','lop hoc']},
 {k:'giaitri',l:'Giải trí',i:'🎬',w:['phim','xem phim','karaoke','du lich','di choi','netflix','spotify']},
 {k:'hieuhy',l:'Hiếu hỷ, quà',i:'🎁',w:['dam cuoi','an cuoi','sinh nhat','qua','mung','vieng','tham','bieu','li xi','tu thien']},
 {k:'muasam',l:'Mua sắm',i:'🛍️',w:['quan ao','giay','dep','tui','shopee','lazada','tiki','my pham','mua sam']},
 {k:'khac',l:'Khác',i:'📌',w:[]}
];
function tagOf(k){return k?TAGS.find(t=>t.k===k)||null:null;}
function tagPill(k){const t=tagOf(k);return t?`<span class="tag-pill">${t.i} ${t.l}</span>`:'';}
function normNote(s){return noAccent(String(s||'').trim()).replace(/\s+/g,' ');}
// Đoán nhãn: ưu tiên nhãn đã dùng cho đúng nội dung này trước đây, sau đó mới đoán theo từ khóa
function tagGuess(note){
 const n=normNote(note); if(!n)return '';
 for(let i=tx.length-1;i>=0;i--){const t=tx[i];if(t.type==='out'&&t.tag&&normNote(t.note)===n)return t.tag;}
 const h=' '+n.replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ')+' ';
 for(const t of TAGS){for(const w of t.w){if(h.indexOf(' '+w+' ')>-1)return t.k;}}
 return '';
}
function tagChips(sel,fn){
 return TAGS.map(t=>`<button type="button" class="chip${sel===t.k?' on':''}" onclick="${fn}('${t.k}')">${t.i} ${t.l}</button>`).join('');
}

// ---------- Gợi ý nội dung từ lịch sử ----------
const DEFAULT_SUG=[
 {note:'Ăn sáng',jar:'essential',tag:'an'},{note:'Ăn trưa',jar:'essential',tag:'an'},{note:'Cà phê',jar:'enjoy',tag:'an'},
 {note:'Đi chợ',jar:'essential',tag:'cho'},{note:'Xăng xe',jar:'essential',tag:'dilai'},{note:'Tiền điện',jar:'essential',tag:'hoadon'}
];
function noteStats(){
 const m=new Map(), now=Date.now();
 tx.forEach(t=>{
  if(t.type!=='out'||!t.note)return;
  const k=normNote(t.note); if(!k)return;
  let o=m.get(k); if(!o){o={note:t.note.trim(),n:0,last:0,jar:t.jar,tag:t.tag||'',amt:t.amount};m.set(k,o);}
  o.n++;
  if(t.ts>=o.last){o.last=t.ts;o.note=t.note.trim();o.jar=t.jar;o.tag=t.tag||o.tag;o.amt=t.amount;}
 });
 return [...m.values()].map(o=>{o.score=o.n+Math.max(0,30-(now-o.last)/864e5)/10;return o;}).sort((a,b)=>b.score-a.score);
}
function noteSuggest(q,max){
 const n=normNote(q);
 let list=noteStats();
 if(!n){
  DEFAULT_SUG.forEach(d=>{if(!list.some(o=>normNote(o.note)===normNote(d.note)))list.push(Object.assign({amt:0},d));});
  return list.slice(0,max);
 }
 list=list.concat(DEFAULT_SUG.filter(d=>!list.some(o=>normNote(o.note)===normNote(d.note))).map(d=>Object.assign({amt:0},d)));
 return list.filter(o=>{const k=normNote(o.note);return k!==n&&(k.indexOf(n)===0||k.indexOf(' '+n)>-1);}).slice(0,max);
}
function shortAmt(a){
 if(!a)return '';
 if(a>=1e6&&a%1e5===0)return (a/1e6).toLocaleString('vi-VN')+'tr';

function missedNudge(){
 const days=recDays(); if(!days.size)return '';

 // chỉ nhắc người vẫn đang ghi chép: có ghi trong 7 ngày trước hôm qua

 return `<div class="nudge"><button class="go" onclick="openQuickAdd({date:'${yk}'})">📝 Hôm qua bạn có chi gì không? <b>Ghi bù ›</b></button><button class="x" onclick="nudgeOff()" aria-label="Ẩn lời nhắc hôm nay">✕</button></div>`;

function icsText(time){
 const p=n=>String(n).padStart(2,'0'), d=new Date(), [hh,mi]=time.split(':');
 const start=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+hh+mi+'00';
 const u=new Date(), stamp=u.getUTCFullYear()+p(u.getUTCMonth()+1)+p(u.getUTCDate())+'T'+p(u.getUTCHours())+p(u.getUTCMinutes())+p(u.getUTCSeconds())+'Z';
 return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//6PAY//Nhac ghi chep//VI','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
  'UID:6pay-nhac-ghi-chep-'+Date.now()+'@6pay.vn','DTSTAMP:'+stamp,'DTSTART:'+start,'DURATION:PT5M','RRULE:FREQ=DAILY',
  'SUMMARY:Ghi chép thu chi 6PAY','DESCRIPTION:Mở 6PAY và ghi lại các khoản thu chi hôm nay. https://app.6pay.vn','URL:https://app.6pay.vn',
  'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Ghi chép thu chi 6PAY','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n')+'\r\n';
}

 try{localStorage.setItem(REM_KEY,t);}catch(x){}
 const ics=icsText(t);
 if(detectOS()==='ios'){

// ---------- Báo cáo: nhận xét tự động ----------
function rpInsights(mk,cur,prev,byJar,byTag){
 const out=[];
 if(!cur.i&&!cur.o)return out;
 const pk=mkShift(mk,-1), past=mk<dayKey().slice(0,7);
 if(cur.i>0&&cur.o>0){
  const over=byJar.map(x=>({j:x.j,v:x.v,plan:cur.i*jarPct(x.j.k)/100})).filter(x=>x.plan>0&&x.v>x.plan).sort((a,b)=>b.v/b.plan-a.v/a.plan);
  if(over.length){const o=over[0];out.push(`Ví ${o.j.i} <b>${o.j.l}</b> đã chi ${fmt(o.v)} ₫, vượt kế hoạch ${Math.round((o.v/o.plan-1)*100)}% (kế hoạch ${fmt(o.plan)} ₫).`);}
  else out.push('Tất cả các ví đều chi trong kế hoạch. Làm tốt lắm! 👏');
 }else if(cur.o>0&&!cur.i){
  out.push('Tháng này chưa ghi khoản thu nào, nên chưa so được với kế hoạch 6 ví. Hãy ghi thu nhập ở mục ⬇️ Thu trên trang chủ.');
 }
 const prevJar=k=>tx.filter(t=>t.type==='out'&&t.jar===k&&monthKey(t.ts)===pk).reduce((s,t)=>s+t.amount,0);
 const ups=byJar.map(x=>({j:x.j,v:x.v,p:prevJar(x.j.k)})).filter(x=>x.p>0&&x.v>=x.p*1.2&&x.v-x.p>=50000).sort((a,b)=>(b.v-b.p)-(a.v-a.p));
 if(ups.length){const u=ups[0];out.push(`Bạn chi ví ${u.j.i} <b>${u.j.l}</b> nhiều hơn tháng trước ${Math.round((u.v/u.p-1)*100)}% (thêm ${fmt(u.v-u.p)} ₫).`);}
 else if(past&&prev.o>0&&cur.o>0&&cur.o<=prev.o*0.9)out.push(`Tổng chi giảm ${Math.round((1-cur.o/prev.o)*100)}% so với tháng trước. Tuyệt vời! 🎉`);
 const tagged=byTag.filter(x=>x.t);
 if(tagged.length&&cur.o>0){const t=tagged[0];out.push(`Bạn chi nhiều nhất cho ${t.t.i} <b>${t.t.l}</b>: ${fmt(t.v)} ₫ (${Math.round(t.v/cur.o*100)}% tổng chi).`);}
 if(out.length<3&&cur.i>0){const r=Math.round((cur.i-cur.o)/cur.i*100);if(r>=20)out.push(`Bạn để dành được ${r}% thu nhập tháng này. Hãy giữ thói quen tốt này nhé! 💪`);}
 return out.slice(0,3);
}

// ===== BỘ ĐẾM ẨN DANH (GoatCounter) =====
// Chỉ gửi: đã mở app, mở bằng app đã cài hay trình duyệt, mở trò chơi nào, và mỗi máy tối đa 1 lần/ngày "có ghi chép".
// Không gửi tên, số điện thoại, số tiền, ghi chú hay bất kỳ dữ liệu cá nhân nào.
const GC_DAY_KEY='6pay-gc-day';
function gcCount(path,title){
 if(!GOATCOUNTER_CODE)return;
 const send=()=>{try{window.goatcounter.count({path:path,title:title||path,event:true});}catch(e){}};
 if(window.goatcounter&&window.goatcounter.count)send();else(window._gcq=window._gcq||[]).push(send);
}
(function(){
 if(!GOATCOUNTER_CODE||!/^[a-z0-9-]+$/i.test(GOATCOUNTER_CODE))return;
 if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname))return;
 const sc=document.createElement('script');
 sc.async=true;sc.src='https://gc.zgo.at/count.js';
 sc.setAttribute('data-goatcounter','https://'+GOATCOUNTER_CODE+'.goatcounter.com/count');
 sc.setAttribute('data-goatcounter-settings','{"no_onload":true}');
 sc.onload=()=>{
  try{window.goatcounter.count({path:'/app',title:'Mở app 6PAY'});}catch(e){}
  const q=window._gcq||[];window._gcq=[];q.forEach(f=>f());
 };
 document.head.appendChild(sc);
 const inst=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
 gcCount(inst?'su-kien/mo-app-da-cai':'su-kien/mo-tren-trinh-duyet',inst?'Mở app đã cài ra màn hình':'Mở app trên trình duyệt');
 // Đếm "có ghi chép hôm nay": mỗi máy tối đa 1 lần mỗi ngày
 const _persist=persist;let _n=tx.length;
 persist=function(){_persist.apply(this,arguments);
  if(tx.length>_n){const d=new Date().toISOString().slice(0,10);let last='';try{last=localStorage.getItem(GC_DAY_KEY)||'';}catch(e){}
   if(last!==d){try{localStorage.setItem(GC_DAY_KEY,d);}catch(e){}gcCount('su-kien/ghi-chep-trong-ngay','Có ghi chép trong ngày');}}
  _n=tx.length;};
 const GN={runner:'Bước nhảy tài chính',words:'Học từ vựng tiếng Anh',zh:'Học tiếng Trung',math:'Toán',vnh:'Khám phá lịch sử Việt Nam',vnv:'Khám phá Việt Nam',chess:'Cờ vua',clock:'Dạy trẻ xem đồng hồ'};
 const _play=playGame;
 playGame=function(k){gcCount('tro-choi/'+k,'Trò chơi: '+(GN[k]||k));return _play.apply(this,arguments);};
})();
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});}).catch(()=>{});});

// Tự kiểm tra bản mới: đọc file version.json (vài byte), khác APP_VERSION thì tải lại (chỉ khi đang ở trang chủ, mỗi bản chỉ tải lại 1 lần)
// Khi cập nhật app: đổi APP_VERSION ở đầu file này VÀ số trong version.json cho giống nhau.
let lastCheck=0;
function checkUpdate(){
 if(!navigator.onLine||Date.now()-lastCheck<60000)return;
 lastCheck=Date.now();
 fetch('version.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(o=>{
  const v=o&&o.version;
  if(!v||v===APP_VERSION||stack.length!==1||locked&&document.getElementById('lock-pass')&&lockIn)return;
  let done='';try{done=sessionStorage.getItem('6pay-reloaded')||'';}catch(e){}
  if(done===v)return;
  try{sessionStorage.setItem('6pay-reloaded',v);}catch(e){}
  location.reload();
 }).catch(()=>{});
}
checkUpdate();
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){hiddenAt=Date.now();if(!locked)saveSession();return;}
 if(hiddenAt&&Date.now()-hiddenAt>SESS_MS){
  // quá 5 phút: khởi động lại về trang chủ (có khóa mật khẩu nếu đã đăng ký)
  hiddenAt=0;
  document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open'));
  stack=[{id:'home'}];loggedIn=false;locked=hasLock(getAccount());lockIn='';
  render();
 }else{
  hiddenAt=0;
  if(stack.length===1)render();
 }
 checkUpdate();
});
