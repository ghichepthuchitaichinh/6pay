<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6PAY — Quản lý tài chính cá nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                        success: '#00B42A',
                        danger: '#F53F3F',
                        neutral: '#F2F3F5',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .balance-text {
                font-size: clamp(2rem, 8vw, 3.5rem);
                font-weight: 700;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">
    <!-- Header -->
    <header class="bg-primary text-white py-6 px-4 sm:px-6">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa fa-wallet"></i> 6PAY
            </h1>
            <button id="saveDataBtn" class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg transition">
                <i class="fa fa-download"></i> Lưu dữ liệu
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
        <!-- Thẻ Tổng quan -->
        <section class="bg-white rounded-2xl card-shadow p-6 mb-8 text-center">
            <h2 class="text-gray-500 text-lg mb-2">Số dư hiện tại</h2>
            <p class="balance-text text-primary mb-6" id="soDu">0 ₫</p>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-green-50 rounded-xl p-4">
                    <h3 class="text-gray-600 text-sm">Tổng thu</h3>
                    <p class="text-success text-xl font-bold" id="tongThu">0 ₫</p>
                </div>
                <div class="bg-red-50 rounded-xl p-4">
                    <h3 class="text-gray-600 text-sm">Tổng chi</h3>
                    <p class="text-danger text-xl font-bold" id="tongChi">0 ₫</p>
                </div>
            </div>
        </section>

        <!-- Form nhập giao dịch -->
        <section class="bg-white rounded-2xl card-shadow p-6 mb-8">
            <h3 class="text-xl font-semibold mb-4">Thêm giao dịch mới</h3>
            <form id="transactionForm" class="space-y-4">
                <div class="flex gap-3">
                    <label class="flex items-center gap-2 flex-1">
                        <input type="radio" name="loaiGiaoDich" value="thu" class="accent-success" checked>
                        <span class="text-success font-medium">Thu nhập</span>
                    </label>
                    <label class="flex items-center gap-2 flex-1">
                        <input type="radio" name="loaiGiaoDich" value="chi" class="accent-danger">
                        <span class="text-danger font-medium">Chi tiêu</span>
                    </label>
                </div>
                
                <div>
                    <label class="block text-gray-600 mb-1">Mô tả</label>
                    <input type="text" id="moTa" placeholder="VD: Lương, ăn trưa, điện thoại..." 
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50">
                </div>
                
                <div>
                    <label class="block text-gray-600 mb-1">Số tiền (₫)</label>
                    <input type="number" id="soTien" placeholder="0" min="0" step="1000"
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50">
                </div>
                
                <button type="submit" 
                    class="w-full bg-primary hover:bg-primary/90 text-white py-3 rounded-lg font-medium transition">
                    <i class="fa fa-plus-circle mr-2"></i> Lưu giao dịch
                </button>
            </form>
        </section>

        <!-- Danh sách giao dịch -->
        <section class="bg-white rounded-2xl card-shadow p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold">Lịch sử giao dịch</h3>
                <button id="xoaHetBtn" class="text-gray-400 hover:text-danger text-sm">
                    <i class="fa fa-trash"></i> Xóa hết
                </button>
            </div>
            
            <div id="danhSachGiaoDich" class="space-y-3">
                <p class="text-gray-400 text-center py-4">Chưa có giao dịch nào</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-gray-400 text-sm mt-12">
        <p>© 2026 6PAY — Quản lý tài chính cá nhân. Dữ liệu được lưu cục bộ trên thiết bị của bạn.</p>
    </footer>

    <script>
        // Khai báo biến
        let giaoDichList = JSON.parse(localStorage.getItem('6pay_data')) || [];
        
        // Format tiền tệ VNĐ
        function formatTien(soTien) {
            return new Intl.NumberFormat('vi-VN').format(soTien) + ' ₫';
        }
        
        // Tính toán & cập nhật giao diện
        function capNhatTongQuan() {
            let tongThu = 0, tongChi = 0;
            
            giaoDichList.forEach(gd => {
                if (gd.loai === 'thu') tongThu += gd.soTien;
                else tongChi += gd.soTien;
            });
            
            const soDu = tongThu - tongChi;
            
            document.getElementById('soDu').textContent = formatTien(soDu);
            document.getElementById('tongThu').textContent = formatTien(tongThu);
            document.getElementById('tongChi').textContent = formatTien(tongChi);
        }
        
        // Hiển thị danh sách giao dịch
        function hienThiDanhSach() {
            const container = document.getElementById('danhSachGiaoDich');
            
            if (giaoDichList.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center py-4">Chưa có giao dịch nào</p>';
                return;
            }
            
            container.innerHTML = '';
            [...giaoDichList].reverse().forEach((gd, index) => {
                const item = document.createElement('div');
                item.className = `flex justify-between items-center p-3 rounded-lg ${gd.loai === 'thu' ? 'bg-green-50' : 'bg-red-50'}`;
                item.innerHTML = `
                    <div>
                        <p class="font-medium">${gd.moTa || 'Không có mô tả'}</p>
                        <p class="text-xs text-gray-500">${gd.ngay}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <p class="font-bold ${gd.loai === 'thu' ? 'text-success' : 'text-danger'}">
                            ${gd.loai === 'thu' ? '+' : '-'}${formatTien(gd.soTien)}
                        </p>
                        <button class="text-gray-300 hover:text-danger xoa-gd" data-index="${giaoDichList.length - 1 - index}">
                            <i class="fa fa-times"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
            
            // Gắn sự kiện xóa
            document.querySelectorAll('.xoa-gd').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.currentTarget.dataset.index);
                    if (confirm('Xóa giao dịch này?')) {
                        giaoDichList.splice(idx, 1);
                        luuDuLieu();
                    }
                });
            });
        }
        
        // Lưu dữ liệu vào LocalStorage
        function luuDuLieu() {
            localStorage.setItem('6pay_data', JSON.stringify(giaoDichList));
            capNhatTongQuan();
            hienThiDanhSach();
        }
        
        // Thêm giao dịch mới
        document.getElementById('transactionForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const soTien = parseInt(document.getElementById('soTien').value);
            const moTa = document.getElementById('moTa').value.trim();
            const loai = document.querySelector('input[name="loaiGiaoDich"]:checked').value;
            
            if (!soTien || soTien <= 0) {
                alert('Vui lòng nhập số tiền hợp lệ!');
                return;
            }
            
            giaoDichList.push({
                loai,
                moTa,
                soTien,
                ngay: new Date().toLocaleString('vi-VN')
            });
            
            // Reset form
            document.getElementById('soTien').value = '';
            document.getElementById('moTa').value = '';
            
            luuDuLieu();
        });
        
        // Xóa toàn bộ dữ liệu
        document.getElementById('xoaHetBtn').addEventListener('click', () => {
            if (giaoDichList.length === 0) return;
            if (confirm('Bạn có chắc muốn xóa toàn bộ dữ liệu?')) {
                giaoDichList = [];
                luuDuLieu();
            }
        });
        
        // Tải dữ liệu về máy
        document.getElementById('saveDataBtn').addEventListener('click', () => {
            const dataStr = JSON.stringify(giaoDichList, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `6PAY_dulieu_${new Date().toLocaleDateString('vi-VN').replace(/\//g,'-')}.json`;
            a.click();
        });
        
        // Khởi chạy
        capNhatTongQuan();
        hienThiDanhSach();
    </script>
</body>
</html>
