:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --text:#1B1F23; --text-soft:#6B7280; --border:#E6E9EE;
  --pos:#1D8A4C; --neg:#D8453D;
  --income-bg:#E6F6EC; --income-text:#1D8A4C;
  --expense-bg:#FCEAE9; --expense-text:#D8453D;
  --newtx-bg:#E8F0FC; --newtx-text:#2C5FA8;
  --accent:#2C5FA8; --accent-text:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
}
html{scroll-padding-top:env(safe-area-inset-top,0);}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181C; --surface:#1E2227; --text:#EDEFF2; --text-soft:#9AA1AA; --border:#2C3138;
    --pos:#4FCB84; --neg:#F17870;
    --income-bg:#173323; --income-text:#4FCB84;
    --expense-bg:#33201F; --expense-text:#F17870;
    --newtx-bg:#1B2A40; --newtx-text:#7EA8E0;
    --accent:#3E6FB8; --accent-text:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#15181C; --surface:#1E2227; --text:#EDEFF2; --text-soft:#9AA1AA; --border:#2C3138;
  --pos:#4FCB84; --neg:#F17870;
  --income-bg:#173323; --income-text:#4FCB84;
  --expense-bg:#33201F; --expense-text:#F17870;
  --newtx-bg:#1B2A40; --newtx-text:#7EA8E0;
  --accent:#3E6FB8; --accent-text:#FFFFFF;
}
*{box-sizing:inherit;}
html,body{height:100%;overflow:hidden;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,sans-serif;}
.wrap{max-width:480px;margin:0 auto;height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:10px 14px 12px;display:flex;flex-direction:column;overflow:hidden;}
#app{flex:1;min-height:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:12px;padding:4px 2px 18px;}
.icon-btn{width:44px;height:44px;flex:none;border:1px solid var(--border);background:#FFFFFF;color:#1B1F23;font-size:24px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-btn:active{background:#EDEFF2;}
.brand-title{font-size:22px;font-weight:800;letter-spacing:0.01em;}
.brand-title.small{font-size:17px;font-weight:700;}
.brand-sub{font-size:12.5px;color:var(--text-soft);margin-top:1px;}
.topbar.sub{padding-bottom:8px;}
.home-header{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 2px 10px;}
.home-topbar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:4px;}
.home-topbar .icon-btn{width:42px;height:42px;font-size:19px;border-radius:12px;flex:none;}
.home-topbar .icon-btn.named{width:auto;padding:0 12px;border-radius:20px;gap:6px;background:#FFFFFF;border:1px solid var(--border);font-size:14px;font-weight:600;color:#1B1F23;}
.home-icon-badge{width:50px;height:50px;font-size:30px;border-radius:14px;background:#FFFFFF;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.home-brand{font-size:26px;font-weight:800;letter-spacing:0.02em;}
.home-header .brand-sub{margin-top:1px;font-size:13px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 16px;margin-bottom:8px;cursor:pointer;transition:transform .08s;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card:active{transform:scale(0.99);}
.card-label{font-size:13.5px;color:var(--text-soft);}
.card-amount{font-size:21px;font-weight:700;}
.card.balance .card-amount.pos{color:var(--pos);}
.card.balance .card-amount.neg{color:var(--neg);}
.card.income{background:var(--income-bg);}
.card.income .card-label,.card.income .card-amount{color:var(--income-text);}
.card.expense{background:var(--expense-bg);}
.card.expense .card-label,.card.expense .card-amount{color:var(--expense-text);}
.home-wrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
.ad-box{flex:1 1 180px;min-height:180px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 14px 4px;margin-bottom:6px;}
.ad-title{font-size:13px;font-weight:700;color:var(--text);padding-bottom:6px;line-height:1.35;}
.ad-title a{color:var(--accent);text-decoration:none;}
.ad-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.ver{text-align:center;font-size:10.5px;color:var(--text-soft);opacity:.7;padding:2px 0;}
.ad-item{display:block;padding:13px 0;border-top:1px solid var(--border);color:var(--text);text-decoration:none;font-size:14px;line-height:1.45;}
.ad-item:first-child{border-top:none;}
.ad-item.ph{color:var(--text-soft);font-size:13.5px;}
.home-links{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:6px;font-size:13px;}
.home-links a,.home-links .off{display:inline-flex;align-items:center;gap:6px;}
.lk-ic{width:18px;height:18px;flex:none;}
.home-links a{color:var(--accent);text-decoration:none;font-weight:600;}
.home-links .off{color:var(--text-soft);}
.ad-item b{color:var(--accent);}
.screen-flex{display:flex;flex-direction:column;flex:1;min-height:0;}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.fixed-top{flex:none;}
.screen-flex>.btn,.fixed-bottom .btn{flex:none;}
.center-title{flex:none;text-align:center;font-size:clamp(18px,2.9vh,24px);font-weight:800;padding:6px 4px 8px;}
.center-sub{flex:none;text-align:center;font-size:clamp(12.5px,1.9vh,15px);color:var(--text-soft);padding:0 8px 10px;line-height:1.4;}
.fill-rows{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:8px;margin-bottom:8px;--fl:clamp(14px,2.1vh,18px);--fi:clamp(20px,3vh,28px);--fa:clamp(14px,2.2vh,18px);--fs:clamp(11px,1.5vh,13px);}
.fill-rows.big{--fl:clamp(14px,2.2vh,18px);--fi:clamp(22px,3.4vh,32px);--fa:clamp(14px,2.2vh,18px);--fs:clamp(10.5px,1.5vh,12.5px);}
.fill-rows.two{flex-grow:2;}
.fill-rows.big{overflow-y:auto;-webkit-overflow-scrolling:touch;--fs:clamp(10px,1.35vh,12px);}
.fill-rows.big .fill-row{min-height:auto;overflow:visible;padding-top:6px;padding-bottom:6px;}
.fill-rows.big .fill-row .d{font-style:italic;line-height:1.25;}
.fill-rows.natural{flex:0 0 auto;overflow:visible;gap:10px;}
.fill-rows.natural .fill-row{flex:0 0 auto;min-height:auto;padding-top:15px;padding-bottom:15px;}
.fill-row.xrow.ctr .d{text-align:center;text-align-last:center;text-wrap:balance;}
.fill-row.xrow{flex-direction:column;align-items:stretch;justify-content:center;gap:5px;}
.fill-row.xrow .top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.fill-row.xrow .d{margin-top:0;font-size:clamp(11.5px,1.55vh,13px);font-style:italic;font-weight:400;line-height:1.45;color:var(--text-soft);text-align:center;text-align-last:center;text-wrap:balance;hyphens:none;padding:0 2px;}
.fill-row{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0 14px;cursor:pointer;font-size:var(--fl);font-weight:600;overflow:hidden;}
.fill-row:active{transform:scale(0.99);}
.fill-row .ic{font-size:var(--fi);margin-right:10px;line-height:1;}
.fill-row .lb{display:flex;align-items:center;min-width:0;flex:1;}
.fill-row .tx{display:flex;flex-direction:column;min-width:0;}
.fill-row .d{font-size:var(--fs);font-weight:400;color:var(--text-soft);line-height:1.3;margin-top:2px;}
.fill-row .stack{flex:none;}
.fill-row .am{font-size:var(--fa);font-weight:800;white-space:nowrap;}
.fill-row .sm{font-size:var(--fs);font-weight:600;}
.fill-ads{flex:1 1 0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:8px 14px 4px;margin-bottom:6px;}
@media (max-height:700px){
 .list-item{padding:8px 12px;margin-bottom:6px;}

 .btn{padding:9px;}
 .topbar.sub{padding-bottom:4px;}
 .home-icon-badge{display:none;}
}
.fixed-bottom{flex:none;padding-top:8px;}
.fixed-bottom .btn.primary{margin-top:6px;}
.fixed-bottom .btn.primary:first-child{margin-top:4px;}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:15px;}
.list-item.clickable{cursor:pointer;}
.list-item.clickable:active{transform:scale(0.99);}
.list-item .note{font-size:12.5px;color:var(--text-soft);margin-top:2px;}

.pos{color:var(--pos);font-weight:600;}
.neg{color:var(--neg);font-weight:600;}
.pct-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:15px;}
.pct-row.enjoy{background:var(--newtx-bg);color:var(--newtx-text);font-weight:600;}
.pct-input{display:flex;align-items:center;gap:4px;}

.mode-row{cursor:pointer;}
.amt-opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);margin-bottom:8px;cursor:pointer;}
.amt-opt small{display:block;color:var(--text-soft);font-weight:400;font-size:12px;margin-top:2px;}
.amt-opt.sel{border-color:var(--accent);color:var(--accent);font-weight:700;}
.err{color:var(--neg)!important;}
.err-msg{color:var(--neg);font-size:13px;margin:4px 0 12px;}
.filter-row{display:flex;gap:8px;margin-bottom:8px;}
.filter-row select,.filter-row input{flex:1;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);}

.form-row{margin-bottom:14px;}
.form-row.tight{margin-bottom:6px;}

.amt-hint{font-size:12.5px;color:var(--accent);margin-top:4px;min-height:0;}
.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.btn{font:inherit;font-size:15px;font-weight:700;border:none;border-radius:14px;padding:11px;cursor:pointer;width:100%;}
.btn.primary{background:var(--accent);color:var(--accent-text);margin-top:4px;}
.btn.primary:disabled{opacity:0.45;cursor:not-allowed;}
.btn.back{background:none;color:var(--text-soft);border:1px solid var(--border);margin-top:6px;}

.btn.market{background:var(--newtx-bg);color:var(--newtx-text);}
.empty{text-align:center;color:var(--text-soft);font-size:14.5px;padding:36px 0;}
.guide-desc{font-size:14px;color:var(--text-soft);margin:2px 0 14px;line-height:1.5;}
.guide-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 0 0;padding:14px 16px;margin-bottom:0;font-size:15px;text-decoration:none;color:var(--text);}
.affiliate-note{font-size:11.5px;color:var(--text-soft);background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;padding:5px 16px 8px;margin-bottom:10px;}
.boot-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vw;padding:0 10vw;text-align:center;background:#FFFFFF;transition:opacity .3s ease;}
.boot-splash.hide{opacity:0;pointer-events:none;}
.boot-emoji{font-size:20vw;line-height:1;animation:bootZoom .8s cubic-bezier(.2,1.15,.4,1) forwards;}
@keyframes bootZoom{0%{transform:scale(.55);opacity:0;}55%{opacity:1;}100%{transform:scale(1);opacity:1;}}
.boot-brand{font-size:11vw;line-height:1;font-weight:800;letter-spacing:.02em;opacity:0;animation:bootTaglineIn .5s ease forwards;animation-delay:.3s;}

.guide-item.plain{color:var(--text-soft);}
.guide-cta{color:var(--accent);font-weight:700;font-size:13.5px;white-space:nowrap;}

// Cập nhật gợi ý & link tiếp thị từ xa (guides.json cùng cấu trúc DEFAULT_GUIDES), có cache cho offline.
const GUIDES_URL='https://raw.githubusercontent.com/ghichepthuchitaichinh/6pay/main/guides.json';
const GUIDES_CACHE_KEY='6pay-guides-cache-v1';
let GUIDES=DEFAULT_GUIDES;
try{
  const cachedGuides=localStorage.getItem(GUIDES_CACHE_KEY);
  if(cachedGuides){const d=JSON.parse(cachedGuides); if(d&&typeof d==='object')GUIDES=d;}
}catch(e){}
function applyRemoteGuides(data){
  if(!data||typeof data!=='object')return false;
  const merged={...GUIDES};
  let changed=false;
  JARS.forEach(j=>{
    const g=data[j.k];
    if(g&&Array.isArray(g.items)){
      merged[j.k]={desc:(typeof g.desc==='string'&&g.desc)||(GUIDES[j.k]&&GUIDES[j.k].desc)||'',items:g.items};
      changed=true;
    }
  });
  if(changed){
    GUIDES=merged;
    try{localStorage.setItem(GUIDES_CACHE_KEY,JSON.stringify(GUIDES));}catch(e){}
  }
  return changed;
}
function fetchGuides(){
  if(!GUIDES_URL||GUIDES_URL.indexOf('<')>-1)return;
  const url=GUIDES_URL+(GUIDES_URL.indexOf('?')>-1?'&':'?')+'t='+Date.now();
  fetch(url,{cache:'no-store'})
    .then(r=>r.ok?r.json():null)
    .then(data=>{ if(applyRemoteGuides(data))render(); })
    .catch(()=>{});
}

  }catch(e){}
 }
}

function fmt(n){return Math.round(n).toLocaleString('vi-VN');}
function parseAmount(v){const d=(v||'').replace(/[^\d]/g,'');return d?parseInt(d,10):0;}
// Số tiền thực từ ô nhập: nếu chế độ x1.000đ thì nhân 1.000 (trừ khi đang sửa khoản không chẵn nghìn và chưa đổi)
function getAmt(el){
 if(el.dataset.exact)return parseInt(el.dataset.exact,10);
 const a=parseAmount(el.value);
 return amtMode==='x1000'?a*1000:a;
}
function needExact(a){return amtMode==='x1000'&&a%1000!==0;}
function editVal(a){return needExact(a)?fmt(a):(amtMode==='x1000'?fmt(a/1000):fmt(a));}
function hintText(v,exact){
 if(amtMode!=='x1000'||exact)return '';
 const d=parseAmount(v);return d?'= '+fmt(d*1000)+' ₫':'';
}
function formatAmountInput(el){
 delete el.dataset.exact;
 const digits=el.value.replace(/[^\d]/g,'');
 el.value=digits?Number(digits).toLocaleString('vi-VN'):'';
 const h=el.parentNode.querySelector('.amt-hint');
 if(h)h.textContent=hintText(el.value,'');
}
function amtInput(id,val,exact,extra){
 return `<input type="text" inputmode="numeric" id="${id}" placeholder="${amtMode==='x1000'?'0 (tự nhân 1.000đ)':'0'}" value="${val}" ${exact?'data-exact="'+exact+'"':''} oninput="formatAmountInput(this);${extra||''}"><div class="amt-hint">${hintText(val,exact)}</div>`;
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function dateFmt(ts){const d=new Date(ts);return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});}

function totalIncome(){return tx.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);}
function totalExpense(){return tx.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);}
function balance(){return totalIncome()-totalExpense();}
function pctEnjoy(){return 100-(pct.essential+pct.education+pct.saving+pct.invest+pct.share);}
function jarPct(k){return k==='enjoy'?pctEnjoy():pct[k];}
function jarAllocated(k){return totalIncome()*jarPct(k)/100;}
function jarSpent(k){return tx.filter(t=>t.type==='out'&&t.jar===k).reduce((s,t)=>s+t.amount,0);}
function jarRemain(k){return jarAllocated(k)-jarSpent(k);}
function deleteTx(id){tx=tx.filter(t=>t.id!==id);persist();render();}

let incomeFilter={mode:'all',month:'',year:''};
function matchFilter(t){
 if(incomeFilter.mode==='month'&&incomeFilter.month){const d=new Date(t.ts);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return key===incomeFilter.month;}
 if(incomeFilter.mode==='year'&&incomeFilter.year){return new Date(t.ts).getFullYear()===parseInt(incomeFilter.year,10);}
 return true;
}
let expenseFilter={mode:'all',day:'',month:'',year:''};
function matchExpenseFilter(t){
 if(expenseFilter.mode==='day'&&expenseFilter.day){const d=new Date(t.ts);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return key===expenseFilter.day;}
 if(expenseFilter.mode==='month'&&expenseFilter.month){const d=new Date(t.ts);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return key===expenseFilter.month;}
 if(expenseFilter.mode==='year'&&expenseFilter.year){return new Date(t.ts).getFullYear()===parseInt(expenseFilter.year,10);}
 return true;
}

function confirmExpense(jar){

}

function qzShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function qzAsk(){
 const r=qz.list[qz.i];
 qz.opts=qzShuffle([{t:r[1],c:1},{t:r[2]},{t:r[3]},{t:r[4]}]);
 qz.picked=null;qz.left=15;qz.phase='play';
 clearInterval(qz.timer);qz.timer=setInterval(qzTick,1000);
 render();
}
function qzTick(){
 qz.left--;
 const b=document.getElementById('qz-bar'),s=document.getElementById('qz-sec');
 if(b)b.style.width=(qz.left/15*100)+'%';
 if(s)s.textContent=qz.left+'s';
 if(qz.left<=0)qzPick(-1);
}
function qzPick(k){
 if(qz.picked!==null)return;
 clearInterval(qz.timer);qz.timer=0;qz.picked=k;
 if(k>=0&&qz.opts[k].c){qz.streak++;qz.ok++;qz.score+=100+qz.left*4+Math.min(qz.streak-1,4)*20;}else qz.streak=0;
 render();
}
function qzNext(){
 if(qz.i<qz.list.length-1){qz.i++;qzAsk();return;}
 const st=qzStore();st.plays++;qz.newBest=qz.score>st.best;if(qz.newBest)st.best=qz.score;
 try{localStorage.setItem(QZ_KEY,JSON.stringify(st));}catch(e){}
 qz.phase='done';render();
}
function scrQuiz(){
 const T='🎯 Đố vui tài chính';
 if(qz.phase==='intro'){
  const st=qzStore();
  return screenWrap(T,`
   <div class="guide-desc">10 câu hỏi về quản lý chi tiêu, tiết kiệm và đầu tư. Mỗi câu có 15 giây: trả lời đúng và nhanh để được nhiều điểm, đúng liên tiếp được thưởng thêm.</div>
   <div class="list-item"><span>Điểm cao nhất</span><b>${fmt(st.best)}</b></div>
   <div class="list-item"><span>Số lượt đã chơi</span><b>${st.plays}</b></div>
   <button class="btn primary" style="margin-top:10px;" onclick="qzStart()">▶ Bắt đầu chơi</button>`);
 }
 if(qz.phase==='done'){
  const n=qz.ok,msg=n>=8?'Bạn có nền tảng tài chính rất vững! 🏆':n>=5?'Khá tốt, đọc thêm để chắc hơn nhé 👍':'Đừng lo, mỗi lượt chơi là một lần học thêm 📚';
  return screenWrap('🎯 Kết quả',`
   <div class="qz-big">${fmt(qz.score)}</div>
   <div class="guide-desc" style="text-align:center;">điểm${qz.newBest?' · 🎉 Kỷ lục mới!':''}</div>
   <div class="list-item"><span>Trả lời đúng</span><b>${n}/${qz.list.length}</b></div>
   <div class="guide-desc" style="text-align:center;">${msg}</div>
   <button class="btn primary" onclick="qzStart()">↻ Chơi lại</button>`);
 }
 const r=qz.list[qz.i],ans=qz.picked!==null;
 const body=`<div class="qz-meta"><span>Câu ${qz.i+1}/${qz.list.length}</span><span id="qz-sec">${qz.left}s</span><span>⭐ ${fmt(qz.score)}${qz.streak>1?' · 🔥'+qz.streak:''}</span></div>
  <div class="qz-bar"><i id="qz-bar" style="width:${qz.left/15*100}%"></i></div>
  <div class="qz-q">${r[0]}</div>
  ${qz.opts.map((o,k)=>`<button class="qz-opt ${ans?(o.c?'ok':(k===qz.picked?'bad':'')):''}" ${ans?'disabled':''} onclick="qzPick(${k})">${o.t}</button>`).join('')}
  ${ans?`<div class="qz-exp">${qz.picked===-1?'⏰ Hết giờ! ':(qz.opts[qz.picked].c?'✅ Chính xác! ':'❌ Chưa đúng. ')}${r[5]}</div>`:''}`;
 return screenWrap(T,body,ans?`<button class="btn primary" onclick="qzNext()">${qz.i<qz.list.length-1?'Câu tiếp ›':'Xem kết quả'}</button>`:'');
}
// ===== Chuỗi ngày (ngọn lửa) =====
const STREAK_KEY='6pay-streak-v1';
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function streakGet(){try{return JSON.parse(localStorage.getItem(STREAK_KEY))||{count:0,last:''};}catch(e){return {count:0,last:''};}}
function streakTick(){
 const s=streakGet(),t=dayKey();
 if(s.last===t)return;
 const y=new Date();y.setDate(y.getDate()-1);
 s.count=(s.last===dayKey(y))?s.count+1:1;
 s.last=t;
 try{localStorage.setItem(STREAK_KEY,JSON.stringify(s));}catch(e){}
}
function streakHtml(){const s=streakGet(),on=s.last===dayKey();return `<span class="streak ${on?'on':'off'}"><span class="fl">🔥</span> <span class="sn">${s.count} ngày</span></span>`;}

// ===== 6Pay mở rộng =====
function scrExtra(){
 return screenWrap('🧩 6Pay mở rộng',`
  <div class="list-item clickable" onclick="push('planner')"><span>📅 Kế hoạch trong ngày</span><span class="guide-cta">›</span></div>
  <div class="list-item clickable" onclick="openQuiz()"><span>🎯 Đố vui tài chính</span><span class="guide-cta">›</span></div>`);
}

// ===== Lịch kế hoạch trong ngày =====
const PLAN_KEY='6pay-plan-v1';
let plan={rows:8,data:{}};
try{const p=JSON.parse(localStorage.getItem(PLAN_KEY));if(p&&p.data)plan=p;}catch(e){}
let planDay=dayKey();
function planSave(){try{localStorage.setItem(PLAN_KEY,JSON.stringify(plan));}catch(e){}}
function planRows(){const a=plan.data[planDay]||[];const r=[];for(let i=0;i<Math.max(plan.rows,a.length);i++)r.push(a[i]||{s:'',e:'',c:'',r:''});return r;}
function planSet(i,f,v){const a=plan.data[planDay]=plan.data[planDay]||[];while(a.length<=i)a.push({s:'',e:'',c:'',r:''});a[i][f]=v;planSave();planCnt();}
// Số ngày hoàn thành: ngày có ít nhất 1 dòng kế hoạch và mọi dòng có nội dung đều được đánh dấu v
const RES_IC={v:'✅',x:'❌','':'○'};
// Trạng thái ngày: '' = chưa có kế hoạch, 'done' = mọi dòng có nội dung đều ✅, 'fail' = có kế hoạch nhưng chưa hoàn thành hết
function planStatus(k){
 const u=(plan.data[k]||[]).filter(x=>x&&(x.s||x.e||x.c));
 if(!u.length)return '';
 return u.every(x=>x.r==='v')?'done':'fail';
}
function planDone(){let n=0;for(const k in plan.data)if(planStatus(k)==='done')n++;return n;}
function planCnt(){const e=document.getElementById('plan-cnt');if(e)e.textContent='✅ '+planDone()+' ngày ›';}
function planToggle(i,el){
 const cur=planRows()[i].r;
 const nx=cur==='v'?'x':(cur==='x'?'':'v');
 planSet(i,'r',nx);
 el.className='res-btn '+(nx||'n');el.textContent=RES_IC[nx];
}
function scrPlanner(){
 const q=v=>esc(v).replace(/"/g,'&quot;');
 const rows=planRows().map((x,i)=>{const r=(x.r==='v'||x.r==='x')?x.r:'';return `<tr>
  <td><input type="time" value="${x.s}" onchange="planSet(${i},'s',this.value)"></td>
  <td><input type="time" value="${x.e}" onchange="planSet(${i},'e',this.value)"></td>
  <td><input type="text" value="${q(x.c)}" oninput="planSet(${i},'c',this.value)"></td>
  <td><button class="res-btn ${r||'n'}" onclick="planToggle(${i},this)">${RES_IC[r]}</button></td></tr>`;}).join('');
 return screenWrap('📅 Kế hoạch trong ngày',`
  <div class="form-row tight"><label>Ngày</label><input type="date" value="${planDay}" onchange="planDay=this.value||dayKey();render();"></div>
  <table class="plan"><thead><tr><th>Bắt đầu</th><th>Kết thúc</th><th>Nội dung thực hiện</th><th>Kết quả</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="guide-desc" style="margin-top:8px;">Chạm vào cột Kết quả để chọn: ✅ hoàn thành, ❌ không hoàn thành thêm một chạm. Một ngày chỉ được tính là hoàn thành khi mọi dòng kế hoạch trong ngày đều là ✅. Chạm vào ✅ ở góc phải để xem lịch.</div>`,
  '',`<button class="mini-btn" id="plan-cnt" onclick="openCal()" style="font-size:14px;font-weight:800;color:var(--pos);padding:5px 10px;">✅ ${planDone()} ngày ›</button>`);
}

// ===== Cửa sổ lịch theo dõi ngày hoàn thành =====
let calM={y:0,m:0},calX=0;
function openCal(){const d=new Date();calM={y:d.getFullYear(),m:d.getMonth()};drawCal();document.getElementById('calModal').classList.add('open');}
function closeCal(){document.getElementById('calModal').classList.remove('open');}
function calMove(n){
 calM.m+=n;
 if(calM.m<0){calM.m=11;calM.y--;}
 if(calM.m>11){calM.m=0;calM.y++;}
 drawCal();
}
function calPick(k){planDay=k;closeCal();render();}
function drawCal(){
 const y=calM.y,m=calM.m;
 const off=(new Date(y,m,1).getDay()+6)%7; // thứ Hai đứng đầu tuần
 const days=new Date(y,m+1,0).getDate();
 const today=dayKey();
 let cells='',ok=0,bad=0;
 for(let i=0;i<off;i++)cells+='<div></div>';
 for(let d=1;d<=days;d++){
  const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const s=planStatus(k);
  if(s==='done')ok++; else if(s==='fail')bad++;
  cells+=`<div class="cal-d ${s}${k===today?' today':''}" onclick="calPick('${k}')">${d}</div>`;
 }
 document.getElementById('calBox').innerHTML=`
  <div class="cal-head"><button class="mini-btn" onclick="calMove(-1)">‹</button><b>Tháng ${m+1}/${y}</b><button class="mini-btn" onclick="calMove(1)">›</button></div>
  <div class="cal-grid">${['T2','T3','T4','T5','T6','T7','CN'].map(w=>`<div class="cal-w">${w}</div>`).join('')}${cells}</div>
  <div class="cal-sum"><span class="pos">${ok} ngày hoàn thành</span> · <span class="neg">${bad} ngày chưa hoàn thành</span></div>
  <button class="btn back" style="margin-top:0;" onclick="closeCal()">Đóng</button>`;
}
(function(){
 const cb=document.getElementById('calBox');
 cb.addEventListener('touchstart',e=>{calX=e.changedTouches[0].clientX;},{passive:true});
 cb.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-calX;if(Math.abs(dx)>50)calMove(dx<0?1:-1);},{passive:true});
})();
function scrPlanSettings(){
 return screenWrap('📅 Cài đặt Kế hoạch',`
  <div class="pct-row"><span>Số dòng của bảng</span><div class="pct-input"><input type="number" min="1" max="30" value="${plan.rows}" onchange="plan.rows=Math.min(30,Math.max(1,parseInt(this.value,10)||8));this.value=plan.rows;planSave();"></div></div>
  <button class="btn primary" onclick="openConfirm('Xóa toàn bộ nội dung kế hoạch của ngày đang chọn?',function(){delete plan.data[planDay];planSave();render();})">🗑 Xóa kế hoạch ngày đang chọn</button>`);
}
const SCREENS={
 partner:scrPartner, settings:scrSettings, wallets:scrWallets, jarGuide:scrJarGuide, login:scrLogin, marketing:scrMarketing,
 incomeCategories:scrIncomeCategories, incomeDetail:scrIncomeDetail,
 expenseOverview:scrExpenseOverview, expenseDetail:scrExpenseDetail, quiz:scrQuiz
 ,extra:scrExtra, planner:scrPlanner, ratios:scrRatios, planSettings:scrPlanSettings
};
function render(){
 const top=stack[stack.length-1];
 if(qz.timer&&top.id!=='quiz'){clearInterval(qz.timer);qz.timer=0;}
 document.body.classList.toggle('home-white',top.id==='home');
 document.getElementById('app').innerHTML = top.id==='home' ? scrHome() : SCREENS[top.id](top.opts||{});
}
streakTick();
render();
fetchGuides();
setTimeout(()=>{
 const sp=document.getElementById('bootSplash');
 if(sp){ sp.classList.add('hide'); setTimeout(()=>sp.remove(),300); }
},2700);
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});}).catch(()=>{});});
}
// Tự kiểm tra bản mới: so APP_VERSION đang chạy với bản trên GitHub, khác thì tải lại (chỉ khi đang ở trang chủ, mỗi bản chỉ tải lại 1 lần)
function checkUpdate(){
 if(!navigator.onLine)return;
 fetch('index.html?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
  const m=t.match(/APP_VERSION\s*=\s*'([^']+)'/);
  if(!m||m[1]===APP_VERSION||stack.length!==1)return;
  let done='';try{done=sessionStorage.getItem('6pay-reloaded')||'';}catch(e){}
  if(done===m[1])return;
  try{sessionStorage.setItem('6pay-reloaded',m[1]);}catch(e){}
  location.reload();
 }).catch(()=>{});
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){streakTick();if(stack.length===1)render();checkUpdate();}});
</script>
