<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6PAY — Quản lý tài chính cá nhân</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#8B5A2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="6PAY">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --text:#1B1F23; --text-soft:#6B7280; --border:#E6E9EE;
  --pos:#1D8A4C; --neg:#D8453D;
  --income-bg:#E6F6EC; --income-text:#1D8A4C;
  --expense-bg:#FCEAE9; --expense-text:#D8453D;
  --newtx-bg:#E8F0FC; --newtx-text:#2C5FA8;
  --accent:#2C5FA8; --accent-text:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
}
html{scroll-padding-top:env(safe-area-inset-top,0);}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181C; --surface:#1E2227; --text:#EDEFF2; --text-soft:#9AA1AA; --border:#2C3138;
    --pos:#4FCB84; --neg:#F17870;
    --income-bg:#173323; --income-text:#4FCB84;
    --expense-bg:#33201F; --expense-text:#F17870;
    --newtx-bg:#1B2A40; --newtx-text:#7EA8E0;
    --accent:#3E6FB8; --accent-text:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#15181C; --surface:#1E2227; --text:#EDEFF2; --text-soft:#9AA1AA; --border:#2C3138;
  --pos:#4FCB84; --neg:#F17870;
  --income-bg:#173323; --income-text:#4FCB84;
  --expense-bg:#33201F; --expense-text:#F17870;
  --newtx-bg:#1B2A40; --newtx-text:#7EA8E0;
  --accent:#3E6FB8; --accent-text:#FFFFFF;
}
*{box-sizing:inherit;}
html,body{height:100%;overflow:hidden;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,sans-serif;}
.wrap{max-width:480px;margin:0 auto;height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:10px 14px 12px;display:flex;flex-direction:column;overflow:hidden;}
#app{flex:1;min-height:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:12px;padding:4px 2px 18px;}
.icon-btn{width:44px;height:44px;flex:none;border:1px solid var(--border);background:#FFFFFF;color:#1B1F23;font-size:24px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-btn:active{background:#EDEFF2;}
.brand-title{font-size:22px;font-weight:800;letter-spacing:0.01em;}
.brand-title.small{font-size:17px;font-weight:700;}
.brand-sub{font-size:12.5px;color:var(--text-soft);margin-top:1px;}
.topbar.sub{padding-bottom:8px;}
.home-header{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 2px 10px;}
.home-topbar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:4px;}
.home-topbar .icon-btn{width:42px;height:42px;font-size:19px;border-radius:12px;flex:none;}
.home-topbar .icon-btn.named{width:auto;padding:0 12px;border-radius:20px;gap:6px;background:#FFFFFF;border:1px solid var(--border);font-size:14px;font-weight:600;color:#1B1F23;}
.home-icon-badge{width:50px;height:50px;font-size:30px;border-radius:14px;background:#FFFFFF;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.home-brand{font-size:26px;font-weight:800;letter-spacing:0.02em;}
.home-header .brand-sub{margin-top:1px;font-size:13px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 16px;margin-bottom:8px;cursor:pointer;transition:transform .08s;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card:active{transform:scale(0.99);}
.card-label{font-size:13.5px;color:var(--text-soft);}
.card-amount{font-size:21px;font-weight:700;}
.card.balance .card-amount.pos{color:var(--pos);}
.card.balance .card-amount.neg{color:var(--neg);}
.card.income{background:var(--income-bg);}
.card.income .card-label,.card.income .card-amount{color:var(--income-text);}
.card.expense{background:var(--expense-bg);}
.card.expense .card-label,.card.expense .card-amount{color:var(--expense-text);}
.home-wrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
.ad-box{flex:1 1 220px;min-height:220px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 14px 4px;margin-bottom:6px;}
.ad-title{font-size:11.5px;color:var(--text-soft);padding-bottom:4px;}
.ad-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.ver{text-align:center;font-size:10.5px;color:var(--text-soft);opacity:.7;padding:2px 0;}
.ad-item{display:block;padding:13px 0;border-top:1px solid var(--border);color:var(--text);text-decoration:none;font-size:14px;line-height:1.45;}
.ad-item:first-child{border-top:none;}
.ad-item b{color:var(--accent);}
.screen-flex{display:flex;flex-direction:column;flex:1;min-height:0;}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.fixed-top{flex:none;}
.screen-flex>.btn,.fixed-bottom .btn{flex:none;}
@media (max-height:700px){
 .list-item{padding:8px 12px;margin-bottom:6px;}
 .form-row input{padding:7px 12px;}
 .btn{padding:9px;}
 .topbar.sub{padding-bottom:4px;}
 .home-icon-badge{display:none;}
}
.fixed-bottom{flex:none;padding-top:8px;}
.fixed-bottom .btn.primary{margin-top:6px;}
.fixed-bottom .btn.primary:first-child{margin-top:4px;}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:15px;}
.list-item.clickable{cursor:pointer;}
.list-item.clickable:active{transform:scale(0.99);}
.list-item .note{font-size:12.5px;color:var(--text-soft);margin-top:2px;}
.list-item .date{font-size:11.5px;color:var(--text-soft);margin-top:2px;}
.stack{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;}
.amt-lg{font-size:18px;font-weight:800;}
.tx-info{flex:1;min-width:0;}
.tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.tx-actions{display:flex;gap:6px;}
.mini-btn{border:1px solid var(--border);background:var(--bg);color:var(--text-soft);font-size:13px;border-radius:8px;padding:4px 8px;cursor:pointer;}
.mini-btn:active{background:var(--border);}
.pos{color:var(--pos);font-weight:600;}
.neg{color:var(--neg);font-weight:600;}
.pct-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:15px;}
.pct-row.enjoy{background:var(--newtx-bg);color:var(--newtx-text);font-weight:600;}
.pct-input{display:flex;align-items:center;gap:4px;}
.pct-input input{width:56px;font:inherit;font-size:15px;text-align:right;border:1px solid var(--border);border-radius:8px;padding:6px 6px;background:var(--bg);color:var(--text);}
.mode-row{cursor:pointer;}
.amt-opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);margin-bottom:8px;cursor:pointer;}
.amt-opt small{display:block;color:var(--text-soft);font-weight:400;font-size:12px;margin-top:2px;}
.amt-opt.sel{border-color:var(--accent);color:var(--accent);font-weight:700;}
.err{color:var(--neg)!important;}
.err-msg{color:var(--neg);font-size:13px;margin:4px 0 12px;}
.filter-row{display:flex;gap:8px;margin-bottom:8px;}
.filter-row select,.filter-row input{flex:1;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);}
.filter-total{font-size:14px;color:var(--text-soft);margin-bottom:12px;}
.form-row{margin-bottom:14px;}
.form-row.tight{margin-bottom:6px;}
.form-row label{display:block;font-size:12px;color:var(--text-soft);margin-bottom:3px;}
.form-row input{width:100%;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);}
.form-row input:focus{outline:none;border-color:var(--accent);}
.amt-hint{font-size:12.5px;color:var(--accent);margin-top:4px;min-height:0;}
.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.btn{font:inherit;font-size:15px;font-weight:700;border:none;border-radius:14px;padding:11px;cursor:pointer;width:100%;}
.btn.primary{background:var(--accent);color:var(--accent-text);margin-top:4px;}
.btn.primary:disabled{opacity:0.45;cursor:not-allowed;}
.btn.back{background:none;color:var(--text-soft);border:1px solid var(--border);margin-top:6px;}
.btn.home{background:none;color:var(--accent);border:1px solid var(--accent);margin-top:6px;}
.btn.market{background:var(--newtx-bg);color:var(--newtx-text);}
.empty{text-align:center;color:var(--text-soft);font-size:14.5px;padding:36px 0;}
.guide-desc{font-size:14px;color:var(--text-soft);margin:2px 0 14px;line-height:1.5;}
.guide-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 0 0;padding:14px 16px;margin-bottom:0;font-size:15px;text-decoration:none;color:var(--text);}
.affiliate-note{font-size:11.5px;color:var(--text-soft);background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;padding:5px 16px 8px;margin-bottom:10px;}
.boot-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vw;padding:0 10vw;text-align:center;background:#FFFFFF;transition:opacity .5s ease;}
.boot-splash.hide{opacity:0;pointer-events:none;}
.boot-emoji{font-size:20vw;line-height:1;animation:bootZoom 1.3s cubic-bezier(.2,1.15,.4,1) forwards;}
@keyframes bootZoom{0%{transform:scale(.55);opacity:0;}55%{opacity:1;}100%{transform:scale(1);opacity:1;}}
.boot-brand{font-size:11vw;line-height:1;font-weight:800;letter-spacing:.02em;opacity:0;animation:bootTaglineIn .7s ease forwards;animation-delay:.55s;}
.boot-tagline{font-size:4.6vw;font-weight:700;color:#0D2A6E;max-width:340px;line-height:1.6;opacity:0;animation:bootTaglineIn .8s ease forwards;animation-delay:1.15s;}
@keyframes bootTaglineIn{0%{opacity:0;transform:translateY(12px);}100%{opacity:1;transform:translateY(0);}}
.guide-item.plain{color:var(--text-soft);}
.guide-cta{color:var(--accent);font-weight:700;font-size:13.5px;white-space:nowrap;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;padding:24px;z-index:100;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center;}
.modal-box p{font-size:15px;color:var(--text);margin:0 0 18px;line-height:1.5;}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{margin-top:0;}
.modal-actions .btn.cancel{background:none;color:var(--text-soft);border:1px solid var(--border);}
.modal-actions .btn.confirm{background:var(--accent);color:var(--accent-text);}
</style>
</head>
<body>
<div id="bootSplash" class="boot-splash" aria-hidden="true">
 <div class="boot-emoji">💰</div>
 <div class="boot-brand"><span style="color:#E63946">6</span><span style="color:#F4A300">P</span><span style="color:#2A9D8F">A</span><span style="color:#3E6FB8">Y</span></div>
 <div class="boot-tagline">Hãy ghi chép thường xuyên<br>để tạo thói quen<br>Quản lý tài chính của bạn</div>
</div>
<div class="wrap"><div id="app"></div></div>
<div class="modal-overlay" id="confirmModal">
 <div class="modal-box">
  <p id="confirmModalText"></p>
  <div class="modal-actions">
   <button class="btn cancel" onclick="closeConfirm()">Hủy</button>
   <button class="btn confirm" onclick="runConfirm()">Đồng ý</button>
  </div>
 </div>
</div>
<div class="modal-overlay" id="amtModal" onclick="if(event.target===this)closeAmtModal()">
 <div class="modal-box">
  <p style="font-weight:700;margin-bottom:12px;">Chọn cách nhập số tiền</p>
  <div id="amtModalBody"></div>
 </div>
</div>
<div class="modal-overlay" id="startupNotice">
 <div class="modal-box">
  <p>6Pay tổ chức nhiều sự kiện trao thưởng cho người dùng. Bạn ok chứ?</p>
  <div class="modal-actions">
   <button class="btn confirm" style="width:100%;" onclick="closeNotice()">Tôi đã hiểu</button>
  </div>
 </div>
</div>
<script>
// Mỗi lần sửa index.html trên GitHub, hãy đổi số này (vd. 2026.09.28-2 -> 2026.09.28-3) để máy người dùng tự tải bản mới.
const APP_VERSION='2026.09.28-3';
const JARS=[
 {k:'essential',l:'Thiết yếu',i:'🏠'},
 {k:'education',l:'Học tập',i:'📚'},
 {k:'saving',l:'Tiết kiệm',i:'🐷'},
 {k:'invest',l:'Đầu tư',i:'📈'},
 {k:'share',l:'Chia sẻ',i:'🤝'},
 {k:'enjoy',l:'Hưởng thụ',i:'🎉'}
];
const INCOME_TYPES=[
 {k:'luong',l:'Lương',i:'💼'},
 {k:'thuong',l:'Thưởng',i:'🎁'},
 {k:'dautu',l:'Đầu tư',i:'📈'},
 {k:'khac',l:'Thu khác',i:'➕'}
];
// Danh sách quảng cáo ở màn hình chính (cuộn được). Muốn thêm dòng mới, thêm phần tử vào mảng này.
const ADS=[
 {html:'<b>Luật sư của bạn.</b> Luật sư Trần Hường (Zalo, SĐT 098.55.22.892)',link:'http://zalo.me/0985522892'}
];
// Chữ trên nút mua hàng tiếp thị của từng ví
const MARKET_LABELS={
 essential:'Mua sắm cùng 6Pay',
 education:'Mua sắm cùng 6Pay',
 saving:'Tiết kiệm cùng 6Pay',
 invest:'Đầu tư cùng 6Pay',
 share:'Chia sẻ cùng 6Pay',
 enjoy:'Hưởng thụ cùng 6Pay'
};
const DEFAULT_GUIDES={
 essential:{desc:'Ưu tiên cho nhu cầu sống cơ bản: ăn uống, nhà ở, đi lại, hóa đơn.',items:[
   {label:'Gạo',link:'https://s.shopee.vn/1BMYaoqRlS'},
   {label:'Thực phẩm, đồ dùng gia đình',link:''},
   {label:'Hóa đơn điện, nước, internet',link:''},
   {label:'Xăng xe, di chuyển',link:''}
 ]},
 education:{desc:'Đầu tư cho kiến thức và kỹ năng của bản thân.',items:[
   {label:'Mua sách',link:'https://your-affiliate-link.com/sach'},
   {label:'Đồ dùng học tập',link:'https://your-affiliate-link.com/dungcuhoctap'},
   {label:'Khóa học online',link:'https://your-affiliate-link.com/khoahoc'}
 ]},
 saving:{desc:'Tích lũy cho mục tiêu dài hạn và các tình huống bất ngờ.',items:[
   {label:'Gửi tiết kiệm ngân hàng',link:'https://your-affiliate-link.com/tietkiem'},
   {label:'Ứng dụng tiết kiệm tự động',link:'https://your-affiliate-link.com/apptietkiem'},
   {label:'Quỹ dự phòng khẩn cấp',link:''}
 ]},
 invest:{desc:'Phát triển tài sản thông qua đầu tư dài hạn.',items:[
   {label:'Mở tài khoản chứng khoán',link:'https://your-affiliate-link.com/chungkhoan'},
   {label:'Chứng chỉ quỹ / ETF',link:'https://your-affiliate-link.com/etf'},
   {label:'Khóa học đầu tư',link:'https://your-affiliate-link.com/hocdautu'}
 ]},
 share:{desc:'Chia sẻ với gia đình, bạn bè và cộng đồng.',items:[
   {label:'Quà tặng người thân',link:'https://your-affiliate-link.com/quatang'},
   {label:'Từ thiện, đóng góp cộng đồng',link:''},
   {label:'Hỗ trợ bạn bè khi cần',link:''}
 ]},
 enjoy:{desc:'Tận hưởng cuộc sống, tái tạo năng lượng cho bản thân.',items:[
   {label:'Ăn uống, giải trí',link:'https://your-affiliate-link.com/giaitri'},
   {label:'Du lịch, nghỉ dưỡng',link:'https://your-affiliate-link.com/dulich'},
   {label:'Mua sắm sở thích cá nhân',link:'https://your-affiliate-link.com/muasam'}
 ]}
};

// Cập nhật gợi ý & link tiếp thị từ xa (guides.json cùng cấu trúc DEFAULT_GUIDES), có cache cho offline.
const GUIDES_URL='https://raw.githubusercontent.com/ghichepthuchitaichinh/6pay/main/guides.json';
const GUIDES_CACHE_KEY='6pay-guides-cache-v1';
let GUIDES=DEFAULT_GUIDES;
try{
  const cachedGuides=localStorage.getItem(GUIDES_CACHE_KEY);
  if(cachedGuides){const d=JSON.parse(cachedGuides); if(d&&typeof d==='object')GUIDES=d;}
}catch(e){}
function applyRemoteGuides(data){
  if(!data||typeof data!=='object')return false;
  const merged={...GUIDES};
  let changed=false;
  JARS.forEach(j=>{
    const g=data[j.k];
    if(g&&Array.isArray(g.items)){
      merged[j.k]={desc:(typeof g.desc==='string'&&g.desc)||(GUIDES[j.k]&&GUIDES[j.k].desc)||'',items:g.items};
      changed=true;
    }
  });
  if(changed){
    GUIDES=merged;
    try{localStorage.setItem(GUIDES_CACHE_KEY,JSON.stringify(GUIDES));}catch(e){}
  }
  return changed;
}
function fetchGuides(){
  if(!GUIDES_URL||GUIDES_URL.indexOf('<')>-1)return;
  const url=GUIDES_URL+(GUIDES_URL.indexOf('?')>-1?'&':'?')+'t='+Date.now();
  fetch(url,{cache:'no-store'})
    .then(r=>r.ok?r.json():null)
    .then(data=>{ if(applyRemoteGuides(data))render(); })
    .catch(()=>{});
}

// Ghi lại lượt bấm link tiếp thị (CLICK_LOG_URL tùy chọn, ví dụ Google Apps Script)
const CLICK_LOG_URL='';
const CLICK_LOG_KEY='6pay-clicks-v1';
function trackClick(jarKey,label,link){
 try{
  const logs=JSON.parse(localStorage.getItem(CLICK_LOG_KEY)||'[]');
  logs.push({jar:jarKey,label:label,link:link,ts:Date.now()});
  if(logs.length>500)logs.splice(0,logs.length-500);
  localStorage.setItem(CLICK_LOG_KEY,JSON.stringify(logs));
 }catch(e){}
 if(CLICK_LOG_URL){
  try{
   fetch(CLICK_LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({jar:jarKey,label:label,link:link,ts:Date.now()})});
  }catch(e){}
 }
}

const STORE_KEY='6pay-state-v1';
let pct={essential:50,education:10,saving:5,invest:15,share:5};
let tx=[];
let amtMode='manual'; // 'manual' = tự nhập | 'x1000' = tự động x1.000đ
try{
  const raw=localStorage.getItem(STORE_KEY);
  if(raw){const d=JSON.parse(raw); if(d.pct)pct=d.pct; if(d.tx)tx=d.tx; if(d.amtMode==='x1000')amtMode='x1000';}
}catch(e){}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify({pct,tx,amtMode}));}catch(e){}}

const ACCOUNT_KEY='6pay-account-v1';
let loggedIn=false;
function getAccount(){try{const s=localStorage.getItem(ACCOUNT_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function loginOrRegister(){
 const name=(document.getElementById('auth-name').value||'').trim();
 const phone=(document.getElementById('auth-phone').value||'').trim();
 const pass=document.getElementById('auth-pass').value||'';
 if(!name||!phone||!pass){openConfirm('Vui lòng nhập đầy đủ tên người dùng, số điện thoại và mật khẩu.',function(){});return;}
 const acc=getAccount();
 if(!acc){
  try{localStorage.setItem(ACCOUNT_KEY,JSON.stringify({name,phone,pass}));}catch(e){}
  loggedIn=true; render(); return;
 }
 if(acc.phone===phone&&acc.pass===pass){

 }

function fmt(n){return Math.round(n).toLocaleString('vi-VN');}
function parseAmount(v){const d=(v||'').replace(/[^\d]/g,'');return d?parseInt(d,10):0;}
// Số tiền thực từ ô nhập: nếu chế độ x1.000đ thì nhân 1.000 (trừ khi đang sửa khoản không chẵn nghìn và chưa đổi)
function getAmt(el){
 if(el.dataset.exact)return parseInt(el.dataset.exact,10);
 const a=parseAmount(el.value);
 return amtMode==='x1000'?a*1000:a;
}
function needExact(a){return amtMode==='x1000'&&a%1000!==0;}
function editVal(a){return needExact(a)?fmt(a):(amtMode==='x1000'?fmt(a/1000):fmt(a));}
function hintText(v,exact){
 if(amtMode!=='x1000'||exact)return '';
 const d=parseAmount(v);return d?'= '+fmt(d*1000)+' ₫':'';
}
function formatAmountInput(el){
 delete el.dataset.exact;
 const digits=el.value.replace(/[^\d]/g,'');
 el.value=digits?Number(digits).toLocaleString('vi-VN'):'';
 const h=el.parentNode.querySelector('.amt-hint');
 if(h)h.textContent=hintText(el.value,'');
}
function amtInput(id,val,exact,extra){
 return `<input type="text" inputmode="numeric" id="${id}" placeholder="${amtMode==='x1000'?'0 (tự nhân 1.000đ)':'0'}" value="${val}" ${exact?'data-exact="'+exact+'"':''} oninput="formatAmountInput(this);${extra||''}"><div class="amt-hint">${hintText(val,exact)}</div>`;
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function dateFmt(ts){const d=new Date(ts);return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});}

function totalIncome(){return tx.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);}
function totalExpense(){return tx.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);}
function balance(){return totalIncome()-totalExpense();}
function pctEnjoy(){return 100-(pct.essential+pct.education+pct.saving+pct.invest+pct.share);}
function jarPct(k){return k==='enjoy'?pctEnjoy():pct[k];}
function jarAllocated(k){return totalIncome()*jarPct(k)/100;}
function jarSpent(k){return tx.filter(t=>t.type==='out'&&t.jar===k).reduce((s,t)=>s+t.amount,0);}
function jarRemain(k){return jarAllocated(k)-jarSpent(k);}
function deleteTx(id){tx=tx.filter(t=>t.id!==id);persist();render();}

let incomeFilter={mode:'all',month:'',year:''};
function matchFilter(t){
 if(incomeFilter.mode==='month'&&incomeFilter.month){const d=new Date(t.ts);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return key===incomeFilter.month;}
 if(incomeFilter.mode==='year'&&incomeFilter.year){return new Date(t.ts).getFullYear()===parseInt(incomeFilter.year,10);}
 return true;
}
let expenseFilter={mode:'all',day:'',month:'',year:''};
function matchExpenseFilter(t){
 if(expenseFilter.mode==='day'&&expenseFilter.day){const d=new Date(t.ts);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return key===expenseFilter.day;}
 if(expenseFilter.mode==='month'&&expenseFilter.month){const d=new Date(t.ts);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return key===expenseFilter.month;}
 if(expenseFilter.mode==='year'&&expenseFilter.year){return new Date(t.ts).getFullYear()===parseInt(expenseFilter.year,10);}
 return true;
}

function confirmExpense(jar){
 const el=document.getElementById('out-amount'); const amt=getAmt(el);
 if(!amt||amt<=0){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),300);return;}
 const note=(document.getElementById('out-note').value||'').trim();
 if(expDraft.editId){const t=tx.find(x=>x.id===expDraft.editId);if(t){t.amount=amt;t.note=note;}}
 else{tx.push({id:uid(),type:'out',jar,amount:amt,note,ts:Date.now()});}
 expDraft={amount:'',exact:'',note:'',editId:''};
 persist(); render();
}

function confirmIncome(sub){
 const el=document.getElementById('in-amount'); const amt=getAmt(el);
 if(!amt||amt<=0){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),300);return;}
 const note=(document.getElementById('in-note').value||'').trim();
 if(incDraft.editId){const t=tx.find(x=>x.id===incDraft.editId);if(t){t.amount=amt;t.note=note;}}
 else{tx.push({id:uid(),type:'in',sub,amount:amt,note,ts:Date.now()});}
 incDraft={amount:'',exact:'',note:'',editId:''};
 persist(); render();
}

const SCREENS={
 settings:scrSettings, wallets:scrWallets, jarGuide:scrJarGuide, login:scrLogin, marketing:scrMarketing,
 incomeCategories:scrIncomeCategories, incomeDetail:scrIncomeDetail,
 expenseOverview:scrExpenseOverview, expenseDetail:scrExpenseDetail
};
function render(){
 const top=stack[stack.length-1];
 document.getElementById('app').innerHTML = top.id==='home' ? scrHome() : SCREENS[top.id](top.opts||{});
}
render();
fetchGuides();
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});}).catch(()=>{});});
}
// Tự kiểm tra bản mới: so APP_VERSION đang chạy với bản trên GitHub, khác thì tải lại (chỉ khi đang ở trang chủ, mỗi bản chỉ tải lại 1 lần)
function checkUpdate(){
 if(!navigator.onLine)return;
 fetch('index.html?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
  const m=t.match(/APP_VERSION\s*=\s*'([^']+)'/);
  if(!m||m[1]===APP_VERSION||stack.length!==1)return;
  let done='';try{done=sessionStorage.getItem('6pay-reloaded')||'';}catch(e){}
  if(done===m[1])return;
  try{sessionStorage.setItem('6pay-reloaded',m[1]);}catch(e){}
  location.reload();
 }).catch(()=>{});
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
setTimeout(()=>{
 const sp=document.getElementById('bootSplash');
 if(sp){ sp.classList.add('hide'); setTimeout(()=>sp.remove(),500); }
 const notice=document.getElementById('startupNotice');
 if(notice){
  notice.classList.add('open');
  setTimeout(closeNotice,5000); // tự tắt sau 5 giây nếu người dùng không bấm "Tôi đã hiểu"
 }
},5000);
</script>
